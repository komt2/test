<script>
/* Silver River — procedural music and sound. A plucked-zither voice (Karplus-Strong) plays pentatonic
   phrases over a soft drone; each season uses a different Chinese pentatonic mode. Starts only after a click. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const Au = (G.Audio = {});
  let ctx = null, master = null, musicBus = null, sfxBus = null, verb = null;
  let playing = false, timer = null, mood = 'spring';
  const settings = { music: 0.5, sfx: 0.7 };
  const cache = new Map();

  // gong-mode pentatonic degrees (semitones): do re mi sol la
  const PENTA = [0, 2, 4, 7, 9];
  const MODES = {
    spring: { root: 62, deg: 0, tempo: 76 },
    summer: { root: 67, deg: 0, tempo: 84 },
    autumn: { root: 69, deg: 4, tempo: 70 },
    winter: { root: 64, deg: 1, tempo: 64 },
    night: { root: 60, deg: 4, tempo: 58 },
    title: { root: 64, deg: 4, tempo: 60 },
    festival: { root: 67, deg: 0, tempo: 96 },
    sad: { root: 57, deg: 4, tempo: 54 },
  };

  function mtof(m) {
    return 440 * Math.pow(2, (m - 69) / 12);
  }

  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
    musicBus = ctx.createGain();
    sfxBus = ctx.createGain();
    musicBus.gain.value = settings.music * 0.5;
    sfxBus.gain.value = settings.sfx * 0.6;
    // simple generated reverb
    verb = ctx.createConvolver();
    const len = ctx.sampleRate * 2.6;
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    verb.buffer = ir;
    const wet = ctx.createGain();
    wet.gain.value = 0.35;
    verb.connect(wet).connect(master);
    musicBus.connect(master);
    musicBus.connect(verb);
    sfxBus.connect(master);
    sfxBus.connect(verb);
    return true;
  }

  // Karplus-Strong plucked string rendered once per pitch and cached
  function pluckBuffer(freq) {
    const key = Math.round(freq * 10);
    if (cache.has(key)) return cache.get(key);
    const sr = ctx.sampleRate;
    const dur = 2.4;
    const buf = ctx.createBuffer(1, Math.floor(sr * dur), sr);
    const out = buf.getChannelData(0);
    const N = Math.max(2, Math.round(sr / freq));
    const ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    let idx = 0, prev = 0;
    for (let i = 0; i < out.length; i++) {
      const cur = ring[idx];
      const next = 0.5 * (cur + prev) * 0.996;
      prev = cur;
      ring[idx] = next;
      out[i] = cur * (i < 40 ? i / 40 : 1);
      idx = (idx + 1) % N;
    }
    cache.set(key, buf);
    return buf;
  }

  function pluck(midi, when, vel = 0.5, bus = musicBus, bend = 0) {
    const src = ctx.createBufferSource();
    src.buffer = pluckBuffer(mtof(midi));
    const g = ctx.createGain();
    g.gain.setValueAtTime(vel, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 2.3);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3200;
    if (bend) {
      src.playbackRate.setValueAtTime(1, when + 0.25);
      src.playbackRate.linearRampToValueAtTime(Math.pow(2, bend / 12), when + 0.55);
    }
    src.connect(lp).connect(g).connect(bus);
    src.start(when);
    src.stop(when + 2.4);
  }

  // breathy bamboo-flute-like tone
  function flute(midi, when, dur, vel = 0.12) {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = mtof(midi);
    const vib = ctx.createOscillator();
    vib.frequency.value = 5.2;
    const vg = ctx.createGain();
    vg.gain.value = mtof(midi) * 0.006;
    vib.connect(vg).connect(o.frequency);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vel, when + 0.18);
    g.gain.setValueAtTime(vel, when + dur - 0.2);
    g.gain.linearRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(musicBus);
    o.start(when);
    vib.start(when);
    o.stop(when + dur + 0.05);
    vib.stop(when + dur + 0.05);
  }

  function drone(midi, when, dur) {
    [0, 7].forEach((iv, k) => {
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = mtof(midi - 24 + iv);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(k ? 0.018 : 0.03, when + 1.5);
      g.gain.linearRampToValueAtTime(0.0001, when + dur);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 600;
      o.connect(lp).connect(g).connect(musicBus);
      o.start(when);
      o.stop(when + dur + 0.1);
    });
  }

  function scaleNote(M, step) {
    // step counts pentatonic degrees from the mode's starting degree
    const s = step + M.deg;
    const oct = Math.floor(s / 5);
    const d = ((s % 5) + 5) % 5;
    return M.root + oct * 12 + PENTA[d] - PENTA[M.deg];
  }

  // one 8-bar phrase: stepwise melody on the zither, occasional flute answer
  function phrase(t0) {
    const M = MODES[mood] || MODES.spring;
    const beat = 60 / M.tempo;
    let step = 0;
    const bars = 8;
    drone(scaleNote(M, 0), t0, bars * 3 * beat + 1);
    for (let b = 0; b < bars; b++) {
      const bt = t0 + b * 3 * beat;
      // bass pluck
      pluck(scaleNote(M, b % 4 === 3 ? 3 : 0) - 12, bt, 0.28);
      const pattern = [[0, 1], [1, 0.5], [1.5, 0.5], [2, 1]];
      const rest = Math.random() < 0.25;
      pattern.forEach(([at], i) => {
        if (rest && i > 1) return;
        const move = [-1, 1, 1, -2, 2, 0][Math.floor(Math.random() * 6)];
        step = Math.max(-2, Math.min(7, step + move));
        const cadence = b === bars - 1 && i === pattern.length - 1;
        const note = cadence ? scaleNote(M, 0) : scaleNote(M, step);
        pluck(note, bt + at * beat, 0.22 + Math.random() * 0.1, musicBus, Math.random() < 0.08 ? 2 : 0);
      });
      if (b % 4 === 1 && Math.random() < 0.6) flute(scaleNote(M, step + 5), bt + beat, beat * 3.5, 0.05);
    }
    return bars * 3 * beat;
  }

  function loop() {
    if (!playing || !ctx) return;
    const now = ctx.currentTime + 0.1;
    const dur = phrase(now);
    timer = setTimeout(loop, (dur + (1 + Math.random() * 2)) * 1000);
  }

  Au.start = function () {
    if (!ensure()) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (playing) return;
    playing = true;
    loop();
  };
  Au.stop = function () {
    playing = false;
    clearTimeout(timer);
  };
  Au.setMood = function (m) {
    mood = m;
  };
  Au.setVolume = function (kind, v) {
    settings[kind] = v;
    if (!ctx) return;
    if (kind === 'music') musicBus.gain.value = v * 0.5;
    else sfxBus.gain.value = v * 0.6;
  };
  Au.unlocked = () => !!ctx && ctx.state === 'running';

  // a single zither note (used by the recital mini-game)
  Au.note = function (midi) {
    if (!ctx || ctx.state !== 'running') return;
    pluck(midi, ctx.currentTime + 0.01, 0.34, sfxBus);
  };
  let lastBlip = 0;
  Au.blip = function () {
    if (!ctx || ctx.state !== 'running' || settings.sfx <= 0) return;
    const now = ctx.currentTime;
    if (now - lastBlip < 0.07) return;
    lastBlip = now;
    const o = ctx.createOscillator();
    o.type = 'square';
    o.frequency.value = 520 + Math.random() * 120;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.018, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
    o.connect(g).connect(sfxBus);
    o.start(now);
    o.stop(now + 0.06);
  };

  // ---------- sound effects ----------
  Au.sfx = function (kind) {
    if (!ctx || ctx.state !== 'running' || settings.sfx <= 0) return;
    const t = ctx.currentTime + 0.01;
    const M = MODES.spring;
    switch (kind) {
      case 'tap':
        pluck(M.root + 12, t, 0.18, sfxBus);
        break;
      case 'select':
        pluck(M.root + 7, t, 0.22, sfxBus);
        pluck(M.root + 12, t + 0.06, 0.18, sfxBus);
        break;
      case 'confirm':
        [0, 4, 7, 12].forEach((d, i) => pluck(M.root + d, t + i * 0.07, 0.24, sfxBus));
        break;
      case 'coin':
        pluck(M.root + 24, t, 0.2, sfxBus);
        pluck(M.root + 28, t + 0.08, 0.2, sfxBus);
        break;
      case 'up':
        [0, 2, 4, 7, 9].forEach((d, i) => pluck(M.root + 12 + d, t + i * 0.045, 0.16, sfxBus));
        break;
      case 'down':
        [7, 4, 0].forEach((d, i) => pluck(M.root + d - 5, t + i * 0.09, 0.2, sfxBus));
        break;
      case 'bell':
        pluck(M.root + 19, t, 0.3, sfxBus);
        pluck(M.root + 31, t, 0.1, sfxBus);
        break;
      case 'heart':
        pluck(M.root + 16, t, 0.22, sfxBus);
        pluck(M.root + 19, t + 0.12, 0.22, sfxBus);
        break;
      case 'page':
        pluck(M.root + 2, t, 0.12, sfxBus);
        break;
      // the magpies arrive: a long rising pentatonic cascade, like wings
      case 'bridge': {
        const P = [0, 2, 4, 7, 9];
        for (let i = 0; i < 18; i++) pluck(M.root + P[i % 5] + 12 * Math.floor(i / 5), t + i * 0.13 + Math.random() * 0.03, 0.12 + (i % 5 === 0 ? 0.06 : 0), sfxBus);
        pluck(M.root + 36, t + 18 * 0.13 + 0.1, 0.18, sfxBus);

<script>
/* Silver River — her mind. Temperament, needs, moods, memories, trust, self-esteem, tastes and voice.
   Everything she says or decides flows through here so she stays one consistent person. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const M = (G.Mind = {});

  // ---------------------------------------------------------------- creation
  M.create = function (startAge, parentBg) {
    const traits = {};
    D.TRAITS.forEach((t) => (traits[t.id] = Math.round(U.randf(-38, 38))));
    // two defining traits make each daughter distinct
    U.shuffle(D.TRAITS.map((t) => t.id)).slice(0, 2).forEach((id) => {
      traits[id] = (U.chance(0.5) ? 1 : -1) * U.randInt(55, 82);
    });
    const aff = {};
    D.ACTS.forEach((a) => {
      let v = 0;
      Object.entries(a.aff || {}).forEach(([k, w]) => (v += (traits[k] / 100) * w * 2.4));
      v += U.randf(-0.55, 0.55);
      aff[a.id] = U.clamp(v, -2, 2);
    });
    // a hidden passion and a hidden aversion, to be discovered
    const pool = D.ACTS.filter((a) => !['rest', 'free', 'play', 'journey'].includes(a.id)).map((a) => a.id);
    const passion = U.pick(pool);
    let aversion = U.pick(pool);
    if (aversion === passion) aversion = pool[(pool.indexOf(passion) + 3) % pool.length];
    aff[passion] = U.clamp(aff[passion] + 1.3, -2, 2);
    aff[aversion] = U.clamp(aff[aversion] - 1.2, -2, 2);
    aff.rest = 0.6;
    aff.play = U.clamp(0.5 + traits.playful / 150, -1, 2);
    aff.free = 1.2;
    const fav = {};
    Object.keys(D.FAV).forEach((k) => (fav[k] = U.pick(D.FAV[k])));
    return {
      traits,
      aff,
      passion,
      aversion,
      fav,
      needs: { fun: 70, love: 60, freedom: 70, pride: 50, friends: 50 },
      bond: startAge <= 11 ? 42 : startAge <= 13 ? 38 : 34,
      trust: 50,
      esteem: 50 + Math.round(traits.bold / 5),
      emotion: { kind: 'curious', amt: 40 },
      known: { traits: {}, likes: {}, fav: {}, facts: [] },
      memories: [],
      secrets: [],
      promises: [],
      dream: null,
      dreamHist: [],
      tried: {},
      forced: {},
    };
  };

  // ---------------------------------------------------------------- personality helpers
  M.band = (s) => (s.age <= 12 ? 'kid' : s.age <= 15 ? 'teen' : 'young');
  M.voice = function (s) {
    const t = s.traits;
    const sc = {
      sunny: t.bold * 0.6 + t.playful * 0.8 - t.fiery * 0.15,
      soft: -t.bold * 0.8 - t.fiery * 0.5 + 10,
      sassy: t.fiery * 0.9 + t.bold * 0.3 - t.diligent * 0.2,
      dreamy: t.dreamy * 1.0 - t.diligent * 0.1,
      earnest: t.diligent * 0.8 - t.playful * 0.5,
    };
    return Object.keys(sc).sort((a, b) => sc[b] - sc[a])[0];
  };
  M.addr = (s, cold) => (cold ? (s.parent.role === 'mom' ? 'Mother' : 'Father') : s.parent.address);
  M.affLevel = (v) => (v >= 1.2 ? 'love' : v >= 0.45 ? 'like' : v > -0.45 ? 'neutral' : v > -1.2 ? 'dislike' : 'hate');
  M.AFF_WORDS = { love: 'Loves it', like: 'Likes it', neutral: 'Doesn\'t mind it', dislike: 'Dislikes it', hate: 'Hates it' };

  // fill {P} {name} {act} {food} ... placeholders
  M.fill = function (s, text, vars = {}) {
    return String(text).replace(/\{(\w+)\}/g, (m, k) => {
      if (k in vars) return vars[k];
      if (k === 'P') return M.addr(s);
      if (k === 'Pc') return M.addr(s, true);
      if (k === 'name') return s.name;
      if (s.fav && k in s.fav) return s.fav[k];
      return m;
    });
  };
  // pick a line from a bank keyed by voice (and optionally age band)
  M.pick = function (s, bank, vars) {
    if (!bank) return '';
    if (typeof bank === 'string') return M.fill(s, bank, vars);
    if (Array.isArray(bank)) return M.fill(s, U.pick(bank), vars);
    const band = M.band(s);
    const v = M.voice(s);
    const opts = bank[v + '_' + band] || bank[v] || bank[band] || bank._;
    return M.pick(s, opts, vars);
  };

  // ---------------------------------------------------------------- needs & mood
  M.clampNeeds = (s) => Object.keys(s.needs).forEach((k) => (s.needs[k] = U.clamp(Math.round(s.needs[k]), 0, 100)));
  M.need = function (s, k, d) {
    s.needs[k] = U.clamp((s.needs[k] || 0) + d, 0, 100);
  };
  // seasonal drift: needs slowly empty and teenagers need more freedom
  M.seasonDecay = function (s) {
    const t = s.traits;
    M.need(s, 'fun', -10 - Math.max(0, t.playful) / 20);
    M.need(s, 'love', -7);
    M.need(s, 'freedom', -(3 + Math.max(0, s.age - 12) * 2 + Math.max(0, t.fiery) / 25));
    M.need(s, 'pride', -5);
    M.need(s, 'friends', -7 - Math.max(0, t.bold) / 25);
  };
  M.mood = function (s) {
    const n = s.needs;
    let score = (n.fun - 50) * 0.35 + (n.love - 50) * 0.45 + (n.freedom - 50) * 0.25 + (n.pride - 50) * 0.25 + (n.friends - 50) * 0.25 - Math.max(0, s.stress - 45) * 0.9 + (s.esteem - 50) * 0.2;
    if (s.emotion) {
      const e = s.emotion;
      const sign = { joy: 1, proud: 1, loved: 1, curious: 0.3, sad: -1, angry: -1, hurt: -1, scared: -0.8, lonely: -0.9, guilty: -0.6 }[e.kind] || 0;
      score += sign * e.amt * 0.4;
    }
    score = U.clamp(Math.round(score), -100, 100);
    const label = score > 45 ? 'radiant' : score > 15 ? 'happy' : score > -12 ? 'calm' : score > -38 ? 'low' : 'upset';
    return { score, label };
  };
  M.MOOD_WORDS = { radiant: 'Radiant', happy: 'Happy', calm: 'Calm', low: 'Low', upset: 'Upset' };
  M.restingExpr = function (s) {
    const m = M.mood(s);
    if (s.stress >= 75) return 'tired';
    if (s.emotion && s.emotion.amt > 40) {
      const map = { joy: 'happy', proud: 'determined', loved: 'love', sad: 'sad', angry: 'pout', hurt: 'sad', scared: 'worried', lonely: 'sad', guilty: 'worried', curious: 'thinking' };
      if (map[s.emotion.kind]) return map[s.emotion.kind];
    }
    return { radiant: 'happy', happy: 'happy', calm: 'neutral', low: 'sad', upset: 'pout' }[m.label];
  };
  M.feel = function (s, kind, amt) {
    if (!s.emotion || amt >= s.emotion.amt * 0.7) s.emotion = { kind, amt: U.clamp(amt, 0, 100) };
  };
  M.coolDown = function (s) {
    if (s.emotion) s.emotion.amt = Math.round(s.emotion.amt * 0.45);
  };

  // relationship
  // closeness is easy to lose and slow to earn once it is already high
  M.bond = function (s, d) {
    if (d > 0) d = Math.max(1, Math.round(d * (1 - s.bond / 135)));
    s.bond = U.clamp(s.bond + d, 0, 100);
    return d;
  };
  M.trust = (s, d) => (s.trust = U.clamp(s.trust + d, 0, 100));
  M.esteem = (s, d) => (s.esteem = U.clamp(s.esteem + d, 0, 100));
  M.parent = function (s, warmth, control) {
    s.parenting.warmth = U.clamp(s.parenting.warmth + warmth, -100, 100);
    s.parenting.control = U.clamp(s.parenting.control + control, -100, 100);
  };
  M.style = function (s) {
    const W = s.parenting.warmth, C = s.parenting.control;
    if (W >= 15 && C >= 15) return { id: 'lantern', name: 'The Steady Lantern', desc: 'Warm and firm. She always knows where she stands with you.' };
    if (W >= 15 && C <= -5) return { id: 'sky', name: 'The Open Sky', desc: 'Warm and free. You let her find her own way.' };
    if (W >= 15) return { id: 'willow', name: 'The Willow', desc: 'Warm and patient. You bend, but you don\'t break.' };
    if (W <= -5 && C >= 15) return { id: 'gate', name: 'The Iron Gate', desc: 'Strict and distant. She obeys, but she doesn\'t confide.' };
    if (W <= -5) return { id: 'mountain', name: 'The Far Mountain', desc: 'Present but distant. She is learning to rely on herself.' };
    return { id: 'river', name: 'The Quiet River', desc: 'Calm and steady. Still finding your rhythm together.' };
  };
  M.trustWord = (s) => (s.trust >= 80 ? 'with her whole heart' : s.trust >= 60 ? 'deeply' : s.trust >= 40 ? 'mostly' : s.trust >= 20 ? 'a little' : 'barely');

  // ---------------------------------------------------------------- memory & knowledge
  M.remember = function (s, m) {
    if (m.id && s.memories.some((x) => x.id === m.id)) return;
    s.memories.push(Object.assign({ turn: s.turn, age: s.age, weight: 5, val: 1, tags: [] }, m));
  };
  M.recall = function (s, filter) {
    const list = s.memories.filter((m) => !filter || (typeof filter === 'function' ? filter(m) : m.tags.includes(filter)));
    if (!list.length) return null;
    return list.map((m) => ({ m, sc: m.weight * (0.6 + 0.4 / (1 + (s.turn - m.turn) / 6)) })).sort((a, b) => b.sc - a.sc)[0].m;
  };
  M.learn = function (s, kind, key, text) {
    const k = s.known;
    if (kind === 'trait') {
      if (k.traits[key]) return false;
      k.traits[key] = true;
      return true;
    }
    if (kind === 'like') {
      if (k.likes[key]) return false;
      k.likes[key] = true;
      return true;
    }
    if (kind === 'fav') {
      if (k.fav[key]) return false;
      k.fav[key] = true;
      return true;
    }
    if (kind === 'fact') {
      if (k.facts.includes(text)) return false;
      k.facts.push(text);
      return true;
    }
    return false;
  };
  M.knows = (s, kind, key) => !!(s.known[kind === 'fav' ? 'fav' : kind === 'like' ? 'likes' : 'traits'] || {})[key];

  // ---------------------------------------------------------------- reactions to a planned activity
  const REACT = {
    love: {
      sunny: ['Yes! {act}! Best season ever!', 'Really? {act}? I could hug you!'],
      soft: ['Oh... {act}? Thank you. I really hoped for that.', 'Mm! I\'ll do my very best at {act}.'],
      sassy: ['Finally, something good.', '{act}? Okay, you\'re forgiven for everything.'],
      dreamy: ['{act}... I dreamed about it last night. It\'s a sign.', 'It\'s like you read my mind.'],
      earnest: ['Thank you. I\'ve been practicing for this.', 'I won\'t waste a single day of it.'],
    },
    like: {
      sunny: ['Ooh, fun!', 'Okay, okay, I like this one.'],
      soft: ['That sounds nice.', 'Okay. I like that one.'],
      sassy: ['Acceptable.', 'Fine. That one\'s actually good.'],
      dreamy: ['Mm, that could be lovely.', 'I wonder what I\'ll learn.'],
      earnest: ['Good. I can do this.', 'I\'ll work hard.'],
    },
    neutral: {
      sunny: ['Sure, why not!', 'Okay!'],
      soft: ['Okay.', 'Alright.'],
      sassy: ['Whatever you say.', 'Fine.', 'If I must.'],
      dreamy: ['Hmm? Oh. Okay.', 'If you think so.'],
      earnest: ['Understood.', 'I\'ll do it properly.'],
    },
    dislike: {
      sunny: ['Awww, do I have to?', 'Hmm... can we swap it for something fun?'],
      soft: ['...Okay. If you think it\'s good for me.', 'I\'ll try. I\'m not very good at it.'],
      sassy: ['Ugh. Seriously?', 'You know I don\'t like that, right?'],
      dreamy: ['That one makes my head feel gray.', '...Can I bring a book?'],
      earnest: ['I don\'t enjoy it. But I\'ll go.', 'If it\'s important, I\'ll do it.'],
    },
    hate: {
      sunny: ['Nooo! Not that one! Anything but that!', 'Please, please, please no.'],
      soft: ['...Do I have to? Really?', '(She looks at her shoes and says nothing.)'],
      sassy: ['Absolutely not. ...Fine. But I\'m sulking the whole time.', 'I\'d rather eat my own shoe.'],
      dreamy: ['I think that place is slowly eating my soul.', 'Every time I go there, a little flower inside me wilts.'],
      earnest: ['I\'ll go. But I want you to know I really, truly hate it.', 'I\'ll do it. Please don\'t ask me to smile.'],
    },
  };
  const NEW_BOLD = ['Something new? Let\'s go!', 'I\'ve never tried {act}! I bet I\'m amazing at it.'];
  const NEW_SHY = ['I\'ve never done that before... what if I\'m bad at it?', 'Um. Will there be a lot of people?'];
  const NEW_MID = ['I\'ve never tried {act}. Okay!', 'Something new, huh.'];
  const TIRED = ['I\'m so tired, {P}...', 'Can I please just sleep for a whole month first?', 'My eyes keep closing by themselves.'];
  const REST_YES = ['A whole month of rest? You\'re the best, {P}.', 'Sleep! Glorious sleep!', 'Thank you. I really needed that.'];
  const WORK = {
    sunny: ['Money! I\'ll buy something nice.', 'I\'ll earn my keep!'],
    soft: ['I\'ll work hard so we don\'t have to worry.', 'Okay. I\'ll be careful.'],
    sassy: ['Fine, but I keep the tips.', 'Child labor. Noted.'],
    dreamy: ['Maybe I\'ll meet someone interesting there.', 'Everyone who walks in has a story.'],
    earnest: ['I\'ll do an honest day\'s work.', 'I\'ll make you proud.'],
  };

  M.react = function (s, actId) {
    const A = D.ACT[actId];
    const vars = { act: A.name };
    if (actId === 'rest') return { expr: s.stress > 50 ? 'calm' : 'happy', emote: 'heart', text: M.pick(s, REST_YES) };
    if (actId === 'free') return { expr: 'joy', emote: 'sparkle', text: M.pick(s, { _: ['I get to choose? Really?', 'My own month! I already know what I\'ll do.'], sassy: ['Freedom! Finally.'], soft: ['Can I really? Thank you...'] }) };
    if (s.stress >= 72 && A.stress > 4 && U.chance(0.6)) return { expr: 'tired', emote: 'drop', text: M.pick(s, TIRED) };
    const tried = s.tried[actId];
    if (!tried) {
      const t = s.traits.bold;
      return { expr: t > 25 ? 'joy' : t < -25 ? 'worried' : 'thinking', emote: t < -25 ? 'drop' : 'sparkle', text: M.pick(s, t > 25 ? NEW_BOLD : t < -25 ? NEW_SHY : NEW_MID, vars) };
    }
    const lvl = M.affLevel(s.aff[actId]);
    if (A.cat === 'work' && (lvl === 'neutral' || lvl === 'like')) return { expr: 'determined', emote: null, text: M.pick(s, WORK) };
    const expr = { love: 'joy', like: 'happy', neutral: 'neutral', dislike: 'pout', hate: s.traits.fiery > 20 ? 'angry' : 'sad' }[lvl];
    const emote = { love: 'heart', like: 'note', neutral: null, dislike: 'drop', hate: 'drop' }[lvl];
    return { expr, emote, text: M.pick(s, REACT[lvl], vars), lvl };
  };

  // ---------------------------------------------------------------- what she wants
  M.wish = function (s, avail) {
    const n = s.needs;
    if (s.stress >= 70) return { id: 'rest', text: M.pick(s, { _: ['I\'m so worn out. Could I have a month to rest?'], sassy: ['I need a break before I snap. Just saying.'], soft: ['I\'m really tired lately... could I rest a little?'] }) };
    if (n.friends < 30 && avail.includes('play')) return { id: 'play', text: M.pick(s, { _: ['I haven\'t seen Mei in forever. Can we play this season?'], sassy: ['I have friends, you know. I\'d like to see them sometime.'], dreamy: ['I miss running around with Mei until the sun goes down.'] }) };
    if (n.freedom < 28 && avail.includes('free') && s.age >= 12) return { id: 'free', text: M.pick(s, { _: ['Could one month be mine? Just one?'], sassy: ['Could I maybe decide ONE thing myself this season?'], earnest: ['I\'d like to plan one month on my own. I\'ll use it well.'] }) };
    // otherwise the thing she loves most that she can do
    const opts = avail.filter((id) => !['rest', 'free', 'play'].includes(id) && s.tried[id] && s.aff[id] >= 0.8);
    if (!opts.length) {
      const curious = avail.filter((id) => !s.tried[id] && !['rest', 'free', 'play', 'journey'].includes(id));
      if (curious.length && s.traits.bold + s.traits.dreamy > 0 && U.chance(0.5)) {
        const id = U.pick(curious);
        return { id, text: M.pick(s, { _: ['What\'s {act} like? Could I try it?', 'Everyone at the market talks about {act}. Can I try?'] }, { act: D.ACT[id].name }) };
      }
      return null;
    }
    const id = opts.sort((a, b) => s.aff[b] - s.aff[a])[0];
    return { id, text: M.pick(s, { _: ['Can I do {act} this season? Please?', 'I really, really want to do {act} again!'], soft: ['If it\'s alright... could I do {act} again?'], sassy: ['{act}. This season. I\'m not asking. (Okay, I\'m asking.)'], dreamy: ['I keep thinking about {act}. Can I go back?'], earnest: ['I want to get better at {act}. May I continue?'] }, { act: D.ACT[id].name }) };
  };

  // ---------------------------------------------------------------- will she push back?
  M.protest = function (s, plan) {
    let worst = null;
    plan.forEach((id, i) => {
      if (!id || id === 'rest' || id === 'free') return;
      const a = s.aff[id];
      if (!s.tried[id] || a > -0.55) return;
      const forcedBefore = s.forced[id] || 0;
      let p = 0.12 + -a * 0.2 + (s.stress - 40) / 160 + Math.max(0, s.age - 11) * 0.035 + s.traits.fiery / 320 + (50 - s.needs.freedom) / 250 - s.bond / 300 + forcedBefore * 0.08 - (s.esteem < 30 ? 0.08 : 0);
      if (s.age <= 11) p *= 0.6;
      p = U.clamp(p, 0, 0.92);
      if (!worst || p > worst.p) worst = { slot: i, id, p };
    });
    if (!worst || !U.chance(worst.p)) return null;
    const id = worst.id;
    const reasons = [];
    if (s.stress >= 65) reasons.push('tired');
    if ((s.forced[id] || 0) >= 2) reasons.push('again');
    if (s.needs.freedom < 30) reasons.push('freedom');
    reasons.push('hate');
    return { slot: worst.slot, id, reason: reasons[0] };
  };
  M.protestLine = function (s, pr) {
    const act = D.ACT[pr.id].name;
    const R = {
      tired: { _: ['{P}, I can\'t do {act} this season. I\'m too tired. Please.'], sassy: ['I\'m exhausted and you want {act}? No. Just no.'] },
      again: { _: ['{act} again? I\'ve told you I hate it. You never listen.'], soft: ['I... I keep going to {act} and I keep hating it. Please don\'t make me again.'], sassy: ['{act}. AGAIN. Do you even hear me when I talk?'] },
      freedom: { _: ['You always decide everything. Can\'t I say no to {act} just once?'], sassy: ['Is there anything I\'m allowed to choose? Because it\'s not going to be {act}.'] },
      hate: { _: ['Please not {act}. I really, really hate it.'], soft: ['Um... could I not do {act}? It makes me feel awful.'], sassy: ['I am not doing {act}. I\'ll run away. I\'ll join a traveling opera troupe.'], dreamy: ['{act} makes the whole world go gray. Please pick something else.'], earnest: ['I\'ve tried {act}. I really have. It isn\'t for me.'] },
    };
    return M.pick(s, R[pr.reason], { act });
  };

  // ---------------------------------------------------------------- what she does with her own month
  M.chooseFree = function (s, avail) {
    const n = s.needs;
    if (s.stress > 60) return { kind: 'act', id: 'rest' };
    if (n.friends < 35) return { kind: 'act', id: 'play' };
    const loved = avail.filter((id) => D.ACT[id].cat === 'study' && s.tried[id] && s.aff[id] >= 0.8 && (D.ACT[id].cost || 0) <= s.gold);
    if (loved.length && U.chance(0.65)) return { kind: 'act', id: U.pick(loved) };
    const best = Object.keys(s.traits).sort((a, b) => s.traits[b] - s.traits[a])[0];
    const hob = D.HOBBIES.filter((h) => h.trait === best);
    return { kind: 'hobby', hobby: U.pick(hob.length ? hob : D.HOBBIES) };
  };

  // ---------------------------------------------------------------- living in the courtyard
  M.idle = function (s) {
    const m = M.mood(s);
    const list = [];
    if (s.stress >= 70) list.push(['sleep', 3], ['sit', 2]);
    if (m.label === 'upset' || m.label === 'low') list.push(['sit', 3], ['cry', m.label === 'upset' ? 1 : 0]);
    if (m.label === 'radiant' || m.label === 'happy') list.push(['dance', s.aff.dance > 0 ? 2 : 1], ['cheer', 1], ['love', 1]);
    if (s.needs.fun < 35) list.push(['kite', 1]);
    const top = Object.keys(s.aff).filter((id) => s.tried[id] && s.aff[id] > 0.8);
    const animOf = { martial: 'sword', academy: 'read', guqin: 'guqin', kitchen: 'cook', dance: 'dance', observatory: 'stars', temple: 'pray', silk: 'weave', tea: 'pick', medicine: 'pick' };
    top.forEach((id) => animOf[id] && list.push([animOf[id], 2]));
    list.push(['idle', 3], ['walk', 3]);
    const pick = U.weighted(list, (x) => x[1]);
    return pick ? pick[0] : 'idle';
  };

  // ---------------------------------------------------------------- her diary for the season
  M.diary = function (s, log) {
    const lines = [];
    const v = M.voice(s);
    const P = M.addr(s);
    const byOutcome = log.months.filter((x) => x.act);
    const best = byOutcome.slice().sort((a, b) => (s.aff[b.act] || 0) + (b.outcome === 'great' ? 1 : 0) - ((s.aff[a.act] || 0) + (a.outcome === 'great' ? 1 : 0)))[0];
    const worst = byOutcome.slice().sort((a, b) => (s.aff[a.act] || 0) - (s.aff[b.act] || 0))[0];
    const open = { sunny: 'Dear diary!!', soft: 'Dear diary,', sassy: 'Diary. Listen.', dreamy: 'Dear moon (and diary),', earnest: 'Diary entry.' }[v];
    lines.push(open);
    if (best && s.aff[best.act] > 0.4) {
      const act = D.ACT[best.act].name;
      lines.push(M.pick(s, { _: ['{act} was the best part. ' + (best.outcome === 'great' ? 'I was actually good today!' : 'I want to go back.')], sassy: ['{act} was fine. More than fine. Don\'t tell anyone.'], dreamy: ['At {act} I felt like the world opened a little window just for me.'], earnest: ['{act} went well. I am improving.'] }, { act }));
    }
    if (worst && s.aff[worst.act] < -0.5 && worst !== best) {
      const act = D.ACT[worst.act].name;
      lines.push(M.pick(s, { _: ['And {act}... ugh. I don\'t want to talk about it.'], soft: ['{act} was hard again. I tried not to cry.'], sassy: ['{act} is a crime against me personally.'], dreamy: ['{act} felt like walking through gray fog.'] }, { act }));
    }
    (log.diary || []).forEach((d) => lines.push(M.fill(s, d)));
    if (log.forced) lines.push(M.pick(s, { _: [P + ' made me go even though I said no. I\'m still upset.'], soft: ['I told ' + P + ' I didn\'t want to go. ' + P + ' made me anyway. Maybe ' + P + ' knows best. Maybe not.'], sassy: [P + ' overruled me. AGAIN. Noted. Remembered. Forever.'] }));
    if (log.listened) lines.push(M.pick(s, { _: [P + ' actually listened to me. That felt really nice.'], sassy: [P + ' listened to me for once. Weird. Good weird.'] }));
    if (log.outing) lines.push(M.fill(s, log.outing));
    if (log.wishMet) lines.push(M.pick(s, { _: ['And I got to do what I wished for!'], soft: [P + ' remembered what I wanted. I don\'t know why that made me so happy.'] }));
    const m = M.mood(s);
    const close = {
      radiant: { _: ['Today was a good day. All of them were.'], sassy: ['Life is suspiciously good right now.'] },
      happy: { _: ['I\'m happy. I think.'], dreamy: ['The stars look friendly tonight.'] },
      calm: { _: ['Nothing else to report.'], dreamy: ['The moon is half full. Me too.'] },
      low: { _: ['I feel a bit heavy lately.'], soft: ['I wish I could say what\'s wrong. I don\'t really know.'] },
      upset: { _: ['Everything is bad and nobody understands.'], sassy: ['Everything is terrible. Goodnight.'] },
    }[m.label];
    lines.push(M.pick(s, close));
    const sign = { sunny: '— ' + s.name + ' ☆', soft: '— ' + s.name, sassy: '— ' + s.name + ' (do NOT read this)', dreamy: '— ' + s.name + ', under the Silver River', earnest: '— ' + s.name }[v];
    lines.push(sign);
    return lines;
  };
})();

</script>
<script>
/* Silver River — the simulation: game state, seasons, months, events and the event-script context. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const M = G.Mind;
  const Sim = (G.Sim = {});
  const VERSION = 3;

  // ---------------------------------------------------------------- new game
  Sim.newGame = function (o) {
    const seed = o.seed || (Math.floor(Math.random() * 2147483000) + 1);
    U.setSeed(seed);
    const L = D.LENGTHS[o.length] || D.LENGTHS.standard;
    const P = D.PARENTS[o.background] || D.PARENTS.scholar;
    const mind = M.create(L.startAge, o.background);
    const base = L.startAge <= 10 ? 6 : L.startAge <= 13 ? 13 : 20;
    const stats = {};
    D.STAT_IDS.forEach((k) => (stats[k] = base + U.randInt(0, 6)));
    stats[P.stat] += 8;
    const t = mind.traits;
    stats.vigor += Math.max(0, Math.round(t.bold / 12));
    stats.wit += Math.max(0, Math.round(t.diligent / 12));
    stats.art += Math.max(0, Math.round(t.dreamy / 12));
    stats.heart += Math.max(0, Math.round(-t.fiery / 12));
    stats.grace += Math.max(0, Math.round(-t.playful / 14));
    stats.craft += Math.max(0, Math.round(t.playful / 14));
    const s = Object.assign(mind, {
      v: VERSION,
      seed,
      code: Sim.codeFor(seed, o),
      parent: { role: o.role || 'mom', address: o.address || (o.role === 'dad' ? 'Baba' : 'Mama'), bg: o.background || 'scholar' },
      name: o.name || 'Xing',
      look: o.look,
      style: o.look.style,
      length: o.length || 'standard',
      startAge: L.startAge,
      age: L.startAge,
      turn: 0,
      turns: L.years * 4,
      stats,
      stress: 12,
      gold: P.gold,
      focus: 'balanced',
      parenting: { warmth: 0, control: 0 },
      flags: {},
      counts: {},
      friends: { mei: 15, tao: 8, prince: 0, wanyin: 0 },
      outfit: 'everyday',
      wardrobe: ['everyday'],
      earned: 0,
      star: 0,
      journeys: 0,
      log: [],
      seen: {},
      heights: [],
      album: [],
      phase: 'intro',
      rngSeed: U.getSeed(),
    });
    s.lenMult = Math.pow(20 / s.turns, 0.9);
    return s;
  };

  Sim.codeFor = function (seed, o) {
    const n = (seed >>> 0).toString(36).toUpperCase();
    return 'SR-' + n;
  };
  Sim.seedFromCode = function (code) {
    const m = String(code || '').trim().toUpperCase().match(/^SR-([0-9A-Z]+)$/);
    if (!m) return null;
    const n = parseInt(m[1], 36);
    return n > 0 ? n : null;
  };

  // ---------------------------------------------------------------- time
  Sim.season = (s) => D.SEASONS[s.turn % 4];
  Sim.year = (s) => Math.floor(s.turn / 4) + 1;
  Sim.isLastSeason = (s) => s.turn === s.turns - 1;
  Sim.tod = (s) => 'day';

  // ---------------------------------------------------------------- activities available
  Sim.available = function (s) {
    return D.ACTS.filter((a) => Sim.canDo(s, a).ok).map((a) => a.id);
  };
  Sim.canDo = function (s, a) {
    if (a.minAge && s.age < a.minAge) return { ok: false, why: 'From age ' + a.minAge };
    if (a.needFlag && !s.flags[a.needFlag]) return { ok: false, why: a.reqText };
    if (a.needStat && s.stats[a.needStat[0]] < a.needStat[1]) return { ok: false, why: a.reqText };
    return { ok: true };
  };
  Sim.cost = function (s, id) {
    const a = D.ACT[id];
    let c = a.cost || 0;
    const P = D.PARENTS[s.parent.bg];
    if (c > 0 && P.discount && P.discount.includes(id)) c = Math.round(c * 0.6);
    if (c < 0) {
      let pay = -c;
      if (P.payBonus) pay *= 1 + P.payBonus;
      if (id === 'tea' && P.payTea) pay *= 1 + P.payTea;
      c = -Math.round(pay);
    }
    return c;
  };
  Sim.planCost = (s, plan) => plan.reduce((t, id) => t + (id ? Math.max(0, Sim.cost(s, id)) : 0), 0);
  Sim.planPay = (s, plan) => plan.reduce((t, id) => t + (id && id !== 'free' ? Math.max(0, -Sim.cost(s, id)) : 0), 0);
  // lessons are paid in the month they happen, so work earlier in the season can pay for lessons later on
  Sim.shortfall = function (s, plan) {
    let g = s.gold, short = 0;
    for (const id of plan) {
      if (!id || id === 'free') continue;
      g -= Sim.cost(s, id);
      if (g < 0) short = Math.max(short, -g);
    }
    return short;
  };

  // ---------------------------------------------------------------- one month of an activity
  Sim.doMonth = function (s, id, opts = {}) {
    let A = D.ACT[id];
    const res = { act: id, gains: {}, stress: 0, gold: 0, outcome: 'good', text: '', chosen: !!opts.chosen, forced: !!opts.forced };
    // her choice: she decides what to do
    if (id === 'free') {
      const pick = M.chooseFree(s, Sim.available(s));
      res.free = true;
      if (pick.kind === 'act') {
        A = D.ACT[pick.id];
        res.act = pick.id;
        res.chosen = true;
      } else {
        const h = pick.hobby;
        res.hobby = h.id;
        res.text = s.name + ' ' + h.text;
        Object.entries(h.gain).forEach(([k, v]) => (res.gains[k] = Math.max(1, Math.round(v * s.lenMult))));
        if (h.practice) {
          const top = Object.keys(s.stats).sort((a, b) => s.stats[b] - s.stats[a])[0];
          res.gains[top] = Math.round(3 * s.lenMult);
        }
        res.stress = -12;
        res.gold = -10;
        apply(s, res);
        M.need(s, 'freedom', 14);
        M.need(s, 'fun', 10);
        return res;
      }
    }
    const a = s.aff[A.id] || 0;
    // exhaustion can overrule the plan
    if (s.stress >= 88 && A.stress > 0 && U.chance(0.55)) {
      res.collapsed = true;
      res.act = 'rest';
      res.text = s.name + ' was too exhausted to go. She slept through most of the month.';
      res.stress = -12;
      apply(s, res);
      return res;
    }
    const main = Object.keys(A.gain).sort((x, y) => A.gain[y] - A.gain[x])[0];
    const skill = main ? s.stats[main] : 50;
    let pGreat = 0.14 + a * 0.07 + skill / 400 + Math.max(0, s.traits.diligent) / 600 + (s.esteem - 50) / 500;
    let pPoor = 0.14 - a * 0.05 + Math.max(0, s.stress - 40) / 220 - skill / 900;
    if (res.forced) pPoor += 0.08;
    const r = U.rand();
    res.outcome = r < pGreat ? 'great' : r < pGreat + Math.max(0.03, pPoor) ? 'poor' : 'good';
    const outMult = { great: 1.5, good: 1, poor: 0.45 }[res.outcome];
    const affMult = U.clamp(1 + a * 0.18, 0.6, 1.4);
    const stressMult = s.stress < 50 ? 1 : s.stress < 75 ? 0.85 : 0.65;
    const dil = 1 + s.traits.diligent / 400;
    Object.entries(A.gain).forEach(([k, v]) => {
      const g = v * s.lenMult * affMult * stressMult * outMult * dil * (res.forced ? 0.85 : 1);
      res.gains[k] = Math.max(res.outcome === 'poor' ? 0 : 1, Math.round(g + U.randf(-0.3, 0.3)));
    });
    let st = A.stress;
    if (st > 0) st *= a < -0.4 ? 1.3 : a > 1 ? 0.7 : 1;
    if (res.outcome === 'poor' && st > 0) st += 2;
    if (res.chosen) st -= 4;
    res.stress = Math.round(st);
    const cost = Sim.cost(s, A.id);
    res.gold = -cost;
    if (cost < 0 && res.outcome === 'great') res.gold = Math.round(res.gold * 1.3);
    if (A.star) res.star = A.star;
    // lines
    const lines = (A.lines && A.lines[res.outcome]) || [];
    if (!res.text) res.text = lines.length ? U.pick(lines) : '';
    // taste drifts with experience
    const first = !s.tried[A.id];
    s.tried[A.id] = (s.tried[A.id] || 0) + 1;
    res.first = first;
    let da = res.outcome === 'great' ? 0.08 : res.outcome === 'poor' ? -0.05 : 0.01;
    if (res.forced) da -= 0.15;
    if (s.stress > 75) da -= 0.05;
    s.aff[A.id] = U.clamp(a + da, -2, 2);
    // she now knows (and shows) how she feels about it
    res.learned = M.learn(s, 'like', A.id);
    // traits bend a little
    Object.entries(A.trait || {}).forEach(([k, v]) => {
      if (U.chance(0.6)) s.traits[k] = U.clamp(s.traits[k] + v, -100, 100);
    });
    if (A.friend) s.friends[A.friend] = U.clamp(s.friends[A.friend] + 3, 0, 100);
    s.counts[A.id] = (s.counts[A.id] || 0) + 1;
    // needs
    if (A.cat === 'leisure') M.need(s, 'fun', A.id === 'play' ? 16 : 8);
    else if (a > 0.5) M.need(s, 'fun', 4);
    else if (a < -0.5) M.need(s, 'fun', -5);
    if (A.id === 'play') M.need(s, 'friends', 18);
    if (res.outcome === 'great') M.need(s, 'pride', 9), M.esteem(s, 1);
    if (res.outcome === 'poor') M.need(s, 'pride', -4);
    if (res.chosen) M.need(s, 'freedom', 10);
    if (res.forced) M.need(s, 'freedom', -8);
    if (A.id === 'journey') s.journeys++;
    apply(s, res);
    return res;
  };

  function apply(s, res) {
    Object.entries(res.gains).forEach(([k, v]) => (s.stats[k] = U.clamp(s.stats[k] + v, 0, 100)));
    s.stress = U.clamp(s.stress + res.stress, 0, 100);
    s.gold = Math.max(0, s.gold + res.gold);
    if (res.gold > 0) s.earned += res.gold;
    if (res.star) s.star += res.star;
  }
  Sim.apply = apply;

  // ---------------------------------------------------------------- the end of a season
  Sim.endSeason = function (s, log) {
    const P = D.PARENTS[s.parent.bg];
    let income = P.income;
    if (s.focus === 'work') income += 90;
    if (s.focus === 'family') income -= 40;
    s.gold += income;
    log.income = income;
    // natural recovery, and what tiredness costs
    s.stress = U.clamp(s.stress - (2 + (P.restBonus && log.months.some((m) => m.act === 'rest') ? P.restBonus : 0)), 0, 100);
    if (s.focus === 'work') {
      M.need(s, 'love', -8);
      M.bond(s, -2);
      log.diary.push(M.pick(s, { _: ['{P} worked late every night this season. The house is so quiet.'], sassy: ['{P} was never home. Not that I noticed. (I noticed.)'] }));
    }
    if (s.focus === 'family') {
      M.need(s, 'love', 8);
      M.bond(s, 2);
    }
    if (log.wishMet) {
      M.bond(s, 2);
      M.need(s, 'love', 4);
      s.stress = U.clamp(s.stress - 4, 0, 100);
    }
    if (s.stress >= 70) M.bond(s, -2);
    if (log.forced) M.bond(s, -2);
    M.seasonDecay(s);
    // low needs cost bond and esteem; adolescence pulls a little distance
    if (s.needs.love < 40) M.bond(s, -2);
    if (s.needs.freedom < 30 && s.age >= 13) M.bond(s, -2);
    if (s.age >= 14 && s.age <= 16 && s.trust < 65) M.bond(s, -1);
    if (s.needs.pride < 20) M.esteem(s, -2);
    if (s.needs.freedom < 15 && s.age >= 13) s.flags.rebellious = (s.flags.rebellious || 0) + 1;
    // promises that came due
    s.promises.forEach((p) => {
      if (!p.done && p.due <= s.turn) {
        p.done = true;
        if (!p.kept) {
          M.trust(s, -12);
          M.bond(s, -6);
          M.feel(s, 'hurt', 60);
          M.remember(s, { id: 'broken_' + p.id, text: 'You promised ' + p.text + ', and then you didn\'t.', letter: 'I remember when you promised ' + p.text + ' and forgot. I cried the whole night. I forgave you a long time ago, but I still remember.', weight: 7, val: -1, tags: ['parent', 'promise'] });
          log.diary.push(M.pick(s, { _: ['{P} promised ' + p.text + '. {P} forgot.'], sassy: ['{P} promised ' + p.text + '. Ha. Lesson learned.'] }));
        } else {
          M.trust(s, 6);
        }
      }
    });
    M.clampNeeds(s);
    M.coolDown(s);
    log.diaryText = M.diary(s, log);
    s.log.push({ turn: s.turn, months: log.months.map((m) => ({ act: m.act, outcome: m.outcome })), income });
    if (s.log.length > 12) s.log.shift();
  };

  // diary privacy: as a teenager she keeps it to herself unless she trusts you
  Sim.diaryOpen = function (s) {
    if (s.age < 14) return { open: true };
    if (s.flags.diaryShared) return { open: true, shared: true };
    if (s.trust >= 70 && s.bond >= 60) return { open: true, shared: true };
    return { open: false };
  };

  // ---------------------------------------------------------------- events
  G.Events = G.Events || [];
  Sim.pickEvents = function (s, phase, n = 1) {
    const out = [];
    const pool = G.Events.filter((e) => (e.phase || 'mid') === phase && !(e.once !== false && s.seen[e.id]) && safeWhen(e, s));
    // priority events always come first
    pool.filter((e) => e.priority).sort((a, b) => b.priority - a.priority).forEach((e) => {
      if (out.length < n) out.push(e);
    });
    const rest = pool.filter((e) => !e.priority);
    while (out.length < n && rest.length) {
      const e = U.weighted(rest, (x) => (typeof x.weight === 'function' ? x.weight(s) : x.weight || 1));
      if (!e) break;
      out.push(e);
      rest.splice(rest.indexOf(e), 1);
    }
    return out;
  };
  function safeWhen(e, s) {
    try {
      return !e.when || !!e.when(s);
    } catch (err) {
      return false;
    }
  }

  // The context an event script receives. `io` is the presentation layer (UI or a test stub).
  Sim.ctx = function (s, io, extra = {}) {
    const g = {
      s,
      io,
      get name() { return s.name; },
      get P() { return M.addr(s); },
      get Pc() { return M.addr(s, true); },
      get age() { return s.age; },
      get season() { return Sim.season(s); },
      get fav() { return s.fav; },
      v: (bank, vars) => M.pick(s, bank, vars),
      fill: (t, vars) => M.fill(s, t, vars),
      voice: () => M.voice(s),
      her: (expr, text, vars) => io.say('her', M.pick(s, text, vars), { expr }),
      say: (who, text, opts) => io.say(who, M.pick(s, text), opts || {}),
      nar: (text, vars) => io.say(null, M.pick(s, text, vars), {}),
      choose: (opts) => io.choose(opts.filter(Boolean).map((o) => (typeof o === 'string' ? { text: o } : o))),
      scene: (name, o) => io.scene(name, Object.assign({ season: Sim.season(s) }, o || {})),
      anim: (name) => io.anim && io.anim(name),
      npc: (id, where) => io.npc && io.npc(id, where),
      clearNpcs: () => io.clearNpcs && io.clearNpcs(),
      emote: (name) => io.emote && io.emote(name),
      fx: (name, arg) => (io.fx ? io.fx(name, arg) : Promise.resolve()),
      npcEmote: (id, name) => io.npcEmote && io.npcEmote(id, name),
      wait: (ms) => (io.wait ? io.wait(ms) : Promise.resolve()),
      input: (label, def) => (io.input ? io.input(label, def) : Promise.resolve(def)),
      minigame: (kind, opts) => (io.minigame ? io.minigame(kind, opts) : Promise.resolve({ win: U.chance(0.5), score: 0, skipped: true })),
      stat(k, d) {
        s.stats[k] = U.clamp(s.stats[k] + d, 0, 100);
        io.toast && io.toast({ kind: 'stat', stat: k, d });
      },
      stress(d) {
        s.stress = U.clamp(s.stress + d, 0, 100);
        io.toast && io.toast({ kind: 'stress', d });
      },
      bond(d) {
        const eff = M.bond(s, d);
        io.toast && io.toast({ kind: 'bond', d: eff });
      },
      trust: (d) => M.trust(s, d),
      esteem: (d) => M.esteem(s, d),
      need: (k, d) => M.need(s, k, d),
      feel: (k, a) => M.feel(s, k, a),
      gold(d) {
        // the family scrapes by: a cost never takes you below zero
        const before = s.gold;
        s.gold = Math.max(0, s.gold + d);
        const eff = s.gold - before;
        if (eff) io.toast && io.toast({ kind: 'gold', d: eff });
      },
      trait: (k, d) => (s.traits[k] = U.clamp(s.traits[k] + d, -100, 100)),
      parent: (w, c) => M.parent(s, w, c),
      flag(k, v) {
        if (v === undefined) return s.flags[k];
        s.flags[k] = v;
        return v;
      },
      friend(id, d) {
        s.friends[id] = U.clamp((s.friends[id] || 0) + d, 0, 100);
      },
      remember(m) {
        M.remember(s, m);
        if (m.photo) {
          s.album.push({ id: m.id, title: m.title || '', caption: m.caption || m.text, scene: m.photo.scene || 'home', tod: m.photo.tod || 'day', season: Sim.season(s), anim: m.photo.anim || 'idle', expr: m.photo.expr || 'happy', age: m.photo.age || s.age, outfit: s.outfit, npcs: m.photo.npcs || [] });
          io.photo && io.photo(s.album[s.album.length - 1]);
        }
      },
      learn(kind, key, text) {
        const isNew = M.learn(s, kind, key, text);
        if (isNew && io.toast) io.toast({ kind: 'learn', text: text || key });
        return isNew;
      },
      knows: (kind, key) => M.knows(s, kind, key),
      diary: (line) => extra.log && extra.log.diary.push(line),
      promise(p) {
        s.promises.push(Object.assign({ kept: false, done: false }, p));
      },
      keep(id) {
        const p = s.promises.find((x) => x.id === id);
        if (p) p.kept = true;
      },
      check(stat, target, spread = 12) {
        const v = typeof stat === 'number' ? stat : s.stats[stat];
        return U.rand() < U.sigmoid((v - target) / spread);
      },
      chance: (p) => U.chance(p),
      pick: (arr) => U.pick(arr),
    };
    return g;
  };

  // ---------------------------------------------------------------- saving
  Sim.save = function (s) {
    s.rngSeed = U.getSeed();
    return U.store.set('save', s);
  };
  Sim.load = function () {
    const s = U.store.get('save', null);
    if (!s || s.v !== VERSION) return null;
    U.setSeed(s.rngSeed || s.seed);
    return s;
  };
  Sim.clearSave = () => U.store.del('save');
  Sim.profile = function () {
    const p = U.store.get('profile', null) || { endings: {}, register: [], seen: {}, achievements: {}, settings: { music: 0.5, sfx: 0.7, text: 1, skipSeen: true } };
    p.endings = p.endings || {};
    p.register = p.register || [];
    p.seen = p.seen || {};
    p.achievements = p.achievements || {};
    p.settings = Object.assign({ music: 0.5, sfx: 0.7, text: 1, skipSeen: true }, p.settings || {});
    return p;
  };
  Sim.saveProfile = (p) => U.store.set('profile', p);
})();

      score: (s, t) => t.grace * 0.9 + t.wit * 0.9 + s.traits.bold * 0.2,
      text: '{name} led the Emperor\'s embassy along the Silk Road, across deserts and over mountains, and came home with a peace treaty, a camel, and opinions about western food.' },
    { id: 'priestess', name: 'Abbess of the Cloud Temple', zh: '住持', outfit: 'priestess', scene: 'temple', hint: 'A great heart and many seasons at the temple.',

      fallback: true, req: () => true, score: () => 0,
      text: '{name} left home the spring after her eighteenth birthday with a small bag and no plan. For a long time you heard nothing. Then letters began to arrive, from further and further away.' },

  E.STAR = { id: 'star', name: 'Return to the Silver River', zh: '歸星', outfit: 'celestial', scene: 'night', hint: 'On her eighteenth Qixi, the stars call her home.' };

  E.ALL = E.CAREERS.concat([E.STAR, E.STAR_BRIDGE]);

    scored.sort((a, b) => b.sc - a.sc);

  // Does she stay when the stars call? choice: 'stay' (ask her to stay), 'free' (her choice), 'go' (let her go)
  E.decide = function (s, choice) {

    let score = s.bond * 0.8 + s.trust * 0.35 + friends * 0.25 + (dreamFulfilled ? 12 : 0) + (s.esteem - 50) * 0.1 - Math.min(12, s.star * 0.6);
    if (choice === 'free') score += s.bond >= 60 ? 14 : 0;
    if (choice === 'stay') score += s.bond >= 50 ? 10 : -10;
    if (choice === 'go') score -= 35;
    const stays = score >= 58;
    return { stays, score: Math.round(score), bridge: !stays && s.bond >= 55 };

    if (b >= 65) return 'She writes to you every week, long letters full of drawings in the margins. Every one of them starts "Dear ' + P + '".';
    if (b >= 45) return 'She visits at New Year and for your birthday. The two of you still argue about the same silly things, and you both secretly enjoy it.';
    if (b >= 25) return 'Her letters are short, but they come. Last winter one of them ended with "I miss you". She underlined it twice.';
    return 'For a long time she did not write at all. Then one day a single dried peach blossom arrived in an envelope. No letter. You know what it means.';
  };

  E.friendsText = function (s) {
    const out = [];
    if (s.flags.tao_love) out.push('She and Tao were married under the peach tree. He still saves her the first basket of dumplings every morning.');
    else if (s.friends.tao >= 50) out.push('Tao opened his own dumpling house. There is a dish on the menu named after her, and he refuses to explain why.');
    if (s.friends.mei >= 55) out.push('Mei is still her best friend. They have a standing appointment every Lantern Festival that neither of them has ever missed.');
    if (s.flags.wanyin_friend) out.push('Lady Wanyin, her old rival, became her fiercest ally. They still compete at everything, including who can be nicer to the other.');
    if (s.friends.prince >= 40 && !s.flags.prince_route) out.push('Sometimes a poem arrives from the palace, unsigned. She always knows who sent it.');
    return out.join(' ');
  };

  // ---------------------------------------------------------------- her letter
  E.letter = function (s, career, star) {
    const P = M.addr(s);
    const v = M.voice(s);
    const lines = [];
    lines.push('Dear ' + P + ',');
    const opener = {
      sunny: 'I tried to write this four times and every time I started crying and laughing at the same time, so here is attempt number five.',
      soft: 'I\'m not good at saying things out loud, so I\'m writing them down instead.',
      sassy: 'Don\'t make that face. Yes, I\'m writing you a letter. Yes, it\'s sentimental. Deal with it.',
      dreamy: 'The Silver River is very bright tonight, and it made me want to tell you everything.',
      earnest: 'There are some things I want to say properly, so I am writing them down.',
    }[v];
    lines.push(opener);
    lines.push(s.startAge <= 11 ? 'I still remember the night I fell into your courtyard. I was so scared, and you just sat down in the grass next to me and didn\'t say anything until I stopped shaking.' : 'I still remember the night I fell into your courtyard. I didn\'t know who I was. You told me it didn\'t matter, because you knew who I was going to be: yours.');
    const good = M.recall(s, (m) => m.val > 0 && m.letter);
    if (good) lines.push(good.letter);
    const bad = M.recall(s, (m) => m.val < 0 && m.letter);
    if (bad && s.bond >= 30) lines.push(bad.letter);
    const style = M.style(s).id;
    lines.push({
      lantern: 'You were strict sometimes, and I hated it sometimes. But I always knew you were on my side. I always knew where home was.',
      sky: 'You let me choose, even when I chose badly. Especially then. I think that\'s why I learned to choose well.',
      willow: 'You were so patient with me. I don\'t think I ever said thank you for that. Thank you.',
      gate: 'You pushed me so hard. I understand now that you were scared for me. I wish you had told me that back then.',
      mountain: 'I know you were busy. I know you did your best. I learned to stand on my own, and some of that is thanks to you.',
      river: 'We figured each other out slowly, didn\'t we? I\'m glad we did.',
    }[style]);
    const dreamCareer = s.dream && G.D.DREAMS[s.dream] ? G.D.DREAMS[s.dream].career : null;
    if (star) lines.push('I have to go home now, to the river of stars. Please don\'t be sad for too long. Look up on Qixi. I\'ll be the one waving.');
    else if (career && dreamCareer === career.id) lines.push('I did it, ' + P + '. The thing I told you about when I was little. I really did it.');
    else if (career && career.id !== 'quiet' && career.id !== 'wanderer') lines.push('It isn\'t what I dreamed of when I was small, but it\'s mine, and I love it.');
    lines.push(s.bond >= 50 ? 'Whatever star I came from, home is wherever you are.' : 'I\'m still working out what home means. But I think it starts with you.');
    lines.push({ sunny: 'Love you forever and ever (and ever)', soft: 'With all my love,', sassy: 'Fine. I love you. There. It\'s in writing now.', dreamy: 'Under the same stars,', earnest: 'With gratitude and love,' }[v]);
    lines.push(s.name);
    return lines;
  };
})();

   g is the script context from Sim.ctx: g.her(expr, text), g.say(who, text), g.nar(text), await g.choose([...]) ... */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const M = G.Mind;
  const EV = (G.Events = G.Events || []);
  const add = (e) => EV.push(e);

  // ================================================================ ARRIVAL
  add({
    id: 'arrival', phase: 'intro', priority: 100,
    async run(g) {
      await g.scene('home', { tod: 'night', season: 'summer', noHer: true });
      await g.nar('It is the night of Qixi. Once a year, magpies build a bridge across the Silver River so the Weaver Girl and the Cowherd can meet.');
      await g.nar('You sit alone in your courtyard with a cup of cooling tea, watching the sky. One of the stars begins to fall.');
      g.fx('fallingStar');
      await g.nar('It grows brighter, and brighter, and lands in your peach tree with a sound like a temple bell.');
      g.io.herAppear && (await g.io.herAppear('sit'));
      await g.nar('In the glow sits a little girl. Her hair shines like spun starlight, and she is holding a golden star-shaped hairpin in both hands.');
      await g.her('surprised', {
        sunny: 'Oh! Hello! Is this the ground? It\'s very hard.',
        soft: 'A-are you going to send me away?',
        sassy: 'Where am I? Who are you? Why is your tree so pointy?',
        dreamy: 'The stars were singing, and then they stopped. Are you a star too?',
        earnest: 'I apologize for landing in your tree. I don\'t know how I got here.',
      });
      const c = await g.choose([
        'Kneel beside her. "You\'re safe here."',
        '"Are you hurt? Let me look at you."',
        'Offer her your cup of tea.',
        '"Where did you come from, little one?"',
      ]);
      if (c === 0) { g.parent(5, 0); g.bond(4); g.need('love', 10); await g.her('teary', 'Safe... okay. Okay.'); }
      if (c === 1) { g.parent(4, 2); g.bond(3); await g.her('shy', 'Just my knee. And my pride.'); }
      if (c === 2) { g.parent(3, -2); g.bond(3); g.trait('playful', 4); await g.her('happy', '...It\'s cold. But it\'s nice. Thank you.'); }
      if (c === 3) { g.trait('dreamy', 3); await g.her('thinking', 'From up there, I think. I don\'t remember anything else.'); }
      await g.her('sad', 'I don\'t even remember my name.');
      const name = await g.input('What will you name her?', g.s.name);
      g.s.name = (name || g.s.name).trim().slice(0, 16) || g.s.name;
      await g.her('shy', g.s.name + '... ' + g.v({ _: 'I like it.', sassy: 'Hm. Acceptable. No, I like it. I like it a lot.', sunny: 'I LOVE it!' }));
      await g.her('thinking', 'Are you... my ' + (g.s.parent.role === 'mom' ? 'mama' : 'baba') + ' now?');
      const d = await g.choose(['"Yes. From tonight on, I am."', '"If you want me to be."', '"I\'ll take care of you, whatever you call me."']);
      if (d === 0) { g.parent(4, 2); g.bond(4); }
      if (d === 1) { g.parent(3, -3); g.bond(3); g.trust(4); }
      if (d === 2) { g.parent(2, 0); g.bond(2); }

      }

  // ================================================================ DREAMS
  add({
    id: 'dream_reveal', phase: 'mid', priority: 40,
    when: (s) => !s.dream && s.turn >= 2 && Object.keys(s.tried).some((id) => D.ACT_DREAM[id] && s.aff[id] >= 0.8),
    async run(g) {
      const s = g.s;
      const best = Object.keys(s.tried).filter((id) => D.ACT_DREAM[id]).sort((a, b) => s.aff[b] - s.aff[a])[0];
      let dream = D.ACT_DREAM[best];
      if (dream === 'general' && s.traits.bold > 30 && s.traits.diligent < 0) dream = 'swordswoman';
      if (dream === 'princess' && s.traits.dreamy < 0) dream = 'scholar';
      if (s.stats.art > 45 && s.stats.wit > 45 && s.traits.dreamy > 30 && U.chance(0.3)) dream = 'poet';
      await g.scene('home', { tod: 'dusk' });
      await g.nar('She sits beside you on the step as the lanterns come on.');
      await g.her('thinking', g.P + '... can I tell you something? You can\'t laugh.');
      await g.her('determined', D.DREAMS[dream].say);
      s.dream = dream;
      s.dreamHist.push(dream);
      const P = D.PARENTS[s.parent.bg];
      const yours = { general: 'general', scholar: 'scholar', merchant: 'merchant', physician: 'physician', musician: 'musician', tea: 'farmer' }[s.parent.bg];
      const opts = ['"Then that\'s what you\'ll be. I believe in you."', '"That\'s a hard road. Are you sure?"'];
      if (yours && yours !== dream) opts.push('"Have you ever thought about following in my footsteps?"');
      const c = await g.choose(opts);
      if (c === 0) {
        g.esteem(8); g.bond(4); g.parent(4, -1); g.flag('dream_support', true);
        await g.her('joy', 'You really think so? ...Okay. Okay! Then I\'ll really do it.');
        g.remember({ id: 'dream_believe', text: 'the evening you believed in my dream', letter: 'When I told you my dream on the courtyard step, you didn\'t laugh. You said "then that\'s what you\'ll be". I held on to that for years.', weight: 8, val: 1, tags: ['parent', 'dream'] });
      } else if (c === 1) {
        g.parent(0, 2);
        if (s.traits.fiery > 20 || s.traits.bold > 30) { g.esteem(2); await g.her('determined', 'I\'m sure. You\'ll see.'); }
        else { g.esteem(-4); await g.her('sad', '...Maybe you\'re right.'); }
      } else {
        g.parent(1, 5);
        if (s.bond > 55 && s.traits.fiery < 20) {
          await g.her('thinking', 'Like you? ...I never thought about that. Maybe.');
          s.dream = yours; s.dreamHist.push(yours);
        } else {
          g.bond(-3); g.esteem(-2);
          await g.her('pout', 'I told you MY dream. Not yours.');
        }
      }
      g.learn('fact', 'dream', 'Her dream: ' + D.DREAMS[s.dream].say);
    },
  });

    },
  });

  add({

    async run(g) {
      const s = g.s;
      g.flag('contest_done', true);
      const opts = [['grace', 'tea ceremony'], ['wit', 'poetry duel'], ['art', 'guqin recital'], ['vigor', 'sword duel']];
      const [stat, kind] = opts.sort((a, b) => s.stats[b[0]] - s.stats[a[0]])[0];
      await g.scene(stat === 'vigor' ? 'hall' : 'palace');
      g.npc('wanyin', 'mentor');
      await g.nar('The whole town turns out for the contest. The judges choose a ' + kind + '.');
      await g.her('determined', { _: 'Watch me, ' + g.P + '.', soft: 'My hands are shaking... but I\'ll do it.' });
      let win;
      if (stat === 'art') {
        const r = await g.minigame('recital', { level: Math.round(3 + s.stats.art / 25) });
        win = r.skipped ? g.check('art', 55) : r.win;
      } else if (stat === 'vigor') {
        const r = await g.minigame('duel', { skill: s.stats.vigor });
        win = r.skipped ? g.check('vigor', 55) : r.win;
      } else win = g.check(stat, 55);
      if (win) {
        g.esteem(10); g.need('pride', 30); g.stat(stat, 3); g.feel('proud', 80);
        await g.nar('When the judges announce the winner, it is her name they call.');
        await g.her('joy', 'I won! ' + g.P + ', I WON!');
        await g.say('wanyin', '...Well played. This time.');
        g.remember({ id: 'contest_win', title: 'Victory', caption: 'She beat Lady Wanyin in the ' + kind + '.', text: 'the day I beat Lady Wanyin', letter: 'You were standing at the very front when I won the ' + kind + ' against Wanyin. You cheered so loudly the judges frowned at you. I have never been prouder of anything.', weight: 7, val: 1, tags: ['pride', 'rival'], photo: { scene: stat === 'vigor' ? 'hall' : 'palace', anim: 'cheer', expr: 'joy', npcs: ['wanyin'] } });
      } else {
        g.esteem(-4); g.need('pride', -15); g.feel('sad', 60);
        await g.nar('Wanyin wins, by a hair. The crowd applauds politely.');
        await g.her('cry', { _: 'I practiced so hard...', sassy: 'The judges were bribed. Probably. ...No. She was just better.' });
        const c = await g.choose(['"I\'m proud of you. Win or lose."', '"Then we practice harder."', 'Buy her candied hawthorn on the way home.']);
        if (c === 0) { g.esteem(6); g.bond(5); g.parent(5, 0); g.remember({ id: 'contest_proud', text: 'you were proud of me when I lost', letter: 'When I lost to Wanyin, you said you were proud of me anyway. I didn\'t believe you then. I do now.', weight: 7, val: 1, tags: ['parent', 'esteem'] }); }
        if (c === 1) { g.trait('diligent', 5); g.parent(0, 4); g.esteem(1); }
        if (c === 2) { g.bond(4); g.gold(-5); g.need('fun', 10); await g.her('teary', '...It\'s really good hawthorn.'); }
      }
      g.friend('wanyin', 8);
      g.clearNpcs();
