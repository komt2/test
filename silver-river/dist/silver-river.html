      await g.scene('town');
      await g.her('worried', 'Mei\'s father is sick and they can\'t afford the medicine. Mei says she might have to go work in the city. Can we help? Please?');
      const c = await g.choose(['Pay for the medicine. (60 coins)', '"We can\'t afford it. I\'m sorry."', '"Let\'s think of a way you can help, yourself."']);
      if (c === 0) { g.gold(-60); g.friend('mei', 20); g.bond(5); g.stat('heart', 2); g.remember({ id: 'mei_medicine', text: 'the medicine for Mei\'s father', letter: 'You paid for Mei\'s father\'s medicine without even thinking about it. Mei still brings it up every single time I see her.', weight: 6, val: 1, tags: ['parent', 'mei'] }); }
      if (c === 1) { g.bond(-2); g.friend('mei', -5); await g.her('sad', 'Okay...'); }
      if (c === 2) { g.stat('heart', 3); g.stat('craft', 2); g.stress(8); g.friend('mei', 15); await g.nar('She spends every spare hour folding paper lanterns to sell. It\'s not enough on its own, but together with Mei\'s it is.'); g.esteem(4); }
    },
  });

  add({
    id: 'tao_crush', phase: 'mid', weight: 3, when: (s) => s.age >= 14 && s.friends.tao >= 30 && !s.flags.tao_crush,
    async run(g) {
      g.flag('tao_crush', true);
      await g.scene('home');
      await g.her('shy', { _: g.P + '... how do you know if you like someone? Not for me. For... a friend.', sassy: 'Hypothetically. If someone kept thinking about someone\'s stupid dumplings. What would that mean.' });
      const c = await g.choose(['Tease her gently: "Does this friend make dumplings?"', '"You just know. Your heart feels warm and silly."', '"You\'re too young to think about that."']);
      if (c === 0) { g.bond(3); g.trait('playful', 2); await g.her('shy', '...I hate you. (She doesn\'t.)'); g.friend('tao', 5); }
      if (c === 1) { g.trust(5); g.bond(3); await g.her('love', 'Warm and silly... yeah.'); g.friend('tao', 8); }
      if (c === 2) { g.parent(-1, 6); g.trust(-4); g.need('freedom', -10); await g.her('pout', 'I\'m not too young to think.'); g.s.secrets.push({ id: 'crush', text: 'She has a crush on Tao from the dumpling stall.' }); }
    },
  });

  add({
    id: 'tao_confess', phase: 'mid', weight: 3, when: (s) => s.flags.tao_crush && s.friends.tao >= 50 && s.age >= 16 && !s.flags.tao_love && !s.flags.prince_route,
    async run(g) {
      await g.scene('garden', { tod: 'dusk' });
      g.npc('tao', 'right');
      await g.nar('Tao arrives at your gate in his cleanest shirt, holding a steamer basket like a shield.');
      await g.say('tao', 'I-I\'d like to ask your permission to walk with your daughter at the Lantern Festival. And maybe every festival. For a long time.');
      await g.her('shy', '(She is standing behind you, bright red, and very carefully not looking at anyone.)');
      const c = await g.choose(['"Ask her, not me."', '"You have my blessing."', '"She\'s far too young."']);
      if (c === 0) { g.trust(6); g.parent(3, -4); await g.her('love', '...Yes. Obviously yes.'); g.flag('tao_love', true); g.friend('tao', 20); }
      if (c === 1) { g.bond(3); await g.her('love', 'Thank you...'); g.flag('tao_love', true); g.friend('tao', 15); }
      if (c === 2) { g.parent(-2, 7); g.bond(-6); g.need('freedom', -15); await g.her('angry', 'That\'s not your decision!'); }
      if (g.flag('tao_love')) g.remember({ id: 'tao_ask', title: 'Tao asks', caption: 'He brought dumplings for courage.', text: 'the day Tao came to ask', weight: 6, val: 1, tags: ['love'], photo: { scene: 'garden', tod: 'dusk', anim: 'love', expr: 'love', npcs: ['tao'] } });
      g.clearNpcs();
    },
  });

  add({
    id: 'prince_letters', phase: 'mid', weight: 3, when: (s) => s.flags.prince_met && s.age >= 15 && !s.flags.prince_letters,
    async run(g) {
      g.flag('prince_letters', true);
      await g.scene('home');
      await g.nar('Letters begin to arrive, sealed with blue wax and no name. She reads them in the peach tree where she thinks you can\'t see.');
      const c = await g.choose(['Ask who is writing to her.', 'Pretend not to notice.', 'Forbid letters from strangers.']);
      if (c === 0) { await g.her('shy', 'It\'s Jing. The scholar from the Lantern Festival. He writes about books. And stars. And... other things.'); g.trust(3); }
      if (c === 1) { g.trust(5); g.need('freedom', 8); }
      if (c === 2) { g.parent(-2, 7); g.bond(-5); g.s.secrets.push({ id: 'letters', text: 'She kept writing to Jing in secret, through Mei.' }); }
      g.friend('prince', 10);
    },
  });

  add({
    id: 'banquet', phase: 'mid', weight: 3, when: (s) => s.flags.prince_met && s.age >= 16 && s.stats.grace >= 45 && !s.flags.banquet,
    async run(g) {
      g.flag('banquet', true);
      await g.scene('palace', { tod: 'night' });
      await g.nar('An invitation arrives, sealed with the imperial phoenix: the Mid-Autumn banquet at the summer palace. You both go.');
      g.npc('prince', 'prince');
      await g.nar('At the top of the steps, in the crown prince\'s robes, stands the scholar from the Lantern Festival.');
      await g.say('prince', 'I\'m sorry I never told you. When you\'re a prince, people only ever see the crown. You saw a boy who was bad at riddles.');
      await g.her('surprised', 'You\'re... Jing is... you\'re the PRINCE?');
      const feel = g.s.friends.prince + g.s.stats.grace / 3;
      if (feel >= 45) {
        await g.her('shy', 'You\'re still bad at riddles, you know.');
        await g.say('prince', 'Then you\'ll have to keep helping me.');
        g.flag('prince_route', true); g.friend('prince', 20);
        g.remember({ id: 'banquet', title: 'The banquet', caption: 'The scholar was the crown prince.', text: 'the Mid-Autumn banquet', weight: 7, val: 1, tags: ['love', 'prince'], photo: { scene: 'palace', tod: 'night', anim: 'love', expr: 'shy', npcs: ['prince'] } });
      } else {
        await g.her('neutral', '...It was nice to see you again, Your Highness.');
        g.friend('prince', 5);
      }
      g.clearNpcs();
    },
  });

  add({
    id: 'own_job', phase: 'mid', weight: 2, when: (s) => s.age >= 16 && s.traits.bold > -10 && !s.flags.own_job,
    async run(g) {
      g.flag('own_job', true);
      await g.scene('home');
      await g.her('determined', { _: 'I got a job! At the teahouse, three days a week. I start tomorrow. I already said yes.', sassy: 'So I\'m employed now. You can congratulate me.' });
      const c = await g.choose(['"Without asking me? ...Congratulations. I\'m proud of you."', '"You should have asked first."', '"Absolutely not. Tell them no."']);
      if (c === 0) { g.esteem(6); g.need('freedom', 15); g.parent(4, -5); g.gold(40); }
      if (c === 1) { g.parent(1, 4); g.gold(40); await g.her('pout', 'I\'m sixteen...'); }
      if (c === 2) { g.parent(-2, 8); g.bond(-6); g.need('freedom', -20); g.esteem(-3); }
    },
  });

  add({
    id: 'capital_trip', phase: 'mid', weight: 2, when: (s) => s.age >= 16 && s.friends.mei >= 30 && !s.flags.capital,
    async run(g) {
      g.flag('capital', true);
      await g.scene('town');
      await g.her('worried', 'Mei and I want to go to the capital for the spring fair. Four days. We\'d travel with the tea caravan. Please?');
      const c = await g.choose(['"Go. Write to me every day."', '"Only if I come with you."', '"No. The roads are dangerous."']);
      if (c === 0) { g.need('freedom', 25); g.trust(6); g.stat('grace', 3); g.stat('wit', 2); g.esteem(5); g.gold(-30); g.remember({ id: 'capital', title: 'The capital', caption: 'Four days, forty letters.', text: 'my trip to the capital with Mei', letter: 'You let me go to the capital with Mei. I wrote you a letter every day, like you asked. Forty letters in four days. You kept all of them. I saw them in the box.', weight: 7, val: 1, tags: ['parent', 'freedom'], photo: { scene: 'palace', anim: 'cheer', expr: 'joy', npcs: ['mei'] } }); }
      if (c === 1) { g.bond(3); g.need('freedom', 5); g.gold(-50); g.stat('grace', 2); await g.her('shy', 'With you? ...Actually, that could be fun.'); }
      if (c === 2) { g.parent(-1, 6); g.need('freedom', -15); g.bond(-4); }
    },
  });

  add({
    id: 'future_talk', phase: 'mid', priority: 15, when: (s) => s.age >= 17 && !s.flags.future_talk,
    async run(g) {
      g.flag('future_talk', true);
      await g.scene('home', { tod: 'dusk' });
      await g.nar('She sits down across from you with the serious face she used to wear when she was small and had something important to say.');
      await g.her('thinking', 'Next Qixi I\'ll be eighteen. I keep thinking about what comes after. What do you want for me, ' + g.P + '?');
      const c = await g.choose(['"I want you to be happy. That\'s all."', '"I want you to chase your dream."', '"I want you to be safe, and close to home."']);
      if (c === 0) { g.trust(5); g.bond(4); g.esteem(3); }
      if (c === 1) { g.esteem(6); g.flag('dream_support', true); }
      if (c === 2) { g.parent(3, 3); g.bond(2); g.need('freedom', -5); }
      await g.her('calm', 'Thank you. For asking me, not just telling me.');
    },
  });

  // ================================================================ REQUESTS (season start)
  add({
    id: 'req_sleepover', phase: 'start', once: false, weight: 2, when: (s) => s.age <= 15 && s.friends.mei >= 25 && s.needs.friends < 60 && (s.seen.req_sleepover || -9) < s.turn - 5,
    async run(g) {
      g.s.seen.req_sleepover = g.s.turn;
      await g.her('happy', 'Can I sleep over at Mei\'s house? Her grandmother is making sesame balls!');
      const c = await g.choose(['"Have fun!"', '"Not this time."']);
      if (c === 0) { g.need('friends', 20); g.need('freedom', 8); g.need('fun', 10); g.friend('mei', 5); g.parent(2, -2); }
      else { g.need('freedom', -8); g.parent(0, 3); await g.her('pout', 'Fine...'); }
    },
  });
  add({
    id: 'req_festival_alone', phase: 'start', weight: 2, when: (s) => s.age >= 14,
    async run(g) {
      await g.her('shy', { _: 'This festival... can I go with my friends? Just us? Not that I don\'t want to go with you. I just...', sassy: 'So, the festival. Friends only. Nothing personal. Okay, a little personal.' });
      const c = await g.choose(['"Of course. Go and have fun."', '"I\'ll miss you. But yes."', '"No. We always go together."']);
      if (c <= 1) { g.need('freedom', 15); g.need('friends', 15); g.trust(4); g.parent(2, -3); if (c === 1) { g.bond(2); await g.her('teary', 'I\'ll bring you back a sugar figure. The best one.'); } }
      else { g.need('freedom', -10); g.bond(-2); g.parent(0, 5); }
    },
  });
  add({
    id: 'req_allowance', phase: 'start', weight: 1, when: (s) => s.age >= 12 && s.gold >= 60,
    async run(g) {
      await g.her('thinking', { _: 'Could I have some pocket money? There\'s a hairpin at the market. It has a little crane on it.', sassy: 'I have been an excellent daughter. I would like to be paid.' });
      const c = await g.choose(['Give her 20 coins.', '"Earn it. Help with the chores."', '"We don\'t have money for that."']);
      if (c === 0) { g.gold(-20); g.need('fun', 12); g.bond(2); g.learn('fact', 'crane', 'She saved up for a hairpin with a little crane on it.'); }
      if (c === 1) { g.trait('diligent', 3); g.stat('craft', 1); g.parent(0, 3); }
      if (c === 2) { g.need('fun', -5); }
    },
  });
  add({
    id: 'req_quit', phase: 'start', weight: 3, once: false,
    when: (s) => Object.keys(s.tried).some((id) => s.aff[id] <= -1 && (s.counts[id] || 0) >= 3 && !s.flags['quit_asked_' + id]),
    async run(g) {
      const id = Object.keys(g.s.tried).filter((x) => g.s.aff[x] <= -1 && (g.s.counts[x] || 0) >= 3 && !g.s.flags['quit_asked_' + x]).sort((a, b) => g.s.aff[a] - g.s.aff[b])[0];
      g.flag('quit_asked_' + id, true);
      const act = D.ACT[id].name;
      await g.her('sad', { _: 'Please let me stop ' + act + '. I\'ve tried. I really have.', sassy: 'I am formally resigning from ' + act + '. Effective immediately.' });
      const c = await g.choose(['"Alright. You tried your best."', '"Give it one more season."', '"No. It\'s good for you."']);
      if (c === 0) { g.trust(5); g.need('freedom', 10); g.parent(3, -4); g.flag('quit_' + id, g.s.turn + 4); }
      if (c === 1) { g.parent(1, 2); }
      if (c === 2) { g.parent(-2, 6); g.need('freedom', -10); g.bond(-3); }
    },
  });
  add({
    id: 'req_dress', phase: 'start', weight: 1, when: (s) => s.age >= 13 && s.wardrobe.length < 4 && s.gold >= 90,
    async run(g) {
      const o = U.pick(['plum', 'moon', 'festival'].filter((x) => !g.s.wardrobe.includes(x)));
      if (!o) return;
      const O = D.OUTFITS[o];
      await g.her('shy', 'There\'s a ' + O.name.toLowerCase() + ' at the tailor\'s. It\'s ' + g.s.fav.color + '... well, almost. Could I... no, never mind.');
      g.learn('fav', 'color', 'Her favorite color is ' + g.s.fav.color + '.');
      const c = await g.choose(['Buy it for her. (' + O.cost + ' coins)', '"Maybe for your birthday."']);
      if (c === 0) { g.gold(-O.cost); g.s.wardrobe.push(o); g.bond(4); g.esteem(3); await g.her('joy', 'Really?! I\'ll wear it to every festival!'); }
      else { await g.her('neutral', 'Okay!'); }
    },
  });
  add({
    id: 'req_choose', phase: 'start', priority: 12, when: (s) => s.age >= 16 && !s.flags.autonomy,
    async run(g) {
      await g.her('determined', { _: 'I\'m sixteen now. From now on, could I plan one month each season myself?', sassy: 'New rule proposal: one month per season is MINE. Discuss.' });
      const c = await g.choose(['"That\'s fair. Yes."', '"Only if you use it well."', '"Not yet."']);
      if (c <= 1) { g.flag('autonomy', true); g.need('freedom', 20); g.trust(5); g.parent(2, c === 1 ? 2 : -5); }
      else { g.need('freedom', -15); g.parent(0, 6); g.flag('autonomy_denied', g.s.turn); }
    },
  });
  add({
    id: 'req_help', phase: 'start', weight: (s) => 1 + s.stats.heart / 40, when: (s) => s.stats.heart >= 30,
    async run(g) {
      await g.her('worried', 'Old Granny Fang next door can\'t fix her roof and it\'s going to rain. Can I help her this week?');
      const c = await g.choose(['"Go. I\'ll bring tea for both of you."', '"Your lessons come first."']);
      if (c === 0) { g.stat('heart', 3); g.stress(4); g.bond(2); g.esteem(2); g.remember({ id: 'granny_roof', text: 'fixing Granny Fang\'s roof', weight: 3, val: 1, tags: ['kindness'] }); }
      else { g.parent(0, 3); g.trait('fiery', 2); }
    },
  });
  add({
    id: 'secret_cat', phase: 'start', weight: 3, when: (s) => s.flags.secret_cat && !s.flags.secret_cat_found,
    async run(g) {
      g.flag('secret_cat_found', true);
      await g.scene('town');
      await g.nar('On your way home you spot her crouched under the teahouse steps, feeding a scruffy cat from her own lunch.');
      await g.her('surprised', '...It\'s not what it looks like. It\'s exactly what it looks like.');
      const c = await g.choose(['"Bring it home. It\'s family now."', '"You disobeyed me."']);
      if (c === 0) { g.flag('pet', 'Little Tiger'); g.bond(8); g.trust(6); await g.her('cry', 'Really? Thank you, thank you!'); g.remember({ id: 'cat_home', text: 'the day Little Tiger came home', letter: 'When you found me feeding that cat in secret, you said "bring it home". I think that was the day I stopped being afraid of disappointing you.', weight: 7, val: 1, tags: ['parent', 'pet'] }); }
      else { g.bond(-4); g.parent(-2, 5); }
    },
  });
})();

</script>
<script>
/* Silver River — more of the town's life: the people around her have their own stories,
   and she acts on her own more and more as she grows. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const EV = (G.Events = G.Events || []);
  const add = (e) => EV.push(e);
  const cnt = (s, id) => s.counts[id] || 0;

  // ================================================================ THE PEOPLE AROUND HER
  add({
    id: 'mei_lantern', phase: 'mid', weight: 2, when: (s) => s.friends.mei >= 35 && s.age >= 11 && !s.flags.mei_lantern,
    async run(g) {
      g.flag('mei_lantern', true);
      await g.scene('town');
      g.npc('mei', 'right');
      await g.say('mei', 'The lantern contest is next month and our shop needs to win. Business has been so slow... I\'m building a rabbit. A HUGE rabbit. Will you help me paint it?');
      const c = await g.choose(['"Go help her. Lanterns can wait for no one."', '"Only after your lessons."', '"Not this time."']);
      if (c === 0) { g.stat('art', 2); g.stress(4); g.friend('mei', 12); g.parent(2, -2); await g.her('joy', 'I\'ll paint the ears! The ears are the most important part!'); g.remember({ id: 'rabbit_lantern', title: 'The rabbit lantern', caption: 'Two painters, one enormous rabbit.', text: 'painting the giant rabbit lantern with Mei', weight: 4, val: 1, tags: ['friend', 'mei'], photo: { scene: 'town', tod: 'night', anim: 'cheer', expr: 'joy', npcs: ['mei'] } }); }
      if (c === 1) { g.friend('mei', 5); g.parent(0, 3); await g.her('neutral', 'I\'ll come in the evenings, Mei. Promise.'); }
      if (c === 2) { g.friend('mei', -6); await g.say('mei', 'Oh. That\'s... okay. It\'s fine.'); await g.her('sad', '...'); }
      g.clearNpcs();
    },
  });

  add({
    id: 'tao_father', phase: 'mid', weight: 2, when: (s) => s.friends.tao >= 30 && s.age >= 12 && !s.flags.tao_father,
    async run(g) {
      g.flag('tao_father', true);
      await g.scene('market');
      g.npc('tao', 'right');
      await g.nar('The dumpling stall has only one cook today. Tao\'s father hurt his back carrying flour, and Tao is trying to do everything at once. There is flour in his eyebrows.');
      await g.say('tao', 'I\'m f-fine! Totally fine! Everything is under control! (Something in the steamer catches fire.)');
      await g.her('worried', g.P + ', can I help him this week? Please?');
      const c = await g.choose(['"Go. Take an apron."', '"You have your own lessons."']);
      if (c === 0) {
        g.stat('craft', 3); g.stat('heart', 2); g.stress(5); g.friend('tao', 15);
        await g.nar('By the end of the week the stall is running better than ever. Tao\'s father insists on paying her in buns. Forever.');
        g.remember({ id: 'tao_stall', title: 'The dumpling week', caption: 'Flour in everyone\'s eyebrows.', text: 'the week I ran the dumpling stall with Tao', weight: 5, val: 1, tags: ['friend', 'tao'], photo: { scene: 'market', anim: 'cook', expr: 'joy', npcs: ['tao'] } });
      } else { g.parent(0, 3); g.friend('tao', -3); await g.her('pout', 'Okay...'); }
      g.clearNpcs();
    },
  });

  add({
    id: 'gao_past', phase: 'mid', weight: 3, when: (s) => cnt(s, 'martial') >= 4 && !s.flags.gao_past,
    async run(g) {
      g.flag('gao_past', true);
      await g.scene('hall', { tod: 'dusk' });
      g.npc('gao', 'mentor');
      await g.nar('After practice, Master Gao sits on the steps rubbing his bad knee. For once he doesn\'t send her home.');
      await g.say('gao', 'You want to know why an old soldier teaches children? Twenty years ago my general ordered us to burn a village. I refused. They took my rank, and my knee.');
      await g.say('gao', 'A sword is for protecting. Never for proving. If you learn nothing else from me, learn that.');
      await g.her('determined', 'I\'ll remember, Master Gao.');
      g.stat('heart', 2); g.trait('fiery', -3);
      g.learn('fact', 'gao', 'Master Gao lost his rank for refusing an order to burn a village.');
      g.remember({ id: 'gao_sword', text: 'what Master Gao told me about swords', letter: 'Master Gao once told me a sword is for protecting, never for proving. I think you already knew that. I think that\'s why you let me learn.', weight: 5, val: 1, tags: ['mentor'] });
      g.clearNpcs();
    },
  });

  add({
    id: 'wen_poem', phase: 'mid', weight: 3, when: (s) => cnt(s, 'academy') >= 4 && !s.flags.wen_poem,
    async run(g) {
      g.flag('wen_poem', true);
      await g.scene('academy');
      g.npc('wen', 'mentor');
      await g.nar('Scholar Wen is on his hands and knees, searching every shelf. The only copy of a poem his late wife wrote has gone missing.');
      await g.say('wen', 'Forty years... and I cannot remember the third line. I can remember every classic in the empire, and not her third line.');
      if (g.check('wit', 45)) {
        await g.her('thinking', 'You read it to us once, in the spring. "The swallows return before the plum rain; / I keep the lamp lit, though you know the way..."');
        await g.nar('Scholar Wen stares at her. Then he writes it down with a shaking hand, and doesn\'t speak for a long time.');
        g.stat('wit', 3); g.esteem(6);
        g.remember({ id: 'wen_poem', text: 'remembering Scholar Wen\'s poem', letter: 'Do you remember when I recited Scholar Wen\'s lost poem? He framed it. It hangs in the academy now, next to a note with my name on it.', weight: 6, val: 1, tags: ['mentor', 'pride'] });
      } else {
        await g.her('sad', 'I\'m sorry, Scholar Wen. I don\'t remember it either.');
        await g.nar('They search together until dark. It turns up inside a dictionary, used as a bookmark. He laughs until he cries.');
        g.stat('heart', 2);
      }
      g.clearNpcs();
    },
  });

  add({
    id: 'bao_secret', phase: 'mid', weight: 3, when: (s) => cnt(s, 'kitchen') >= 4 && !s.flags.bao_secret,
    async run(g) {
      g.flag('bao_secret', true);
      await g.scene('kitchen');
      g.npc('bao', 'mentor');
      await g.say('bao', 'Come here. Closer. I\'m getting old and somebody has to know. The secret of my dumplings...');
      await g.say('bao', '...is that I make every batch for somebody. Not for customers. For somebody. You taste the difference. Now go and never tell anyone.');
      await g.her('teary', 'That\'s the most beautiful thing anyone has ever said about a dumpling.');
      g.stat('craft', 3); g.stat('heart', 1);
      g.learn('fact', 'bao', 'Auntie Bao told her the secret of her dumplings. She won\'t tell you what it is.');
      g.clearNpcs();
    },
  });

  add({
    id: 'xing_comet', phase: 'mid', weight: 3, when: (s) => cnt(s, 'observatory') >= 3 && !s.flags.xing_comet,
    async run(g) {
      g.flag('xing_comet', true);
      await g.scene('observatory');
      g.npc('xing', 'mentor');
      await g.nar('A comet crosses the sky, trailing silver. Old Xing watches it with tears in his beard.');
      await g.say('xing', 'Six years ago I was sitting right here on Qixi night. I saw a star fall toward Peach Blossom Town. I wrote it down. I never told anyone. I thought I was going mad.');

      g.clearNpcs();

  add({
    id: 'jingci_past', phase: 'mid', weight: 3, when: (s) => cnt(s, 'temple') >= 4 && !s.flags.jingci_past,
    async run(g) {

      g.learn('fact', 'jingci', 'Abbess Jingci was once a palace lady who walked away from it all.');
      g.clearNpcs();
    },
  });

  add({
    id: 'liu_friend', phase: 'mid', weight: 3, when: (s) => cnt(s, 'guqin') >= 4 && !s.flags.liu_friend,
    async run(g) {
      g.flag('liu_friend', true);

        const c = await g.choose(['"I\'m sorry, old friend. I should have written."', '"Some things are more important than the palace."']);
        g.bond(4); g.stat('art', 3);
        await g.nar('That evening the two of you play together for the first time in twenty years. She sits between you with her eyes closed.');
        g.remember({ id: 'duet', title: 'The duet', caption: 'Two old friends, one guqin each.', text: 'the night you and Maestro Liu played together', letter: 'I will never forget the night you and Maestro Liu played your old duet. I didn\'t know you could play like that. I didn\'t know you had given it up for me.', weight: 9, val: 1, tags: ['parent', 'music'], photo: { scene: 'teahouse', tod: 'night', anim: 'guqin', expr: 'love', npcs: ['liu'] } });
        void c;
      } else {
        await g.say('liu', 'I had a friend once who played better than me. One day he vanished. His guqin was never found.');
        await g.nar('A season later, she spots an old guqin at the market with a crane carved on it, exactly as he described. She spends all her savings on it.');
        const c = await g.choose(['Add the rest of the money yourself. (30 coins)', 'Let her pay for it herself.']);
        if (c === 0) { g.gold(-30); g.bond(3); } else { g.stat('craft', 1); g.esteem(3); }
        await g.say('liu', '...This is his. Where did you... Child. Thank you.');
        g.stat('art', 2); g.stat('heart', 2);
      }
      g.clearNpcs();

  add({
    id: 'yue_last', phase: 'mid', weight: 3, when: (s) => cnt(s, 'dance') >= 4 && s.age >= 14 && !s.flags.yue_last,
    async run(g) {
      g.flag('yue_last', true);

      const c = await g.choose(['"You were born for this. Go."', '"Only if you want to."']);

      if (g.check('art', 40)) { g.stat('art', 3); g.stat('grace', 2); g.esteem(6); await g.nar('Teacher and student dance the last piece together. When the music ends, Dancer Yue bows, not to the audience, but to her.'); }
      else { g.stat('grace', 2); await g.nar('She stumbles once. Dancer Yue catches her hand mid-turn and turns the stumble into a spin. Nobody notices. She will never forget it.'); }
      g.remember({ id: 'yue_last', title: 'The last dance', caption: 'Dancer Yue\'s final performance.', text: 'dancing beside Dancer Yue at her last performance', weight: 5, val: 1, tags: ['mentor'], photo: { scene: 'palace', tod: 'night', anim: 'dance', expr: 'joy', npcs: ['yue'] } });
      g.clearNpcs();
    },

  add({
    id: 'hua_softens', phase: 'mid', weight: 3, when: (s) => cnt(s, 'etiquette') >= 4 && !s.flags.hua_softens,
    async run(g) {
      g.flag('hua_softens', true);

      g.npc('hua', 'mentor');

      await g.nar('She presses a small jade hairpin into her palm.');
      await g.say('hua', 'It was mine when I was your age. Don\'t lose it. And don\'t tell anyone I was kind to you.');
      g.stat('grace', 3); g.esteem(3);
      g.learn('fact', 'hua', 'Madam Hua gave her a jade hairpin from her own girlhood at court.');
      g.clearNpcs();
    },
  });

  add({
    id: 'wanyin_music', phase: 'mid', weight: 3, when: (s) => s.flags.wanyin_friend && !s.flags.wanyin_music,
    async run(g) {
      g.flag('wanyin_music', true);
      await g.scene('town');
      g.npc('wanyin', 'right');
      await g.say('wanyin', 'My father has forbidden me from studying the guqin. He says music is for entertainers, not for magistrates\' daughters. Would your family... speak to him?');
      const c = await g.choose(['Go and speak to the magistrate yourself.', 'Let your daughter plead Wanyin\'s case.', '"It isn\'t our place to interfere."']);
      if (c === 0) { g.parent(3, 2); await g.nar('The magistrate listens to you with a face like thunder. A week later, Wanyin has a guqin teacher. Nobody is quite sure why.'); g.friend('wanyin', 15); g.bond(2); }
      if (c === 1) { if (g.check('grace', 45)) { g.esteem(6); g.friend('wanyin', 20); await g.her('smug', 'He said yes! I talked for an hour. I used all seventeen polite ways to say thank you!'); } else { g.friend('wanyin', 8); await g.her('sad', 'He said no. But Wanyin says nobody has ever stood up to him for her before.'); } }
      if (c === 2) { g.friend('wanyin', -5); g.parent(0, 2); }

    },

  add({
    id: 'mei_wedding', phase: 'mid', weight: 3, when: (s) => s.age >= 17 && s.friends.mei >= 45 && !s.flags.mei_wedding,
    async run(g) {
      g.flag('mei_wedding', true);

      g.npc('mei', 'right');

      g.friend('mei', 15);
      g.remember({ id: 'mei_wedding', title: 'Bridesmaid', caption: 'Of course it was always going to be her.', text: 'the day Mei asked me to be her bridesmaid', weight: 6, val: 1, tags: ['friend', 'mei'], photo: { scene: 'garden', tod: 'dusk', anim: 'love', expr: 'teary', npcs: ['mei'] } });
      g.clearNpcs();

  add({
    id: 'prince_escape', phase: 'mid', weight: 3, when: (s) => s.flags.prince_route && !s.flags.prince_escape,
    async run(g) {

      const c = await g.choose(['"Go. I\'ll cover for you both."', '"Take her, but be home by the third bell."', '"Absolutely not. Go back to the palace, Your Highness."']);
      if (c <= 1) { g.friend('prince', 15); g.need('freedom', 15); g.trust(6); await g.her('love', 'Come on, Jing! You have to try the stinky tofu. No, you HAVE to.'); g.remember({ id: 'night_market', title: 'Night market', caption: 'A prince, a star, and stinky tofu.', text: 'showing Jing the night market', weight: 6, val: 1, tags: ['love', 'prince'], photo: { scene: 'market', tod: 'night', anim: 'cheer', expr: 'love', npcs: ['prince'] } }); }
      else { g.friend('prince', -5); g.parent(-1, 6); g.need('freedom', -10); await g.her('pout', 'You\'re so strict!'); }
      g.clearNpcs();
    },
  });

  add({
    id: 'kittens', phase: 'mid', weight: 2, when: (s) => s.flags.pet && s.turn >= 6 && !s.flags.kittens,
    async run(g) {
      g.flag('kittens', true);

      await g.her('love', { _: 'KITTENS! Can we keep them? All of them? Look at this one, it has a star on its nose!', sassy: 'I\'m naming them all. You can\'t stop me. This one is Emperor Sneeze.' });
      const c = await g.choose(['Keep them all. Why not.', 'Keep the one with the star; find homes for the rest.']);
      if (c === 0) { g.bond(4); g.stat('heart', 2); g.gold(-10); await g.nar('The courtyard is now, officially, a cat kingdom.'); }
      else { g.bond(2); g.stat('heart', 3); await g.nar('She finds each kitten a family herself, and checks on every one of them weekly.'); }
      g.remember({ id: 'kittens', title: 'Kittens', caption: 'Four kittens in the laundry.', text: 'the morning the kittens were born', weight: 4, val: 1, tags: ['pet'], photo: { scene: 'home', anim: 'love', expr: 'love' } });
    },
  });

  add({
    id: 'old_friend', phase: 'mid', weight: 2, when: (s) => s.age >= 13 && !s.flags.old_friend,
    async run(g) {
      g.flag('old_friend', true);
      const who = { general: 'a grizzled soldier who served under you at the northern pass', scholar: 'your old study partner, now a magistrate in the south', merchant: 'a desert trader you once pulled out of a sandstorm', physician: 'a woman whose child you saved during the plague winter', musician: 'a court lady who still hums your songs', tea: 'the tea master who once called your leaves ordinary' }[g.s.parent.bg];
      const story = { general: 'held the pass alone for a night so the rest of us could sleep', scholar: 'gave away the answers to the exam to a poor student, and failed yourself', merchant: 'walked back into the storm for a stranger\'s camel', physician: 'didn\'t sleep for forty nights', musician: 'made the Empress cry with one song', tea: 'proved me wrong, and I have never been happier to be wrong' }[g.s.parent.bg];
      await g.scene('home');
      await g.nar('A visitor comes to your gate: ' + who + '. Over tea, they tell her stories about you. You try to stop them. They do not stop.');
      await g.nar('"Did you know your ' + (g.s.parent.role === 'mom' ? 'mother' : 'father') + ' once ' + story + '?"');
      await g.her('surprised', { _: g.P + '! You never told me any of this!', sassy: 'Excuse me? You were COOL?' });
      g.bond(4); g.trust(3);
      g.remember({ id: 'old_friend', text: 'the day your old friend told me stories about you', letter: 'When your old friend visited and told me how you ' + story + ', I looked at you differently. Like you were a whole person, not just my ' + g.P + '. I liked both.', weight: 6, val: 1, tags: ['parent'] });
    },
  });

  // ================================================================ HER OWN INITIATIVE
  add({
    id: 'tea_for_you', phase: 'mid', priority: 18, when: (s) => s.focus === 'work' && s.bond >= 45 && !s.flags.tea_for_you,
    async run(g) {
      g.flag('tea_for_you', true);
      await g.scene('home', { tod: 'night' });
      await g.nar('You come home late again, bone-tired. There is a pot of tea waiting, still warm, and a note in her handwriting.');
      await g.nar('"You work too hard. Drink this. It has honey in it. Don\'t argue. — ' + g.name + '"');
      await g.her('shy', '(From the doorway) ...Did you drink it?');
      g.bond(3); g.stat('heart', 2);
      g.remember({ id: 'tea_note', text: 'the tea I left for you', letter: 'Do you still have the note I left with your tea, back when you worked every night? I found it in your drawer once. You kept it.', weight: 6, val: 1, tags: ['parent'] });
    },
  });

  add({
    id: 'gift_for_you', phase: 'mid', weight: (s) => (s.bond >= 60 ? 3 : 0), when: (s) => s.bond >= 60 && s.turn >= 4 && !s.flags.gift_for_you,
    async run(g) {
      g.flag('gift_for_you', true);
      const top = Object.keys(g.s.stats).sort((a, b) => g.s.stats[b] - g.s.stats[a])[0];
      const gift = { vigor: 'a walking stick she carved and sanded herself, "for your knees"', wit: 'a scroll with a poem about you, in her very best calligraphy', art: 'a song she wrote for you, played badly and perfectly on the guqin', grace: 'a tea ceremony, just for you, with every one of the seventeen polite thank-yous', heart: 'a charm she carried to the temple every day for a month', craft: 'a basket of dumplings, each one folded into a different animal' }[top];
      await g.scene('home');
      await g.her('shy', { _: 'Close your eyes. No peeking. ...Okay, open!', sassy: 'Don\'t make a big deal about this. Here.' });
      await g.nar('It is ' + gift + '.');
      const c = await g.choose(['Hug her tight.', 'Tell her it\'s the best gift you\'ve ever received.']);
      g.bond(4); g.esteem(3); void c;
      g.remember({ id: 'gift_for_you', title: 'A gift for you', caption: 'No reason. Just because.', text: 'the gift I made for you', letter: 'I made you ' + gift + ' once, for no reason at all. You looked at me like I\'d given you the moon.', weight: 7, val: 1, tags: ['parent'], photo: { scene: 'home', anim: 'love', expr: 'shy' } });
    },
  });

  add({
    id: 'defends_kid', phase: 'mid', weight: 2, when: (s) => s.stats.heart >= 35 && s.traits.bold > -20 && s.age >= 12 && !s.flags.defends_kid,
    async run(g) {
      g.flag('defends_kid', true);
      await g.scene('town');
      await g.nar('A woman you barely know stops you in the market and grabs both your hands.');
      await g.nar('"Your daughter stood between my son and three bigger boys today. She didn\'t hit anyone. She just stood there until they left. I wanted you to know."');
      await g.her('shy', { _: 'It wasn\'t a big deal...', sassy: 'They were being idiots. Someone had to be less of an idiot.' });
      const c = await g.choose(['"I\'m so proud of you."', '"That was brave, but be careful."']);
      g.esteem(c === 0 ? 7 : 4); g.stat('heart', 2); g.trait('bold', 3);
      if (c === 0) g.bond(2);
    },
  });

  add({
    id: 'caught_lying', phase: 'mid', weight: 2, when: (s) => s.age >= 13 && s.trust < 55 && s.secrets.length > 0 && !s.flags.caught_lying,
    async run(g) {
      g.flag('caught_lying', true);
      await g.scene('home', { tod: 'dusk' });
      await g.nar('She told you she was at the library. The librarian mentions, very kindly, that she hasn\'t been in for weeks.');
      await g.her('worried', 'I... I can explain.');
      const c = await g.choose(['"Then explain. I\'m listening."', '"You lied to me. You\'re grounded."', '"I\'m not angry. I\'m sad you felt you had to lie."']);
      const sec = g.s.secrets[0];
      if (c === 0 || c === 2) {
        if (sec) { await g.nar('It all comes out: ' + sec.text.charAt(0).toLowerCase() + sec.text.slice(1)); g.learn('fact', sec.id, sec.text); }
        g.trust(c === 2 ? 8 : 5); g.bond(2); g.parent(3, 1);
        await g.her('teary', 'I\'m sorry. I should have just told you.');
      } else {
        g.trust(-6); g.bond(-5); g.parent(-2, 7); g.flag('grounded', g.s.turn + 1);
        await g.her('angry', 'Fine! This is exactly why I didn\'t tell you!');
      }
    },
  });

  add({
    id: 'runaway', phase: 'mid', priority: 40, when: (s) => s.age >= 14 && !s.flags.runaway && (s.bond < 22 || (s.flags.rebellious || 0) >= 3),
    async run(g) {
      g.flag('runaway', true);
      await g.scene('mountain', { tod: 'night' });
      await g.nar('Her bed is empty. Her travel bag is gone. On her pillow: "Don\'t look for me."');
      await g.nar('You search all night. At dawn you find her on the mountain path, sitting on a rock, shivering, looking at the stars.');
      await g.her('cry', { _: 'I don\'t even know where I was going. I just couldn\'t stay.', sassy: 'Great. Found. I didn\'t even make it to the next village. Go ahead and yell.' });
      const c = await g.choose(['Wrap your coat around her and sit down beside her.', '"How could you do this to me?"']);
      if (c === 0) {
        g.bond(10); g.trust(8); g.parent(6, -4); g.need('love', 25);
        await g.nar('You sit together until the sun comes up. Neither of you says much. On the way home, she holds your sleeve like she did when she was small.');
        g.remember({ id: 'runaway_found', text: 'the night I ran away and you found me', letter: 'The night I ran away, you didn\'t shout. You gave me your coat and watched the sunrise with me. I think that\'s the night I decided to come home for real.', weight: 9, val: 1, tags: ['parent'] });
      } else {
        g.bond(-4); g.parent(-3, 5);
        g.remember({ id: 'runaway_angry', text: 'the night I ran away', letter: 'When I ran away, you asked how I could do that to you. I didn\'t know how to tell you I wasn\'t doing it to you. I was just drowning.', weight: 7, val: -1, tags: ['parent'] });
      }
    },
  });
})();

<script>
/* Silver River — the town keeps living while you plan: friends drop by the courtyard, and word gets around. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const D = G.D;
  const M = G.Mind;
  const Town = (G.Town = {});

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  // stable per-season choice so the news doesn't flicker every time the HUD redraws
  function hash(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = Math.imul(n, 9);
    n ^= n >>> 4;
    n = Math.imul(n, 0x27d4eb2d);
    return (n ^ (n >>> 15)) >>> 0;
  }
  const seen = (s, id) => !!(s.seen && s.seen[id]);
  const count = (s, id) => (s.counts && s.counts[id]) || 0;

  // ================================================================ word around town
  // [when(s), text | text(s), weight]. Specific story news outweighs the everyday chatter.
  const NEWS = [
    // her own reputation
    [(s) => s.stats.vigor >= 45, (s) => `The children in the lane play "Sword Saint" now. Everybody wants to be ${s.name}.`, 3],
    [(s) => s.stats.wit >= 45, () => 'Scholar Wen has been bragging about his best student to anyone who holds still long enough.', 3],
    [(s) => s.stats.art >= 45, (s) => `Someone was humming ${s.name}'s tune at the well this morning. They didn't know where they'd heard it.`, 3],
    [(s) => s.stats.grace >= 45, () => 'Madam Hua used your daughter as the example in class. The other girls were not pleased.', 3],
    [(s) => s.stats.heart >= 45, (s) => `Auntie Bao says ${s.name} is the only child in town who says thank you twice.`, 3],
    [(s) => s.stats.craft >= 45, (s) => `Three shops on Willow Street have ${s.name}'s knotwork charms hanging in the window.`, 3],
    [(s) => s.star >= 6, () => 'People say the stars have been brighter over your roof lately. The neighbors have started leaving out tea.', 3],
    [(s) => s.stress >= 70, (s) => `Auntie Bao stopped you in the street to ask if ${s.name} is eating properly. She looked worried.`, 4],
    [(s) => s.bond >= 80, (s) => `The neighbors say they can hear you and ${s.name} laughing from across the lane. They say it like a compliment.`, 2],
    [(s) => (s.earned || 0) >= 600, (s) => `Word is that ${s.name} is the hardest worker in Peach Blossom Town. Shopkeepers ask after her by name.`, 2],
    // the story so far
    [(s) => seen(s, 'contest_win') || seen(s, 'contest_proud'), (s) => `The poetry contest scroll with ${s.name}'s name on it still hangs in the academy hall. Wanyin walks past it very quickly.`, 5],
    [(s) => seen(s, 'kitten') && !s.flags.pet, () => 'A skinny calico has been seen sleeping on your wall. She looks like she is waiting for something.', 3],
    [(s) => s.flags.pet, (s) => `${s.flags.pet} was spotted stealing a fish from the market. The fishmonger has sworn revenge.`, 3],
    [(s) => seen(s, 'kittens'), () => 'The kittens from the woodshed have all found homes. One lives at the teahouse now and bites the customers.', 4],
    [(s) => seen(s, 'defends_kid'), () => 'The lane boys have stopped calling names. Mostly. The little one follows your daughter around now.', 4],
    [(s) => seen(s, 'tao_father') || seen(s, 'tao_stall'), () => 'Tao runs the dumpling stall by himself on market days now. His folds have gotten very neat.', 4],
    [(s) => s.flags.tao_crush || s.flags.tao_love, (s) => `Tao burned a whole tray of buns yesterday. Someone said "${s.name}" in the street and he forgot they were in the steamer.`, 4],
    [(s) => seen(s, 'mei_wedding'), () => 'Mei\'s new family sent red eggs to every house on the lane. Yours had an extra one.', 5],
    [(s) => seen(s, 'mei_trouble') || seen(s, 'mei_medicine'), () => 'Mei\'s grandmother is walking to market by herself again. She credits "that star girl\'s medicine".', 4],
    [(s) => seen(s, 'mei_lantern') || seen(s, 'rabbit_lantern'), () => 'The giant rabbit lantern is hanging in Mei\'s window all year now. Her grandmother has given up.', 3],
    [(s) => seen(s, 'gao_past'), () => 'Master Gao was seen laying incense at the old soldiers\' shrine. He told the watchman he was "checking the roof".', 4],
    [(s) => seen(s, 'gao_sword'), () => 'Master Gao\'s old sword is off the wall. He says it is for cleaning. He has been cleaning it for weeks.', 3],
    [(s) => seen(s, 'wen_poem'), () => 'Scholar Wen\'s new poem is being copied all over town. He pretends to hate the attention.', 4],
    [(s) => seen(s, 'liu_friend') || seen(s, 'duet'), () => 'Maestro Liu plays duets at dusk again. People have started sitting on the wall outside to listen.', 4],
    [(s) => seen(s, 'hua_softens'), () => 'Madam Hua laughed out loud at the teahouse. People are still talking about it. Some say it was a sneeze.', 4],
    [(s) => seen(s, 'jingci_past'), () => 'Abbess Jingci has started a free school at the temple for the ferry children.', 4],
    [(s) => seen(s, 'bao_secret'), () => 'Auntie Bao\'s dumpling line is longer than ever. She still won\'t tell anyone the secret. Except, apparently, your daughter.', 4],

  Town.news = function (s) {

    const pool = [];

    (SEASON_NEWS[sea] || []).forEach((t) => pool.push([() => t, 1.5]));
    const total = pool.reduce((a, b) => a + b[1], 0);

      if ((r -= w) <= 0) return typeof text === 'function' ? text(s) : text;

  };

  // ================================================================ courtyard visitors
  // lines: [who, text] with who = 'npc' | 'her'. Her lines may be voice banks, which M.pick resolves.
  const VISITS = {
    mei: [
      { band: 'kid', lines: [['npc', '{name}! {name}! I found a frog with a crooked leg. I named him General.'], ['her', { sunny: 'General Frog! Can he come to dinner?', soft: 'Is he okay? Does his leg hurt?', sassy: 'General of what? The puddle?', dreamy: 'Maybe he\'s a prince under a curse!', earnest: 'He needs clean water. We should build him a pond.' }], ['npc', 'He is in my sleeve. Do you want to hold him?']] },
      { band: 'kid', lines: [['npc', 'Grandma made sesame balls. I only ate four on the way here.'], ['her', { _: 'Only four? Mei, there are two left.', sunny: 'Two for me! Wait. Where are the other ones? Mei!' }], ['npc', 'They were very small sesame balls.']] },
      { band: 'kid', lines: [['npc', 'Want to play kingdoms? You can be the empress this time.'], ['her', { _: 'Then you\'re the dragon!', soft: 'Can we both be empresses?', sassy: 'I\'m ALWAYS the empress. That\'s just correct.' }], ['npc', 'RAAAWR! The dragon demands tribute! Tribute is snacks!']] },
      { band: 'teen', lines: [['npc', 'Did you hear? Wanyin\'s family hired a THIRD tutor.'], ['her', { _: 'A third? What do they even teach her?', sassy: 'Maybe the third one teaches her how to smile.', soft: 'Poor Wanyin. That sounds lonely.' }], ['npc', 'Fan etiquette. Advanced fan etiquette. I\'m not joking.']] },
      { band: 'teen', lines: [['npc', 'Promise we\'ll still be friends when we\'re old and wrinkly.'], ['her', { _: 'Only if you promise to still be this loud.', soft: 'I promise. Pinky promise.', dreamy: 'We\'ll sit on a porch and throw seeds at pigeons. Forever.' }], ['npc', 'I will be SO loud. I\'ll be the loudest grandma in the province.']] },
      { band: 'teen', lines: [['npc', 'The lantern-maker\'s son looked at me today. Or at the wall behind me. It\'s hard to tell.'], ['her', { _: 'Was the wall pretty?', sunny: 'Mei! Tell me everything!', earnest: 'We should find out. Scientifically.' }], ['npc', 'It was a very average wall. So. It was me. Probably.']] },
      { band: 'young', lines: [['npc', 'Grandma invited the matchmaker again. I "accidentally" went to buy vinegar for three hours.'], ['her', { _: 'How long can one person buy vinegar?', sassy: 'Legendary. You\'re my hero.', soft: 'You don\'t want to get married yet?' }], ['npc', 'I want to choose, that\'s all. Is that so much to ask?']] },
      { band: 'young', lines: [['npc', 'Do you ever think about what we\'ll be doing in ten years?'], ['her', (s) => (s.dream ? { _: 'Every day. I know exactly what I want.', dreamy: 'Sometimes. Mostly I think about the stars.' } : { _: 'Honestly? I have no idea.', sassy: 'Something amazing. Details to follow.' })], ['npc', 'Whatever it is, I get to visit. That\'s the rule.']] },
      { when: (s) => seen(s, 'mei_wedding'), lines: [['npc', 'Married life is mostly arguing about where the teapot goes.'], ['her', { _: 'And?', sunny: 'Do you win?' }], ['npc', 'And I love it. Don\'t tell him I said that.']] },
      { when: (s) => s.stress >= 65, lines: [['npc', '{name}, you look like a wrung-out dishcloth.'], ['her', { _: '...Thanks, Mei.', sassy: 'Wow. Thank you. Very kind.' }], ['npc', 'Come play tomorrow. Doctor Mei says so. Doctor Mei is very strict.']] },
    ],
    tao: [
      { band: 'kid', lines: [['npc', 'I-I brought buns. My father said to. I mean, I wanted to. Both.'], ['her', { _: 'Thank you, Tao!', sassy: 'Are they pork? They\'d better be pork.', soft: 'You brought these for me?' }], ['npc', 'They\'re pork. I-I checked. Twice.']] },
      { band: 'kid', lines: [['npc', 'Can you really talk to the stars?'], ['her', { _: 'Only on clear nights.', sassy: 'Only on Tuesdays.', dreamy: 'They mostly talk to me. They\'re very chatty.' }], ['npc', 'W-whoa. Can you ask them if I\'ll be tall?']] },
      { band: 'teen', lines: [['npc', 'Your hair looks... um. Shiny. Today. Like normal. Normal shiny.'], ['her', { _: '...Thank you?', sassy: 'Are you okay, Tao? You\'re very red.', soft: '(She tucks a strand behind her ear.) Oh. Um. Thanks.' }], ['npc', 'I have to go. There\'s a... bun. Emergency. Goodbye!']] },
      { band: 'teen', lines: [['npc', 'I invented a new dumpling. It has a whole shrimp inside. I named it after... no one. It doesn\'t have a name.'], ['her', { _: 'What would you have named it?', sassy: 'You named it after me, didn\'t you.' }], ['npc', 'N-no! ...Maybe. It\'s a very good dumpling.']] },
      { band: 'young', when: (s) => s.flags.tao_love || s.friends.tao >= 50, lines: [['npc', 'I saved you the first batch. I always save you the first batch.'], ['her', { _: 'I know. I always know.', soft: '(She smiles into her sleeve.) I know.' }], ['npc', 'Good. That\'s... good. I\'ll bring more tomorrow.']] },
      { band: 'young', lines: [['npc', 'My father says I can take over the stall next year. My own stall.'], ['her', { _: 'Tao! That\'s wonderful!', sassy: 'Finally. The world is ready for the shrimp dumpling.' }], ['npc', 'You\'ll come eat there? Sometimes? Every day?']] },
    ],
    wanyin: [
      { lines: [['npc', 'I was passing by. Obviously not to see you.'], ['her', { _: 'Obviously.', sunny: 'Wanyin! Come in, come in!' }], ['npc', 'I brought pear candy. Also obviously not for you.']] },
      { band: 'teen', lines: [['npc', 'My father wants me to learn the pipa. I want to learn swordsmanship.'], ['her', { _: 'You\'d be scary with a sword.', sassy: 'You\'d be terrifying. Do it.' }], ['npc', 'Thank you. That is the nicest thing anyone has ever said to me.']] },
      { band: 'young', lines: [['npc', 'My father wants me to marry a magistrate\'s son. I want to sit the exam in the capital.'], ['her', { _: 'Which one wins?', earnest: 'You should sit the exam. You\'d come first.' }], ['npc', 'Me. Obviously. I always win. ...Except against you.']] },
    ],
    prince: [
      { lines: [['npc', 'Don\'t bow. Please. I came over the wall. Nobody knows I\'m here.'], ['her', { _: 'You came over OUR wall?', sassy: 'You know we have a door, right?', soft: 'Are you in trouble?' }], ['npc', 'Doors have guards. Walls have adventure. ...And moss. So much moss.']] },
      { lines: [['npc', 'I brought you a riddle from the palace. The court scholars couldn\'t solve it.'], ['her', { _: 'Give it here.', sassy: 'The court scholars can\'t solve anything.' }], ['npc', 'That is exactly what I told them. They did not laugh.']] },
    ],
    gao: [
      { lines: [['npc', 'Your stance, girl. Show me.'], ['her', { _: '(She drops into a horse stance.) Like this?', sassy: '(Horse stance, with a smirk.) Like this, Master?' }], ['npc', 'Hmph. Adequate. ...Good, even.'], ['her', { _: 'Did you just say good?!' }], ['npc', 'I said adequate.']] },
      { lines: [['npc', 'My knee says it will rain. Keep her training indoors tomorrow.'], ['her', { _: 'Your knee is never wrong, Master?', sassy: 'Does your knee also do weather for weddings?' }], ['npc', 'Never. It was wrong once, in the war. We don\'t talk about that.']] },
    ],
    wen: [
      { lines: [['npc', 'I happened to be in the neighborhood, and happened to have a riddle on me.'], ['her', { _: 'Go on!', sassy: 'You never just "happen" to have a riddle.' }], ['npc', 'What has roots nobody sees, is taller than trees, and yet never grows?'], ['her', { _: 'A mountain!', earnest: 'A mountain. The roots are the bedrock.' }], ['npc', '...Who told you?']] },
      { lines: [['npc', 'She quoted Mencius at me yesterday. Against me. Correctly.'], ['her', { _: 'You said to think for myself!', sassy: 'You walked right into it, Teacher.' }], ['npc', 'I did say that. I regret nothing. Mostly.']] },
    ],
    liu: [
      { lines: [['npc', 'I heard a wrong note from the street and thought: ah, that must be my student.'], ['her', { _: 'It was a creative note!', soft: 'I\'m sorry, Maestro...' }], ['npc', 'A wrong note played with courage is half of music. The other half is practice.']] },
    ],
    hua: [
      { lines: [['npc', 'I was passing. Stand up straight.'], ['her', { _: '(She straightens like a bamboo shoot.)', sassy: '(She straightens. Very, very slowly.)' }], ['npc', 'Better. ...Your {Pc} must be proud.']] },
    ],
    bao: [
      { lines: [['npc', 'I made too many dumplings. I always make too many dumplings. Take these.'], ['her', { _: 'Auntie Bao, you\'re the best!', sassy: 'You made too many on purpose. I know your tricks.' }], ['npc', 'Eat! Eat! Everyone is too thin!']] },
      { lines: [['npc', 'Your girl burned my steamer again. I forgive her. I forgive everyone who eats.'], ['her', { _: 'It was only a little bit on fire!' }], ['npc', 'A little bit on fire is still on fire, child.']] },

      { when: (s) => s.star >= 4, lines: [['npc', 'The Weaver Star flickered when you laughed just now. Did you know that?'], ['her', { _: 'Don\'t tease me, Old Xing.', dreamy: '...I felt it. Like someone waving.' }], ['npc', 'I never tease about stars. Only about my cooking.']] },

  // townsfolk who drop by to tell you something about her. {aunt} is how a child of the town addresses you.
  const ABOUT_HER = {

    ],
    wen: [

    ],
    lu: [
      { when: (s) => s.flags.fever, lines: [['npc', 'Just checking on my favorite patient. No fever? Good.'], ['her', { _: 'I\'m completely better!' }], ['npc', 'Good. And nobody tell her how worried I was that week.']] },
    ],
    xing: [
      { when: (s) => s.star >= 7 && s.turn >= s.turns - 6, lines: [['npc', 'The Weaver Star has been flickering all week. Keep her close.'], ['her', { _: 'Old Xing, you\'re being spooky again.', dreamy: '...I\'ve been dreaming about the river.' }], ['npc', 'The river is getting restless, that is all. Rivers do. Keep her close.']] },

  Object.entries(ABOUT_HER).forEach(([id, list]) => (VISITS[id] = (VISITS[id] || []).concat(list.map((v) => Object.assign({ about: true }, v)))));

  function candidates(s) {
    const c = [];
    const add = (id, w) => w > 0 && c.push([id, w]);
    add('mei', s.friends.mei >= 20 ? 1.4 + s.friends.mei / 45 : 0);
    add('tao', s.friends.tao >= 20 || s.flags.tao_crush || s.flags.tao_love ? 1.4 + s.friends.tao / 40 : 0);
    add('wanyin', s.flags.wanyin_friend || s.friends.wanyin >= 30 ? 1.2 : 0);
    add('prince', s.flags.prince_met && s.age >= 14 && s.friends.prince >= 30 ? 0.6 : 0);
    add('gao', count(s, 'martial') >= 3 ? 0.9 : 0);
    add('wen', count(s, 'academy') >= 3 ? 0.9 : 0);
    add('liu', count(s, 'guqin') >= 3 ? 0.8 : 0);
    add('hua', count(s, 'etiquette') >= 3 ? 0.7 : 0);
    add('bao', count(s, 'kitchen') + count(s, 'stall') >= 2 ? 0.9 : 0);
    add('xing', count(s, 'observatory') >= 2 || s.star >= 4 ? 0.8 : 0);
    add('lu', count(s, 'medicine') >= 2 || s.flags.fever ? 0.6 : 0);
    add('jingci', count(s, 'temple') >= 3 || s.flags.runaway || (s.seen && s.seen.runaway) ? 0.6 : 0);
    add('yue', count(s, 'dance') >= 3 && !seen(s, 'yue_last') ? 0.7 : 0);
    add('kid', s.age <= 14 ? 0.5 : 0);
    return c;
  }
  const safe = (f) => {
    try {
      return !!f();
    } catch (e) {
      return false;
    }
  };
  Town.pickVisitor = function (s) {
    const band = M.band(s);
    const c = candidates(s).filter(([id]) => (VISITS[id] || []).some((v) => (!v.band || v.band === band) && (!v.when || safe(() => v.when(s)))));
    if (!c.length) return null;
    const total = c.reduce((a, b) => a + b[1], 0);
    let r = Math.random() * total, id = c[0][0];
    for (const [k, w] of c) if ((r -= w) <= 0) { id = k; break; }
    s.visited = s.visited || {};
    // prefer the conversation she has had least often with this person
    const ok = (v) => (!v.band || v.band === band) && (!v.when || safe(() => v.when(s)));
    const opts = VISITS[id].map((v, i) => [v, i]).filter(([v]) => ok(v));
    // something to tell you about her comes first, once; otherwise the least-heard conversation
    opts.sort((a, b) => (s.visited[id + a[1]] || 0) - (s.visited[id + b[1]] || 0) || (b[0].about ? 1 : 0) - (a[0].about ? 1 : 0) || Math.random() - 0.5);
    const [v, i] = opts[0];
    s.visited[id + i] = (s.visited[id + i] || 0) + 1;
    const vars = { aunt: s.parent.role === 'mom' ? 'Auntie' : 'Uncle' };
    const lines = v.lines.map(([who, text]) => [who, M.pick(s, typeof text === 'function' ? text(s) : text, vars)]);
    return { id, lines };
  };

  // Plays a visit on the courtyard stage. Resolves when the visitor has left (or the scene changed under them).
  Town.playVisit = async function (s, visit, ui) {
    const st = ui.stage;
    const npc = G.NPC[visit.id];
    const her = ui.herActor;
    if (!npc || !npc.outfit || !her) return;
    const alive = () => ui.herActor === her && st.get('visitor');
    const fromLeft = her.x > 150;
    const y = Math.max(140, Math.min(164, her.y + 2));
    const a = st.add({ id: 'visitor', kind: 'npc', x: fromLeft ? -12 : 332, y, anim: 'idle', pal: G.Sprites.palette(npc.look, npc.outfit), cfg: G.Sprites.npcCfg(visit.id, npc, s.age), clickable: true, npc: visit.id, speed: 0.55 });
    st.stopWalk(her);
    await st.walkTo(a, her.x + (fromLeft ? -22 : 22), y);
    if (!alive()) return;
    a.anim = 'stand_side';
    a.dir = fromLeft ? 1 : -1;
    her.anim = 'stand_side';
    her.dir = fromLeft ? -1 : 1;
    st.emote(her, visit.id === 'tao' && s.age >= 13 ? 'heart' : 'bang', 1.4);
    for (const [who, text] of visit.lines) {
      if (!alive()) return;
      const actor = who === 'her' ? her : a;
      ui.bubble(actor, text, 3600);
      if (who === 'her' && /!/.test(text)) her.anim = 'cheer';
      G.Audio.blip && G.Audio.blip();
      await G.U.wait(Math.min(4400, 1600 + text.length * 40));
      if (her.anim === 'cheer') her.anim = 'stand_side';
    }
    if (!alive()) return;
    M.need(s, 'friends', ['mei', 'tao', 'wanyin', 'prince', 'kid'].includes(visit.id) ? 3 : 1);
    if (s.friends[visit.id] != null) s.friends[visit.id] = Math.min(100, s.friends[visit.id] + 1);
    await G.U.wait(900);
    if (!alive()) return;
    her.anim = 'idle';
    if (/^(mei|tao|wanyin|kid)$/.test(visit.id) && Math.random() < 0.5) st.emote(her, 'heart', 1.5);
    await st.walkTo(a, fromLeft ? -14 : 334, y);
    st.remove('visitor');
  };
})();
