<script>
/* Silver River — her everyday voice: what she says when you tap her, while she potters about,
   and in the planner. Lines depend on her mood, speaking voice, age, the season, her favourite
   things, friends, pet, dream and what has been happening. Mentioning a favourite teaches it to you. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const D = G.D;
  const M = G.Mind;
  const C = (G.Chatter = {});

  const pickArr = (a) => a[Math.floor(Math.random() * a.length)];
  const season = (s) => D.SEASONS[s.turn % 4];

  const DREAM_SHORT = {
    general: 'lead an army with my own banner', swordswoman: 'wander the rivers and lakes, righting wrongs', scholar: 'come first in the imperial exam',
    astronomer: 'find out where the stars come from', immortal: 'ride a cloud like the immortals', physician: 'heal people who have no one else',
    musician: 'play guqin for a thousand people', dancer: 'dance in the Pear Garden', poet: 'write a poem people still read in a hundred years',
    princess: 'wear a crown. A small one is fine', priestess: 'keep the lamps lit at the Cloud Temple', teacher: 'teach little kids to read',
    chef: 'open a restaurant people travel for days to reach', merchant: 'run a trading house with ships and everything', teahouse: 'have my own teahouse full of travelers',
    farmer: 'grow tea on a whole mountain', weaver: 'weave silk so fine it looks like water',
  };
  const FLOWER_SEASON = { 'peach blossoms': 'spring', orchids: 'spring', peonies: 'spring', lotus: 'summer', chrysanthemums: 'autumn', 'plum blossoms': 'winter' };
  const QUIRK_LINES = {
    'hums when she concentrates': '♪ Hm hm hmm... Oh! Were you listening? How long were you listening?',
    'names every stray cat in town': 'I met a new cat today. I named him General Whiskers the Third.',
    'collects smooth river stones': 'Look! This one is perfectly round. It\'s going in the collection.',
    'talks to the moon before bed': 'I told the moon about my day last night. She agreed with me.',
    'draws tiny stars on everything': 'I drew a tiny star on your teacup. You\'re welcome.',
    'sneaks extra sugar into her tea': 'I did NOT put four sugars in my tea. It was three. Ish.',
    'reads by candlelight long after bedtime': 'I only read ONE more chapter last night. And then one more. And then...',
  };

  // --------------------------------------------------------------- when you tap her
  const MOOD = {
    radiant: {
      sunny: ['Hi hi hi! What are we doing? Can I help?', 'Guess what! No, guess! ...Okay, I forgot what.', 'I\'m in SUCH a good mood today.', 'Race you to the gate! Go!'],
      soft: ['(She smiles and hides it behind her sleeve.)', 'I like days like this. Quiet and warm.', 'I made you a paper crane. It\'s a bit lopsided.'],
      sassy: ['Yes? I\'m very busy being delightful.', 'I\'m in a good mood. Enjoy it while it lasts.', 'You can admire me from over there.'],
      dreamy: ['Do you think clouds get tired of floating?', 'I was talking to the sparrows. They had opinions.', 'If I squint, the roof looks like a sleeping dragon.'],
      earnest: ['I finished all my reading already! Should I do more?', 'I\'ve been practicing. Want to see?', 'I made a plan for the week. It has columns.'],
    },
    happy: {
      _: ['Hm? Oh, hi {P}!', 'Want to hear a secret? ...Never mind!', 'Did you need me, {P}?'],
      sunny: ['{P}! Hi! Hello! Hi!', 'Is it snack time? It feels like snack time.'],
      soft: ['Oh! Hello, {P}.', 'Did you want something? I can help.'],
      sassy: ['If this is about the missing buns, I have an alibi.', 'You again? Fine. I\'m glad. Don\'t tell anyone.'],
      dreamy: ['Sometimes I hear the river singing. Is that strange?', 'I was imagining a city made of lanterns.'],
      earnest: ['Is there anything I can help with, {P}?', 'I tidied the brushes by size. And then by color.'],
    },
    calm: {
      _: ['Mm?', 'Hi, {P}.', 'Just thinking.', 'Hm? Oh, it\'s you.'],
      sassy: ['Can I help you?', 'I\'m thinking. It\'s a whole process.'],
      dreamy: ['Shh. I\'m listening to the wind.', 'I was somewhere far away just now.'],
    },
    low: {
      _: ['...I\'m okay.', '(She leans against you for a moment.)', 'Can you stay here a bit?', 'It\'s nothing. Really.'],
      sassy: ['I\'m fine. Totally fine. Extremely fine.', 'Don\'t look at me like that.'],
      soft: ['(She doesn\'t look up, but she doesn\'t move away either.)'],
      dreamy: ['Everything feels gray today.'],
    },
    upset: {
      _: ['Not now.', 'Hmph.', '(She turns away.)', 'I don\'t want to talk.'],
      sassy: ['Oh, NOW you want to talk.', 'Go away. ...Not that far.'],
      soft: ['(Her eyes are red. She pretends they aren\'t.)'],
    },
  };
  const BAND = {
    kid: ['{P}! {P}! Look, a beetle!', 'Can I have a snack? A small one? A medium one?', 'Carry me? Just to the door?', 'I can almost reach the top shelf now. Almost.'],
    teen: ['Can I go to Mei\'s later?', 'I\'m not a little kid anymore, you know.', 'Please don\'t hover.', 'You wouldn\'t understand. ...Okay, maybe you would.'],
    young: ['Sit with me a minute?', 'You look tired. Let me make the tea tonight.', 'Do you ever miss when I was small? Be honest.'],
  };
  const SEASON_LINES = {
    spring: ['The swallows are back! They\'re building a nest over the gate!', 'Spring smells like wet earth and peach blossoms.', 'Can we fly a kite this spring? A dragon one?'],
    summer: ['It\'s too hot to exist. Can we have cold mung bean soup?', 'The cicadas are so loud I can\'t hear myself think.', 'I\'m going to lie on the cool stones until autumn.'],
    autumn: ['The osmanthus smells like honey. I want to bottle it.', 'Mooncakes soon. Just saying. Loudly.', 'The persimmons are almost ripe. I\'m keeping an eye on them.'],
    winter: ['My hands are frozen. Feel. FEEL.', 'Can we roast chestnuts tonight? Please please please?', 'I made a snow rabbit. It\'s melting. It\'s tragic.'],
  };

  // candidates: [weight, text, learn?]
  function tapCandidates(s) {
    const out = [];
    const m = M.mood(s).label;
    const add = (w, text, learn) => text && out.push([w, text, learn]);
    add(5, M.pick(s, MOOD[m] || MOOD.calm));
    if (m === 'upset' || (m === 'low' && Math.random() < 0.6)) return out;
    add(1.4, pickArr(BAND[M.band(s)]));
    add(1.2, pickArr(SEASON_LINES[season(s)]));
    if (s.stress >= 65) add(3, pickArr(['So... tired...', '(She yawns so hard her little ahoge wobbles.)', 'Can I just sleep until next year?']));
    const f = s.fav;
    if (f) {
      add(0.9, 'Can we have ' + f.food + ' tonight? Pretty please?', { key: 'food', text: 'Favorite food: ' + f.food });
      if (FLOWER_SEASON[f.flower] === season(s)) add(1.6, 'The ' + f.flower + ' are out! Those are my favorite, you know.', { key: 'flower', text: 'Favorite flower: ' + f.flower });
      add(0.5, 'If I could be any animal, I\'d be one of the ' + f.animal + '. Obviously.', { key: 'animal', text: 'Favorite animal: ' + f.animal });
      add(0.4, 'When I\'m grown up, everything I own will be ' + f.color + '.', { key: 'color', text: 'Favorite color: ' + f.color });
      if (QUIRK_LINES[f.quirk]) add(0.8, QUIRK_LINES[f.quirk], { key: 'quirk', text: 'She ' + f.quirk + '.' });
    }
    if (s.flags.pet) add(1.2, pickArr([s.flags.pet + ' stole my hair ribbon again. I\'m filing a complaint.', s.flags.pet + ' likes you best. Don\'t tell me. I know.', 'Have you seen ' + s.flags.pet + '? On the roof one minute, gone the next.']));
    if (s.friends.mei >= 40) add(0.9, pickArr(['Mei says hi! Well, she said "tell your ' + M.addr(s) + ' hi." Same thing.', 'Mei and I are making a secret language. You can\'t learn it. Sorry.']));
    if ((s.flags.tao_crush || s.flags.tao_love) && s.age >= 13) add(0.9, pickArr(['Tao? Who\'s Tao? Never heard of him. Why are you smiling?', 'Tao gave me an extra bun today. It doesn\'t MEAN anything.']));
    if (s.flags.wanyin_friend) add(0.5, 'Wanyin and I are going to the lake later. Don\'t tell her father. Or do. She\'d like that, actually.');
    if (s.dream && DREAM_SHORT[s.dream]) add(1, M.pick(s, { _: 'One day I\'m going to ' + DREAM_SHORT[s.dream] + '. You\'ll see.', soft: 'Do you really think I could ' + DREAM_SHORT[s.dream] + ' someday?', sassy: 'Future me is going to ' + DREAM_SHORT[s.dream] + '. Future me is very impressive.' }));
    if (s.star >= 5) add(0.8, pickArr(['Sometimes at night the stars feel... closer. Is that weird?', 'I dreamt about the river again. It was calling my name.']));
    if (s.flags.fight && !s.flags.fight_resolved) add(3, '(She pretends she doesn\'t see you.)');
    return out;
  }
  let lastTap = '';
  C.tap = function (s) {
    let cands = tapCandidates(s).filter((c) => c[1] !== lastTap);
    if (!cands.length) cands = tapCandidates(s);
    const tot = cands.reduce((a, c) => a + c[0], 0);
    let r = Math.random() * tot, pick = cands[0];
    for (const c of cands) if ((r -= c[0]) <= 0) { pick = c; break; }
    lastTap = pick[1];
    return { text: M.fill(s, pick[1]), learn: pick[2] || null };
  };

  // --------------------------------------------------------------- while she potters about
  const IDLE = {
    sword: { _: ['Hyah! Hyah!', 'One more form...', 'Left foot... right foot... spin!'], sassy: ['Master Gao would say my elbow is lazy. My elbow is FINE.'], earnest: ['Again. Slower this time. Again.'] },
    read: { _: ['Hmm, hmm...', '"The superior person..." wait, what?'], dreamy: ['This poem is about the moon. They\'re all about the moon.'], earnest: ['I\'m going to memorize this whole page. Watch.'] },
    guqin: { _: ['♪ ~', '♪ ♪'], soft: ['(A soft, careful melody drifts across the yard.)'] },
    cook: { _: ['Smells good!', 'Just a pinch more salt...'], sassy: ['If it burns, it\'s called "smoky." That\'s a flavor.'] },
    dance: { _: ['♪ Turn, turn, step ~', 'La la la ~'], dreamy: ['(She dances with her shadow.)'] },
    stars: { _: ['I think I see my star.'], dreamy: ['Hello up there. It\'s me. Still down here.'] },
    pray: { _: ['...'] },
    sleep: { _: ['Zzz...', 'Zzz... five more minutes... zzz...'] },
    sit: { _: ['What a nice day.', 'Mm. Warm stones.'] },
    cry: { _: ['(sniff)'] },
    kite: { _: ['Higher! Higher!', 'Don\'t you dare get stuck in the tree again!'] },
    cheer: { _: ['Hehe!', 'Yes!'] },
    love: { _: ['♥'] },
  };
  C.idle = function (s, what) {
    const P = M.addr(s);
    // what's on her mind: something that happened recently
    const recent = s.memories.filter((m) => m.turn >= s.turn - 2 && m.weight >= 5 && m.text && !/^[A-Z]/.test(m.text));
    if (recent.length && Math.random() < 0.18) {
      const m = pickArr(recent);
      return m.val < 0 ? M.pick(s, { _: '...I\'m still thinking about ' + m.text + '.', sassy: 'Not that I\'m still mad about ' + m.text + '. I\'m not. Totally not.' }) : M.pick(s, { _: 'Hehe... ' + m.text + '...', soft: '(She smiles to herself, thinking about ' + m.text + '.)', dreamy: 'I keep replaying ' + m.text + ' in my head.' });
    }
    if (s.flags.pet && Math.random() < 0.15) return s.flags.pet + ', come back here!';
    if (s.stress > 75 && Math.random() < 0.3) return 'So tired... ' + P + '...';
    if (what === 'sit' && M.mood(s).label === 'low') return '...';
    const bank = IDLE[what];
    return bank ? M.pick(s, bank) : null;
  };

  // --------------------------------------------------------------- the planner, when she has no wish
  // chosen once per season so it doesn't change every time the planner redraws
  C.planner = function (s) {
    if (s.chatter && s.chatter.turn === s.turn) return s.chatter.text;
    const sea = season(s);
    const opts = [
      [3, M.pick(s, { _: ['I\'m happy with whatever you plan, {P}!'], sunny: ['I\'m happy with whatever you plan, {P}!', 'Ooh, what are we doing? Something fun? Say something fun.'], sassy: ['Surprise me. But not with etiquette.', 'Plan whatever you like. If it\'s etiquette again, I\'m moving to the temple.'], soft: ['Whatever you think is best...', 'I\'ll do my best, whatever it is.'], dreamy: ['I wonder what this season will bring.', 'I dreamt about a white crane last night. That\'s a good sign, right?'], earnest: ['I\'m ready to work hard this season.', 'I wrote down three things I want to get better at. It\'s a long list of three things.'] })],
      [1.5, { spring: 'It\'s spring! Everything\'s starting over. Let\'s start something new too.', summer: 'Whatever we do this summer, can there please be shade?', autumn: 'Scholar Wen says autumn is for studying. I say autumn is for persimmons.', winter: 'Can we do something warm this season? My toes are icicles.' }[sea]],
    ];
    if (M.band(s) === 'young') opts.push([1.5, s.turns - s.turn <= 4 ? 'Only a few seasons until Qixi. Let\'s make them count, okay?' : 'I can plan my own months now, you know. But I like it when we plan together.']);
    if (M.band(s) === 'teen') opts.push([1, 'Can I have a little say this time? Just a little.']);
    if (s.dream && DREAM_SHORT[s.dream]) opts.push([1, 'Anything that helps me ' + DREAM_SHORT[s.dream].split('.')[0] + ' someday. Please?']);
    if (s.bond >= 75) opts.push([1, 'As long as we have dinner together, I don\'t mind what we do.']);
    if (s.bond < 30) opts.push([2, 'Do what you want. You always do.']);
    const tot = opts.reduce((a, c) => a + c[0], 0);
    let r = Math.random() * tot, text = opts[0][1];
    for (const [w, t] of opts) if ((r -= w) <= 0) { text = t; break; }
    text = M.fill(s, text);
    s.chatter = { turn: s.turn, text };
    return text;
  };
})();

</script>
<script>
/* Silver River — conversations, outings, festivals, birthdays, journeys, protests and the finale. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const M = G.Mind;
  const T = (G.Talk = {});
  const season = (s) => D.SEASONS[s.turn % 4];

  // ---------------------------------------------------------------- talk topics
  T.topics = function (s) {
    const list = [
      { id: 'how', label: 'How are you feeling?' },
      { id: 'lessons', label: 'How are your lessons going?' },
      { id: 'dream', label: 'What do you dream of becoming?' },
      { id: 'praise', label: 'Tell her you\'re proud of her' },
      { id: 'favorite', label: 'Ask about her favorite things' },
      { id: 'friends', label: 'Ask about her friends' },
      { id: 'past', label: 'Tell her about your past' },
      { id: 'sit', label: 'Just sit together quietly' },
    ];
    if (G.LLM && G.LLM.ready()) list.unshift({ id: 'heart', label: 'Heart-to-heart (say anything)', special: true });
    return list;
  };

  T.run = async function (id, g) {
    const s = g.s;
    s.talkCount = (s.talkCount || 0) + 1;
    await g.scene('home', { tod: 'dusk' });
    if (id === 'heart') return G.LLM.converse(g);
    if (id === 'how') return how(g);
    if (id === 'lessons') return lessons(g);
    if (id === 'dream') return dream(g);
    if (id === 'praise') return praise(g);
    if (id === 'favorite') return favorite(g);
    if (id === 'friends') return friends(g);
    if (id === 'past') return past(g);
    if (id === 'sit') return sit(g);
  };

  async function how(g) {
    const s = g.s;
    const m = M.mood(s);
    const worst = Object.keys(s.needs).sort((a, b) => s.needs[a] - s.needs[b])[0];
    const low = s.needs[worst] < 35;
    if (s.stress >= 70) {
      await g.her('tired', { _: 'Honestly? I\'m exhausted. My head feels full of sand.', sassy: 'I\'m a husk. A very tired husk.', soft: 'I\'m okay... just really, really tired.' });
    } else if (m.label === 'radiant' || m.label === 'happy') {
      await g.her('happy', { _: 'I\'m good! Really good, actually.', sunny: 'Great! Amazing! Ask me again tomorrow, I\'ll probably still be great!', sassy: 'Suspiciously good. Don\'t jinx it.', dreamy: 'Like a lantern floating on the river.' });
    } else if (low) {
      const lines = {
        fun: { _: 'I\'m bored. Everything is lessons. I can\'t remember the last time I just played.' },
        love: { _: 'I don\'t know... I kind of miss you. Even though you\'re right here. Is that weird?', sassy: 'I don\'t know. We never just talk anymore.' },
        freedom: { _: 'I feel like everyone decides everything for me. Like I\'m a kite and someone else holds the string.' },
        pride: { _: 'I\'m not good at anything. Everyone else is better than me at everything.' },
        friends: { _: 'I\'m lonely, I guess. I haven\'t seen Mei in ages.' },
      };
      await g.her(worst === 'pride' || worst === 'love' ? 'sad' : 'pout', lines[worst]);
      const c = await g.choose(['Hug her.', 'Promise to change something.', 'Make a joke to cheer her up.']);
      if (c === 0) { g.need('love', 18); g.bond(4); g.parent(4, 0); await g.her('teary', '...Thanks, ' + g.P + '.'); }
      if (c === 1) {
        const fix = { fun: 'more free time', love: 'more time together', freedom: 'more say in her plans', pride: 'to notice what she does well', friends: 'more time with Mei' }[worst];
        g.promise({ id: 'fix_' + worst + '_' + s.turn, text: fix, due: s.turn + 2, need: worst, level: s.needs[worst] + 20 });
        g.trust(3);
        await g.her('thinking', 'You promise? ...Okay. I\'ll hold you to it.');
      }
      if (c === 2) { if (s.traits.playful > -10) { g.need('fun', 10); g.bond(2); await g.her('laugh', 'That was so bad. ...Tell it again.'); } else { await g.her('neutral', '...Ha. Ha.'); } }
    } else {
      await g.her('neutral', { _: 'I\'m okay. Just normal okay.', dreamy: 'Like a cloud. Not happy, not sad. Just floating.' });
    }
    g.need('love', 5);
    if (!s.known.traits.fiery && s.talkCount >= 2) g.learn('trait', 'fiery', s.traits.fiery > 0 ? 'She has a fiery temper, and a quick one.' : 'She is gentle, even when she\'s upset.');
  }

  async function lessons(g) {
    const s = g.s;
    const tried = Object.keys(s.tried).filter((id) => !['rest', 'free'].includes(id));
    if (!tried.length) return g.her('thinking', 'I haven\'t really started anything yet!');
    const best = tried.sort((a, b) => s.aff[b] - s.aff[a])[0];
    const worst = tried[tried.length - 1];
    await g.her('happy', { _: 'My favorite is ' + D.ACT[best].name + '. I could do it every day.', sassy: D.ACT[best].name + ' is the only one worth anything.', earnest: 'I enjoy ' + D.ACT[best].name + ' the most. I feel like I\'m growing.' });
    g.learn('like', best);
    if (worst !== best && s.aff[worst] < -0.4) {
      await g.her('pout', { _: 'And ' + D.ACT[worst].name + '... I really don\'t like it.', sassy: D.ACT[worst].name + ' should be illegal.' });
      g.learn('like', worst);
    }
    if (!s.known.traits.diligent) g.learn('trait', 'diligent', s.traits.diligent > 0 ? 'She works hard even when nobody is watching.' : 'She\'s a free spirit. Routines make her restless.');
  }

  async function dream(g) {
    const s = g.s;
    if (!s.dream) {
      await g.her('thinking', { _: 'I don\'t know yet. Is that bad?', dreamy: 'I dream about a lot of things. Mostly flying.', sassy: 'Ask me when I\'m older.' });
      const c = await g.choose(['"Not at all. Take your time."', '"You should start thinking about it."']);
      if (c === 0) { g.trust(2); g.esteem(1); }
      else g.parent(0, 2);
      return;
    }
    await g.her('determined', D.DREAMS[s.dream].say);
    const c = await g.choose(['"You\'ll get there. I know it."', '"Tell me what you need to get there."']);
    if (c === 0) { g.esteem(3); g.bond(1); }
    else { g.trust(3); const act = Object.keys(D.ACT_DREAM).find((k) => D.ACT_DREAM[k] === s.dream && G.Sim.canDo(s, D.ACT[k]).ok); if (act) await g.her('happy', 'More ' + D.ACT[act].name + '. Lots more!'); }
    g.learn('fact', 'dream', 'Her dream: ' + D.DREAMS[s.dream].say);
  }

  async function praise(g) {
    const s = g.s;
    const recent = (s.log[s.log.length - 1] || { months: [] }).months;
    const great = recent.some((m) => m.outcome === 'great');
    const n = (s.praised || 0);
    s.praised = n + 1;
    if (s.lastPraise === s.turn - 1 && !great) {
      await g.her('thinking', { _: 'You said that last time too. Did something happen?', sassy: 'Okay, who replaced my parent?' });
      g.need('love', 3);
    } else if (s.esteem < 35) {
      await g.her('teary', { _: 'Really? Even though I\'m not good at anything?', sassy: '...You don\'t have to say that. (Her voice cracks.)' });
      const c = await g.choose(['"Especially then."', '"You\'re better than you think."']);
      g.esteem(c === 0 ? 8 : 6); g.bond(4); g.need('love', 12);
      if (c === 0) g.remember({ id: 'praise_low', text: 'when you said you were proud of me especially then', letter: 'When I felt useless, you told me you were proud of me "especially then". I didn\'t understand it at the time. I say it to my own students now.', weight: 7, val: 1, tags: ['parent', 'esteem'] });
    } else {
      await g.her(great ? 'joy' : 'shy', { _: great ? 'Hehe. I was pretty great, wasn\'t I?' : 'Oh! Um. Thank you...', sassy: 'I know. But thank you for noticing.' });
      g.esteem(great ? 4 : 2); g.bond(2); g.need('love', 8); g.need('pride', 6);
    }
    s.lastPraise = s.turn;
    g.parent(3, 0);
  }

  async function favorite(g) {
    const s = g.s;
    const unknown = ['food', 'color', 'animal', 'flower', 'quirk'].filter((k) => !s.known.fav[k]);
    if (!unknown.length) return g.her('laugh', { _: 'You already know everything about me! You\'re like a spy.', sassy: 'Are you making a file on me? Because it sounds like you have one.' });
    const k = unknown[0];
    const lines = {
      food: 'My favorite food? ' + U.cap(s.fav.food) + '. Obviously. Is there anything better in the whole world?',
      color: 'Hmm... ' + s.fav.color + '. It makes me feel calm.',
      animal: U.cap(s.fav.animal) + '! If I could have one I would name it after you.',
      flower: s.fav.flower === 'peach blossoms' ? 'Peach blossoms. Like our tree. Like the night I came.' : U.cap(s.fav.flower) + '. They smell like summer mornings.',
      quirk: 'Favorite thing? Hmm. I don\'t know. (You\'ve noticed, though: she ' + s.fav.quirk + '.)',
    };
    await g.her(k === 'quirk' ? 'thinking' : 'happy', lines[k]);
    g.learn('fav', k, { food: 'Favorite food: ' + s.fav.food, color: 'Favorite color: ' + s.fav.color, animal: 'Favorite animal: ' + s.fav.animal, flower: 'Favorite flower: ' + s.fav.flower, quirk: 'She ' + s.fav.quirk + '.' }[k]);
    g.bond(1);
    if (!s.known.traits.dreamy) g.learn('trait', 'dreamy', s.traits.dreamy > 0 ? 'She lives half in daydreams.' : 'She\'s practical to the bone.');
  }

  async function friends(g) {
    const s = g.s;
    const f = s.friends;
    if (f.mei >= 30) await g.her('happy', 'Mei is teaching me to make paper lanterns. Mine look like potatoes. Hers look like actual lanterns.');
    else await g.her('neutral', 'Mei\'s nice. I don\'t see her much.');
    if (f.tao >= 30 && s.age >= 13) await g.her('shy', 'Tao... is fine. Why are you asking about Tao? I didn\'t say anything about Tao.');
    if (s.flags.wanyin_friend) await g.her('smug', 'Wanyin and I are having a competition to see who can be nicer. I\'m winning.');
    else if (f.wanyin > 0) await g.her('pout', 'Lady Wanyin looked at my shoes today. Like THAT.');
    if (s.flags.prince_met && !s.flags.banquet) await g.her('shy', 'And there\'s a scholar I met at the Lantern Festival. Jing. He\'s terrible at riddles.');
    g.need('friends', 5);
    if (!s.known.traits.bold) g.learn('trait', 'bold', s.traits.bold > 0 ? 'She makes friends everywhere she goes.' : 'She\'s shy with new people and takes time to open up.');
  }

  const PAST = {

      if (g.check('vigor', 38)) { g.stat('vigor', 2); g.esteem(5); await g.nar('She wades in to her waist, grabs the rope and hauls the skiff to shore. The boatman gives her a carved river stone for luck.'); return 'I saved a boatman in the storm!'; }
      await g.nar('She runs for help instead, and the villagers pull the boat in together. The boatman thanks her anyway.');
      g.stat('heart', 2);

    if (pick === 'pass') {

      if (pick.act) s.aff[pick.act] = U.clamp((s.aff[pick.act] || 0) + 0.15, -2, 2);
    }
    g.remember({ id: 'bday_' + newAge, title: 'Qixi, age ' + newAge, caption: 'Her ' + newAge + 'th Qixi.', text: 'my ' + newAge + 'th birthday', weight: 2, val: 1, tags: ['birthday'], photo: { scene: 'home', tod: 'night', anim: 'cheer', expr: 'joy', age: newAge } });
  };

  // ---------------------------------------------------------------- the finale on her eighteenth Qixi
  T.finale = async function (g) {
    const s = g.s;
    await g.scene('night', {});
    await g.nar('Her eighteenth Qixi. The whole town is out on the rooftops tonight, and the sky is so full of stars it almost hums.');
    // the friends she made come to see her
    const came = [];
    if (s.friends.mei >= 35) came.push('mei');
    if (s.flags.tao_love || s.flags.tao_crush || s.friends.tao >= 40) came.push('tao');
    if ((s.flags.wanyin_friend || s.friends.wanyin >= 40) && came.length < 2) came.push('wanyin');
    const SPOT = ['left', 'far'];
    came.forEach((id, i) => g.npc(id, SPOT[i]));
    const HELLO = {
      mei: 'We came to watch the magpies. And you. Mostly you. Okay, only you.',
      tao: 'I-I brought mooncakes. Is that... is that right, for a night like this? I didn\'t know what you bring.',
      wanyin: 'I am only here because your courtyard has the best view. Obviously.',
    };
    if (came.length) {
      await g.nar(came.length === 1 ? `${G.NPC[came[0]].name} is there, of course.` : `${G.NPC[came[0]].name} is there, of course, and ${G.NPC[came[1]].name}, pretending to just be passing by.`);
      await g.say(came[0], HELLO[came[0]]);
    }
    // she remembers
    const good = s.memories.filter((m) => m.val > 0 && m.text && m.id !== 'arrival').sort((a, b) => b.weight - a.weight || b.turn - a.turn);
    const hurt = s.memories.filter((m) => m.val < 0 && m.weight >= 6 && m.text).sort((a, b) => b.weight - a.weight)[0];
    const phrase = (m) => m.text.replace(/\.$/, '');
    g.anim('sit');
    await g.her('calm', { _: 'I keep thinking about everything today.', sassy: 'Okay. I\'m going to be sentimental for exactly one minute. Don\'t make it weird.', dreamy: 'Everything today felt like it was happening twice. Once now, and once in memory.' });
    if (good[0]) await g.her('happy', /^[A-Z]/.test(good[0].text) ? phrase(good[0]) + '.' : 'Do you remember ' + phrase(good[0]) + '?');
    if (good[1]) await g.her('joy', /^[A-Z]/.test(good[1].text) ? phrase(good[1]) + '.' : 'And ' + phrase(good[1]) + '.');
    if (good[2]) await g.her('teary', /^[A-Z]/.test(good[2].text) ? phrase(good[2]) + '. I remember all of it.' : 'And ' + phrase(good[2]) + '. I remember all of it.');
    if (hurt && s.bond < 55) await g.her('sad', 'I remember ' + phrase(hurt) + ', too.');
    g.anim('idle');
    // the magpies come
    g.fx('bridge', 'build');
    await g.nar('And then the magpies come: thousands of them, wing to wing, building a bridge across the Silver River.');
    await g.nar('A second bridge follows, curving down, down, until it touches the stones of your courtyard.');
    await g.say('voice', 'Little thread. It is time. The river remembers you. Will you come home?');
    if (came.includes('mei')) {
      g.npcEmote('mei', 'bang');
      await g.say('mei', s.name + '... you\'re not going to go. Are you?');
    }
    await g.her('worried', g.P + '...');
    const bondWord = s.bond >= 70 ? 'love' : s.bond >= 40 ? 'teary' : 'sad';
    await g.her(bondWord, {
      _: s.bond >= 70 ? 'I don\'t know what to do. Part of me is up there. But all of me is here.' : 'I always wondered what I\'d feel when this happened.',
      sassy: s.bond >= 70 ? 'Great timing, stars. Really great. I finally have my life figured out.' : 'So this is it. The big cosmic question.',
    });
    const c = await g.choose(['"Stay with me."', '"It\'s your choice. Whatever you choose, I love you."', '"Go. Be happy, wherever that is."']);
    const choice = ['stay', 'free', 'go'][c];
    if (s.flags.star_answer && s.flags.star_answer !== choice) {
      await g.her('thinking', s.flags.star_answer === 'free' ? 'You once told me it would be my choice.' : 'That\'s not what you said before.');
    }
    const res = G.Endings.decide(s, choice);
    s.finale = { choice, stays: res.stays, bridge: res.bridge };
    if (res.stays) {
      await g.nar('She looks up at the bridge for a long moment. Then she takes your hand.');
      await g.her('teary', {
        _: 'Tell the river thank you. But I already have a home.',
        sassy: 'Thanks, but no thanks. I have a whole life down here. And a parent who can\'t cook without me.',
        dreamy: 'The river will still be there. It\'s just the sky. I can visit it every night.',
      });
      g.fx('bridge', 'dissolve');
      await g.nar('The magpie bridge shimmers, and slowly, gently, comes apart into falling stars.');
      if (came.length) {
        g.anim('cheer');
        came.forEach((id) => g.npcEmote(id, 'heart'));
        await g.say(came[0], { mei: 'She\'s staying! She\'s STAYING! Everybody, she\'s staying!', tao: 'You\'re staying! I mean. Good. That\'s good. I have to go tell my father. And everyone.', wanyin: 'Well. Obviously. Where else would you find a rival worth having?' }[came[0]]);
      }
      await g.her('joy', { _: 'Come on, ' + g.P + '. Let\'s go home.', sassy: 'Right. Now can we please eat? Cosmic decisions make me starving.' });
    } else {
      await g.nar('She holds you for a long time.');
      const BYE = {
        mei: 'Write to me. I don\'t care how. Tie letters to the magpies. Promise!',
        tao: 'I\'ll... I\'ll save you the first batch. Every year. Just in case.',
        wanyin: 'Don\'t you dare become the brightest star up there without me watching.',
      };
      for (const id of came) {
        g.npcEmote(id, 'drop');
        await g.say(id, BYE[id]);
      }
      await g.her('cry', res.bridge ? 'I\'ll come back, ' + g.P + '. Every Qixi. Like the Weaver Girl. Wait for me.' : 'Thank you for everything. Look up sometimes.');
      await g.fx('ascend');
      g.fx('newStar', [160, 18]);
      await g.wait(900);
      await g.nar('The bridge carries her up into the Silver River, and one new star begins to shine.');
      g.fx('bridge', 'dissolve');
      await g.nar(res.bridge ? 'The magpies scatter into the night, calling to each other. They will be back next year. So will she.' : 'The magpies scatter into the night. The courtyard is very quiet.');
    }
  };
})();

</script>
<script>
/* Silver River — festival mini-games: lantern riddles, guqin recital, rival duel, dragon boat race.
   Each returns a promise of { win, score, skipped }. They draw into an overlay element. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const MG = (G.Minigames = {});

  const RIDDLES = [
    { q: 'The more you take, the more you leave behind.', a: 'Footsteps', w: ['Coins', 'Rice'] },
    { q: 'It sleeps in winter, wears pink in spring, and falls like snow without being cold.', a: 'Peach blossoms', w: ['Plum wine', 'Lanterns'] },
    { q: 'Round as the moon, sweet as honey, shared when families gather in autumn.', a: 'A mooncake', w: ['A drum', 'A coin'] },
    { q: 'I have a waist but no legs, a mouth but no teeth, and immortals carry me on their belts.', a: 'A gourd', w: ['A kettle', 'A sword'] },
    { q: 'Black when you buy it, red when you use it, grey when you throw it away.', a: 'Charcoal', w: ['Ink', 'Tea'] },
    { q: 'I have teeth but never bite. I tame tangles every night.', a: 'A comb', w: ['A saw', 'A dragon'] },
    { q: 'Dressed in white, I wait for the brush. Write one wrong word and I will never forget.', a: 'Paper', w: ['Snow', 'Rice'] },
    { q: 'The more of me there is, the less you see.', a: 'Darkness', w: ['Fog', 'Silk'] },
    { q: 'What goes up when the rain comes down?', a: 'An umbrella', w: ['A kite', 'A bridge'] },
    { q: 'I fly without wings and cry without eyes. Wherever I go, darkness follows me.', a: 'A cloud', w: ['A crow', 'A lantern'] },
    { q: 'A bridge of birds, one night a year, lets two lovers meet. What night is it?', a: 'Qixi', w: ['New Year', 'Qingming'] },
    { q: 'Always in front of you, never where you can see it.', a: 'The future', w: ['Your nose', 'The wind'] },
    { q: 'I have a thousand needles but cannot sew.', a: 'A pine tree', w: ['A hedgehog', 'A tailor'] },
    { q: 'I speak every language but I have no mouth. You hear me only after you call.', a: 'An echo', w: ['A parrot', 'A bell'] },
  ];

  function frame(root, title, sub) {
    root.innerHTML = `<div class="mg"><div class="mg-head"><h3>${U.esc(title)}</h3><p>${U.esc(sub || '')}</p></div><div class="mg-body"></div><div class="mg-foot"><button class="btn btn-ghost mg-skip" type="button">Skip</button></div></div>`;
    root.hidden = false;
    return root.querySelector('.mg-body');
  }
  function done(root, res, resolve) {
    setTimeout(() => {
      root.hidden = true;
      root.innerHTML = '';
      resolve(res);
    }, res.skipped ? 0 : 900);
  }

  // ---------------------------------------------------------------- lantern riddles
  MG.riddles = function (root, opts = {}) {
    return new Promise((resolve) => {
      const body = frame(root, 'Lantern Riddles', 'Pick the answer. Three lanterns, three riddles.');
      const list = U.shuffle(RIDDLES).slice(0, opts.n || 3);
      let i = 0, score = 0;
      root.querySelector('.mg-skip').onclick = () => done(root, { skipped: true }, resolve);
      const show = () => {
        if (i >= list.length) {
          body.innerHTML = `<p class="mg-result">${score} of ${list.length} solved!</p>`;
          G.Audio && G.Audio.sfx(score >= 2 ? 'confirm' : 'tap');
          return done(root, { win: score >= 2, score }, resolve);
        }
        const r = list[i];
        const answers = U.shuffle([r.a].concat(r.w));
        body.innerHTML = `<div class="riddle"><div class="lantern-ico" aria-hidden="true"></div><p class="riddle-q">“${U.esc(r.q)}”</p><div class="riddle-a">${answers.map((a) => `<button class="btn" type="button" data-a="${U.esc(a)}">${U.esc(a)}</button>`).join('')}</div></div>`;
        body.querySelectorAll('[data-a]').forEach((b) =>
          b.addEventListener('click', () => {
            const ok = b.dataset.a === r.a;
            if (ok) score++;
            b.classList.add(ok ? 'right' : 'wrong');
            G.Audio && G.Audio.sfx(ok ? 'up' : 'down');
            body.querySelectorAll('[data-a]').forEach((x) => (x.disabled = true));
            if (!ok) body.querySelector(`[data-a="${CSS.escape(r.a)}"]`).classList.add('right');
            i++;
            setTimeout(show, 900);
          })
        );
      };
      show();
    });
  };

  // ---------------------------------------------------------------- guqin recital (memory)
  const NOTES = [
    { zh: '宮', en: 'gong', midi: 62 },
    { zh: '商', en: 'shang', midi: 64 },
    { zh: '角', en: 'jue', midi: 66 },
    { zh: '徵', en: 'zhi', midi: 69 },
    { zh: '羽', en: 'yu', midi: 71 },
  ];
  MG.recital = function (root, opts = {}) {
    return new Promise((resolve) => {
      const target = U.clamp(opts.level || 4, 3, 7);
      const body = frame(root, 'Guqin Recital', `Listen, then play the melody back. Reach ${target} notes to win.`);
      root.querySelector('.mg-skip').onclick = () => done(root, { skipped: true }, resolve);
      body.innerHTML = `<div class="qin"><p class="qin-msg">Listen...</p><div class="qin-strings">${NOTES.map((n, i) => `<button class="qin-str" type="button" data-i="${i}" aria-label="${n.en}"><span>${n.zh}</span><small>${n.en}</small></button>`).join('')}</div></div>`;
      const btns = [...body.querySelectorAll('.qin-str')];
      const msg = body.querySelector('.qin-msg');
      const seq = [U.randInt(0, 4), U.randInt(0, 4)];
      let pos = 0, listening = false;
      const play = (i) => {
        btns[i].classList.add('on');
        G.Audio && G.Audio.note && G.Audio.note(NOTES[i].midi);
        setTimeout(() => btns[i].classList.remove('on'), 320);
      };
      const round = () => {
        listening = false;
        msg.textContent = 'Listen...';
        seq.forEach((n, k) => setTimeout(() => play(n), 500 + k * 520));
        setTimeout(() => {
          listening = true;
          pos = 0;
          msg.textContent = `Your turn (${seq.length} notes)`;
        }, 500 + seq.length * 520);
      };
      btns.forEach((b) =>
        b.addEventListener('click', () => {
          if (!listening) return;
          const i = +b.dataset.i;
          play(i);
          if (i !== seq[pos]) {
            listening = false;
            msg.textContent = `A wrong note! You reached ${seq.length - 1}.`;
            return done(root, { win: seq.length - 1 >= target, score: seq.length - 1 }, resolve);
          }
          pos++;
          if (pos === seq.length) {
            listening = false;
            if (seq.length >= target) {
              msg.textContent = 'Beautiful! The audience is on its feet.';
              G.Audio && G.Audio.sfx('confirm');
              return done(root, { win: true, score: seq.length }, resolve);
            }
            seq.push(U.randInt(0, 4));
            msg.textContent = 'Lovely! One more note...';
            setTimeout(round, 700);
          }
        })
      );
      round();
    });
  };

  // ---------------------------------------------------------------- the duel (strike / guard / feint)
  MG.duel = function (root, opts = {}) {
    return new Promise((resolve) => {
      const skill = opts.skill || 40;
      const body = frame(root, 'The Duel', 'Strike beats Feint. Feint beats Guard. Guard beats Strike. Best of three.');
      root.querySelector('.mg-skip').onclick = () => done(root, { skipped: true }, resolve);
      const MOVES = ['Strike', 'Guard', 'Feint'];
      const beats = { Strike: 'Feint', Feint: 'Guard', Guard: 'Strike' };
      const tells = { Strike: 'shifts her weight onto her front foot', Guard: 'draws her sword close to her body', Feint: 'glances at your left shoulder' };
      let me = 0, her = 0, round = 1;
      const draw = () => {
        const next = U.pick(MOVES);
        const honest = U.rand() < U.clamp(0.45 + skill / 180, 0.45, 0.9);
        const shown = honest ? next : U.pick(MOVES.filter((m) => m !== next));
        body.innerHTML = `<div class="duel"><p class="duel-score">Round ${round} · You ${me} – ${her} Wanyin</p><p class="duel-tell">Wanyin ${tells[shown]}...</p><div class="duel-moves">${MOVES.map((m) => `<button class="btn" type="button" data-m="${m}">${m}</button>`).join('')}</div><p class="duel-out" aria-live="polite"></p></div>`;
        body.querySelectorAll('[data-m]').forEach((b) =>
          b.addEventListener('click', () => {
            const mine = b.dataset.m;
            body.querySelectorAll('[data-m]').forEach((x) => (x.disabled = true));
            let out;
            if (mine === next) out = 'You both ' + mine.toLowerCase() + '. A draw!';
            else if (beats[mine] === next) { me++; out = 'Your ' + mine.toLowerCase() + ' beats her ' + next.toLowerCase() + '!'; G.Audio && G.Audio.sfx('up'); }
            else { her++; out = 'Her ' + next.toLowerCase() + ' beats your ' + mine.toLowerCase() + '.'; G.Audio && G.Audio.sfx('down'); }
            body.querySelector('.duel-out').textContent = out;
            round++;
            setTimeout(() => {
              if (me >= 2 || her >= 2 || round > 5) {
                body.innerHTML = `<p class="mg-result">${me > her ? 'Victory!' : me === her ? 'A draw. The judges favour Wanyin.' : 'Defeat.'}</p>`;
                return done(root, { win: me > her, score: me }, resolve);
              }
              draw();
            }, 1000);
          })
        );
      };
      draw();
    });
  };

  // ---------------------------------------------------------------- dragon boat (timing)
  MG.boat = function (root, opts = {}) {
    return new Promise((resolve) => {
      const zone = U.clamp(0.14 + (opts.vigor || 30) / 500, 0.14, 0.3);
      const body = frame(root, 'Dragon Boat Race', 'Tap "Row!" when the drum marker is in the gold zone. Ten strokes.');
      root.querySelector('.mg-skip').onclick = () => {
        stop = true;
        done(root, { skipped: true }, resolve);
      };
      body.innerHTML = `<div class="boat"><div class="boat-track"><div class="boat-zone" style="left:${50 - zone * 50}%;width:${zone * 100}%"></div><div class="boat-mark"></div></div><p class="boat-count">Strokes: 0 / 10 · Good: 0</p><button class="btn btn-big boat-row" type="button">Row!</button></div>`;
      const mark = body.querySelector('.boat-mark');
      const count = body.querySelector('.boat-count');
      let t = 0, strokes = 0, good = 0, stop = false, last = performance.now();
      const speed = 1.1;
      const tick = (now) => {
        if (stop) return;
        t += ((now - last) / 1000) * speed;
        last = now;
        const u = (Math.sin(t * Math.PI) + 1) / 2;
        mark.style.left = u * 100 + '%';
        mark.dataset.u = u;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      body.querySelector('.boat-row').addEventListener('click', () => {
        if (stop) return;
        const u = +mark.dataset.u;
        const hit = Math.abs(u - 0.5) <= zone / 2;
        strokes++;
        if (hit) good++;
        G.Audio && G.Audio.sfx(hit ? 'tap' : 'down');
        mark.classList.toggle('hit', hit);
        count.textContent = `Strokes: ${strokes} / 10 · Good: ${good}`;
        if (strokes >= 10) {
          stop = true;
          const win = good >= 6;
          body.innerHTML = `<p class="mg-result">${good} good strokes! ${win ? 'First across the line!' : 'A splashing, glorious fourth place.'}</p>`;
          done(root, { win, score: good }, resolve);
        }
      });
    });
  };
})();

</script>
<script>
/* Silver River — optional heart-to-heart conversations powered by Claude.
   Only available when the page runs inside claude.ai with the `sample` capability; otherwise the game
   uses its written dialogue and this module stays silent. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const M = G.Mind;
  const L = (G.LLM = {});
  let sample = null;
  let tried = false;

  L.init = async function () {
    if (tried) return;
    tried = true;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const s = await window.claude.use('sample');
        if (s) sample = s;
      }
    } catch (e) {
      sample = null;
    }
  };
  L.ready = () => !!sample;
  // codes that mean Claude can't be used in this view: hide the feature for the rest of it
  const GONE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  function handleError(e) {
    if (e && GONE.includes(e.code)) sample = null;
  }

  const EXPRS = ['neutral', 'happy', 'joy', 'laugh', 'sad', 'cry', 'teary', 'angry', 'pout', 'surprised', 'shy', 'tired', 'determined', 'worried', 'smug', 'thinking', 'love', 'calm'];

  function traitWords(s) {
    const t = s.traits;
    return D.TRAITS.map((x) => {
      const v = t[x.id];
      const word = v > 0 ? x.hi : x.lo;
      const how = Math.abs(v) > 60 ? 'very ' : Math.abs(v) > 25 ? '' : 'slightly ';
      return how + word.toLowerCase();
    }).join(', ');
  }
  function levelWord(v) {
    return v >= 80 ? 'very high' : v >= 60 ? 'high' : v >= 40 ? 'medium' : v >= 20 ? 'low' : 'very low';
  }

  L.profile = function (s) {
    const likes = Object.keys(s.tried).filter((id) => s.aff[id] >= 0.8).map((id) => D.ACT[id].name);
    const dislikes = Object.keys(s.tried).filter((id) => s.aff[id] <= -0.8).map((id) => D.ACT[id].name);
    const mems = s.memories.slice().sort((a, b) => b.weight - a.weight).slice(0, 6).map((m) => '- ' + m.text + (m.val < 0 ? ' (painful)' : ''));
    const style = M.style(s);
    const mood = M.mood(s);
    const last = s.log[s.log.length - 1];
    const recent = last ? last.months.map((m) => (D.ACT[m.act] ? D.ACT[m.act].name + ' (' + m.outcome + ')' : m.act)).join(', ') : 'nothing yet';
    return [
      `Name: ${s.name}. Age: ${s.age}. Calls her ${s.parent.role === 'mom' ? 'mother' : 'father'} "${M.addr(s)}".`,
      `Personality: ${traitWords(s)}. Speaking voice: ${M.voice(s)}.`,
      `Mood: ${mood.label}. Stress: ${s.stress}/100. Current feeling: ${s.emotion ? s.emotion.kind : 'calm'}.`,
      `Needs (0=starved, 100=full): fun ${s.needs.fun}, affection ${s.needs.love}, freedom ${s.needs.freedom}, achievement ${s.needs.pride}, friends ${s.needs.friends}.`,
      `Feelings toward ${M.addr(s)}: bond ${levelWord(s.bond)}, trust ${levelWord(s.trust)}. Self-esteem ${levelWord(s.esteem)}. She experiences her parent as: ${style.name} (${style.desc})`,
      `Loves: ${likes.join(', ') || 'still finding out'}. Dislikes: ${dislikes.join(', ') || 'nothing much'}.`,
      `Favorite food ${s.fav.food}, color ${s.fav.color}, animal ${s.fav.animal}, flower ${s.fav.flower}. Afraid of ${s.fav.fear}. Quirk: she ${s.fav.quirk}.`,
      `Dream: ${s.dream ? D.DREAMS[s.dream].say : 'not decided yet'}.`,
      `Friends: Mei (best friend, lantern shop girl) ${levelWord(s.friends.mei)}; Tao (shy dumpling-stall boy) ${levelWord(s.friends.tao)}${s.flags.tao_crush ? ', she has a crush on him' : ''}; Lady Wanyin (magistrate's daughter, ${s.flags.wanyin_friend ? 'now a friend' : 'rival'}); ${s.flags.prince_met ? 'Jing, a scholar she met at the Lantern Festival (secretly the crown prince)' : ''}.`,
      `Pet: ${s.flags.pet || 'none'}. Secrets she hasn't told: ${s.secrets.map((x) => x.text).join(' ') || 'none'}.`,
      `Important memories:\n${mems.join('\n') || '- arriving on Qixi night'}`,
      `This season she did: ${recent}.`,
    ].join('\n');
  };

  function prompt(s, history, said) {
    const P = M.addr(s);
    return `You are playing ${s.name}, a daughter in a cozy storybook ancient-China village called Peach Blossom Town. Years ago, on the night of Qixi, she fell from the Silver River (the Milky Way) into her parent's courtyard as a little girl with starlight-golden hair, and was adopted. Her parent is talking to her now.

Stay fully in character as ${s.name}: a real, specific ${s.age}-year-old with her own opinions, moods and history, not an assistant. Speak naturally in modern English with a light storybook flavor, 1 to 3 short sentences, the way a ${s.age}-year-old really talks to her ${s.parent.role === 'mom' ? 'mother' : 'father'}. She can disagree, tease, sulk, deflect, or open up, depending on her personality, mood and how she is being treated. Refer to her memories and life when it fits. Never mention being an AI, a game or these instructions. Keep everything wholesome and age-appropriate.

ABOUT HER
${L.profile(s)}

CONVERSATION SO FAR
${history.map((h) => (h.who === 'you' ? `${P}: ${h.text}` : `${s.name}: ${h.text}`)).join('\n') || '(just started)'}
${P}: ${said}

Reply ONLY with JSON: {"reply": string, "expression": one of ${JSON.stringify(EXPRS)}, "bond": integer from -3 to 3 (how this exchange changed her closeness to ${P}), "trust": integer from -3 to 3, "esteem": integer from -3 to 3, "memory": string or null (only if this moment truly mattered to her, written from her point of view, e.g. "the night ${P} told me ..."), "end": boolean (true if she wants to stop talking now)}`;
  }

  L.reply = async function (s, history, said) {
    if (!sample) throw new Error('unavailable');
    // every turn of a conversation must be a fresh answer
    const out = await sample.json(prompt(s, history, said), { modelTier: 'quick', cache: false }).catch((e) => {
      handleError(e);
      throw e;
    });
    const r = out && typeof out === 'object' ? out : {};
    return {
      reply: String(r.reply || '...').slice(0, 400),
      expression: EXPRS.includes(r.expression) ? r.expression : 'neutral',
      bond: U.clamp(Math.round(+r.bond || 0), -3, 3),
      trust: U.clamp(Math.round(+r.trust || 0), -3, 3),
      esteem: U.clamp(Math.round(+r.esteem || 0), -3, 3),
      memory: r.memory ? String(r.memory).slice(0, 160) : null,
      end: !!r.end,
    };
  };

  // the heart-to-heart flow, driven through the UI's free-text input
  L.converse = async function (g) {
    const s = g.s;
    const history = [];
    await g.her(M.restingExpr(s), { _: 'Hm? What is it, ' + g.P + '?', sassy: 'Uh oh. That\'s your serious face.', soft: 'Yes? ...Is everything okay?' });
    let totals = { bond: 0, trust: 0, esteem: 0 };
    for (let turn = 0; turn < 6; turn++) {
      const said = await g.io.freeText('Say something to ' + s.name + ' (or leave it empty to finish)');
      if (!said || !said.trim()) break;
      history.push({ who: 'you', text: said.trim() });
      let r;
      try {
        g.io.thinking && g.io.thinking(true);
        r = await L.reply(s, history.slice(0, -1), said.trim());
      } catch (e) {
        g.io.thinking && g.io.thinking(false);
        await g.nar('She seems lost in thought and doesn\'t answer. (Heart-to-heart isn\'t available right now.)');
        break;
      }
      g.io.thinking && g.io.thinking(false);
      history.push({ who: 'her', text: r.reply });
      await g.io.say('her', r.reply, { expr: r.expression });
      totals.bond += r.bond;
      totals.trust += r.trust;
      totals.esteem += r.esteem;
      if (r.memory) M.remember(s, { id: 'talk_' + s.turn + '_' + turn, text: r.memory, letter: 'I still remember ' + r.memory.replace(/^the /, 'the ') + '.', weight: 6, val: r.bond >= 0 ? 1 : -1, tags: ['parent', 'talk'] });
      if (r.end) break;
    }
    // bounded effects so a conversation can't swing everything
    g.bond(U.clamp(totals.bond, -6, 6));
    g.trust(U.clamp(totals.trust, -6, 6));
    g.esteem(U.clamp(totals.esteem, -5, 5));
    g.need('love', 10);
  };

  // a one-of-a-kind letter for the ending, if Claude is available
  L.letter = async function (s, career, star) {
    if (!sample) return null;
    const P = M.addr(s);
    const mems = s.memories.slice().sort((a, b) => b.weight - a.weight).slice(0, 8).map((m) => '- ' + m.text + (m.val < 0 ? ' (painful)' : ''));
    const input = `Write the letter ${s.name} leaves for her ${s.parent.role === 'mom' ? 'mother' : 'father'} ("${P}") on the night of her eighteenth Qixi, in a storybook ancient-China village. She fell from the Silver River as a child and was raised by them.
${star ? 'She has chosen to return to the stars.' : 'She has chosen to stay, and is about to begin her life as: ' + (career ? career.name : 'herself') + '.'}
${L.profile(s)}
Her most important memories with ${P}:
${mems.join('\n')}
Write 120 to 190 words in her own voice (personality: ${traitWords(s)}), warm and specific, referencing two or three of the memories above, honest about any painful ones if the bond allows. Start with "Dear ${P}," and end with her name on its own line. Plain text only.`;
    try {
      const r = await sample(input, { modelTier: 'default' });
      const text = r && r.text ? r.text.trim() : '';
      return text ? text.split(/\n+/).map((x) => x.trim()).filter(Boolean) : null;
    } catch (e) {
      handleError(e);
      return null;
    }
  };
})();

</script>
<script>
/* Silver River — presentation: stage, dialogue box, planner, overlays, toasts. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const M = G.Mind;
  const UI = (G.UI = {});
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = U.esc;
  const icon = (n) => G.icon(n);

  UI.settings = { text: 1, skipSeen: true };
  UI.state = null;

  // ================================================================ setup
  UI.init = function () {
    UI.stageCanvas = $('#stage');
    UI.stage = new G.World.Stage(UI.stageCanvas);
    UI.stage.start();
    UI.stage.onClickActor = (a) => UI.onActorClick && UI.onActorClick(a);
    UI.dlg = $('#dialogue');
    UI.dlgCanvas = $('#dlg-canvas');
    UI.dlgCanvas.width = 64;
    UI.dlgCanvas.height = 64;
    UI.dlgCtx = UI.dlgCanvas.getContext('2d');
    UI.dlgCtx.imageSmoothingEnabled = false;
    // advance dialogue by click / key
    UI.dlg.addEventListener('click', (e) => {
      if (e.target.closest('button, input')) return;
      advance();
    });
    document.addEventListener('keydown', (e) => {
      if (UI.dlg.hidden) return;
      if (e.target.closest && e.target.closest('input')) return;
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        advance();
      }
    });
    $('#dlg-skip').addEventListener('click', () => {
      UI.skipping = true;
      advance();
    });
    setInterval(portraitTick, 90);
  };

  // ================================================================ her portrait in the dialogue box
  let pState = null; // { o, talking, blinkUntil }
  function herPortraitOpts(s, expr) {
    return { hair: s.look.hair, eyes: s.look.eyes, skin: s.look.skin, style: s.style, age: s.age, expr: expr || 'neutral', outfit: D.OUTFITS[s.outfit] || D.OUTFITS.everyday, outfitKey: s.outfit };
  }
  UI.herPortraitOpts = herPortraitOpts;
  function npcPortraitOpts(id, expr) {
    const n = G.NPC[id];
    if (!n || !n.look) return null;
    return { hair: n.look.hair, eyes: n.look.eyes, skin: n.look.skin, style: n.style || 'straight', age: n.age || 16, expr: expr || 'neutral', outfit: n.outfit, outfitKey: 'npc_' + id, male: n.body === 'man' || n.body === 'boy', beard: n.beard, ahoge: false, noPins: true };
  }
  let blinkT = 0;
  function portraitTick() {
    if (!pState || UI.dlg.hidden) return;
    blinkT++;
    const blink = blinkT % 38 === 0 || blinkT % 38 === 1;
    const talk = pState.talking && Math.floor(blinkT / 2) % 2 === 0;
    const c = G.Portrait.render(Object.assign({}, pState.o, { blink, talk }));
    UI.dlgCtx.clearRect(0, 0, 64, 64);
    UI.dlgCtx.drawImage(c, 0, 0);
  }

  // ================================================================ dialogue
  let waiter = null; // resolve fn for "next"
  let typer = null; // { full, i, el, done }
  function advance() {
    if (typer && !typer.done) {
      typer.finish();
      return;
    }
    if (waiter) {
      const w = waiter;
      waiter = null;
      G.Audio.sfx('tap');
      w();
    }
  }
  function showDialogue(on) {
    UI.dlg.hidden = !on;
    $('#game').classList.toggle('talking', on);
    $('#planner').classList.toggle('busy', on);
    if (!on) {
      UI.hideBubble();
      pState = null;
    }
  }
  UI.showDialogue = showDialogue;

  function typeText(el, text) {
    return new Promise((res) => {
      const speed = UI.settings.text === 2 ? 0 : UI.settings.text === 0 ? 22 : 45; // chars per second, 0 = instant
      el.textContent = '';
      let i = 0;
      let iv = null;
      const full = text;
      typer = {
        done: false,
        finish() {
          el.textContent = full;
          this.done = true;
          if (pState) pState.talking = false;
          if (iv) clearInterval(iv);
          res();
        },
      };
      if (!speed || UI.skipping) {
        typer.finish();
        return;
      }
      const step = Math.max(1, Math.round(speed / 30));
      iv = setInterval(() => {
        i += step;
        el.textContent = full.slice(0, i);
        if (i % 6 === 0) G.Audio.sfx && Math.random() < 0.3 && G.Audio.blip && G.Audio.blip();
        if (i >= full.length) typer.finish();
      }, 1000 / 30);
    });
  }

  UI.say = async function (who, text, opts = {}) {
    const s = UI.state;
    showDialogue(true);
    $('.dlg-choices', UI.dlg).innerHTML = '';
    $('.dlg-input', UI.dlg).hidden = true;
    const nameEl = $('.dlg-name', UI.dlg);
    const textEl = $('.dlg-text', UI.dlg);
    const seal = $('.dlg-seal', UI.dlg);
    textEl.classList.toggle('narr', !who);
    if (who === 'her') {
      nameEl.textContent = s.name;
      seal.hidden = true;
      UI.dlgCanvas.hidden = false;
      pState = { o: herPortraitOpts(s, opts.expr), talking: true };
      UI.herExpr(opts.expr);
    } else if (who) {
      const n = G.NPC[who] || { name: who, zh: '?', color: '#8a6a4a' };
      nameEl.textContent = n.name;
      const po = npcPortraitOpts(who, opts.expr);
      if (po && G.Portrait.canMale !== false) {
        seal.hidden = true;
        UI.dlgCanvas.hidden = false;
        pState = { o: po, talking: true };
      } else {
        UI.dlgCanvas.hidden = true;
        seal.hidden = false;
        seal.textContent = n.zh;
        seal.style.setProperty('--seal', n.color);
        pState = null;
      }
    } else {
      nameEl.textContent = '';
      UI.dlgCanvas.hidden = true;
      seal.hidden = false;
      seal.textContent = '✦';
      seal.style.setProperty('--seal', '#2a3170');
      pState = null;
    }
    portraitTick();
    $('.dlg-next', UI.dlg).hidden = true;
    await typeText(textEl, text);
    if (pState) pState.talking = false;
    if (UI.skipping) return;
    $('.dlg-next', UI.dlg).hidden = false;
    await new Promise((r) => (waiter = r));
    $('.dlg-next', UI.dlg).hidden = true;
  };

  UI.choose = function (options) {
    UI.skipping = false;
    showDialogue(true);
    const box = $('.dlg-choices', UI.dlg);
    $('.dlg-next', UI.dlg).hidden = true;
    return new Promise((res) => {
      box.innerHTML = options.map((o, i) => `<button class="btn btn-ghost" type="button" data-i="${i}" ${o.disabled ? 'disabled' : ''}>${esc(o.text)}</button>`).join('');
      box.querySelectorAll('button').forEach((b) =>
        b.addEventListener('click', () => {
          G.Audio.sfx('select');
          box.innerHTML = '';
          res(+b.dataset.i);
        })
      );
      const first = box.querySelector('button:not(:disabled)');
      if (first) first.focus({ preventScroll: true });
    });
  };

  function textPrompt(label, def, allowEmpty) {
    UI.skipping = false;
    showDialogue(true);
    const wrap = $('.dlg-input', UI.dlg);
    const inp = $('#dlg-in');
    const btn = $('#dlg-send');
    $('.dlg-next', UI.dlg).hidden = true;
    $('.dlg-choices', UI.dlg).innerHTML = '';
    if (label) {
      $('.dlg-name', UI.dlg).textContent = '';
      $('.dlg-text', UI.dlg).textContent = label;
      UI.dlgCanvas.hidden = true;
      const seal = $('.dlg-seal', UI.dlg);
      seal.hidden = false;
      seal.textContent = '✎';
      seal.style.setProperty('--seal', '#2a3170');
      pState = null;
    }
    wrap.hidden = false;
    inp.value = def || '';
    inp.focus();
    return new Promise((res) => {
      const done = () => {
        const v = inp.value.trim();
        if (!v && !allowEmpty) return;
        wrap.hidden = true;
        btn.onclick = null;
        inp.onkeydown = null;
        res(v);
      };
      btn.onclick = done;
      inp.onkeydown = (e) => {
        if (e.key === 'Enter') done();
      };
    });
  }
  UI.input = (label, def) => textPrompt(label, def, false);
  UI.freeText = (label) => textPrompt(label, '', true);
  UI.thinking = function (on) {
    const t = $('.dlg-text', UI.dlg);
    if (on) {
      $('.dlg-name', UI.dlg).textContent = UI.state.name;
      t.innerHTML = '<span class="thinking">' + esc(UI.state.name) + ' is thinking</span>';
    }
  };

  // ================================================================ stage
  UI.herActor = null;
  UI.herPal = function (s, outfitKey) {
    return G.Sprites.palette(s.look, D.OUTFITS[outfitKey || s.outfit] || D.OUTFITS.everyday);
  };
  UI.scene = async function (name, opts = {}) {
    const s = UI.state;
    const st = UI.stage;
    UI.hideBubble();
    const items = s ? UI.homeItems(s) : {};
    st.set(name, Object.assign({ season: s ? D.SEASONS[s.turn % 4] : 'summer', tod: 'day', items }, opts));
    st.clear();
    UI.herActor = null;
    UI.npcActors = {};
    if (s && !opts.noHer) UI.placeHer(opts.anim || 'idle');
    return true;
  };
  // what her life has left around the house
  const FLOWER_COLOR = { 'peach blossoms': ['spring', '#f7a8c0'], orchids: ['spring', '#c9a8e8'], peonies: ['spring', '#e36d8f'], lotus: ['summer', '#f4b6c8'], chrysanthemums: ['autumn', '#f2c14a'], 'plum blossoms': ['winter', '#e25a7a'] };
  UI.homeItems = function (s) {
    const sea = D.SEASONS[s.turn % 4];
    const fl = s.fav && FLOWER_COLOR[s.fav.flower];
    const seen = (id) => !!(s.seen && s.seen[id]);
    const it = {
      books: Math.floor(s.stats.wit / 18),
      sword: (s.counts.martial || 0) >= 3,
      guqin: (s.counts.guqin || 0) >= 2,
      heights: (s.heights || []).length,
    };
    if (fl && fl[0] === sea) it.flower = fl[1];
    if (seen('mei_lantern') || seen('rabbit_lantern')) it.rabbitLantern = true;
    if (s.flags.pet) it.catBed = true;
    if ((s.counts.martial || 0) >= 5) it.dummy = true;
    if (s.fav && s.fav.quirk === 'collects smooth river stones') it.stones = true;
    if (s.traits.playful > -20 && s.age <= 15) it.snow = true;
    if (s.traits.playful + s.traits.dreamy > 10 || (s.counts.play || 0) >= 2) it.kite = true;
    return it;
  };
  UI.placeHer = function (anim = 'idle', spot = 'her') {
    const s = UI.state;
    const [x, y] = UI.stage.spot(spot);
    UI.herActor = UI.stage.add({ id: 'her', kind: 'her', x, y, anim, pal: UI.herPal(s, UI.outfitOverride), cfg: UI.herCfg(s), clickable: true });
    return UI.herActor;
  };
  UI.herCfg = (s) => {
    const cfg = { style: s.style };
    const band = G.Sprites.bandFor(s.age);
    if (band) cfg.band = band;
    return cfg;
  };
  UI.refreshHer = function () {
    if (!UI.herActor || !UI.state) return;
    UI.herActor.pal = UI.herPal(UI.state, UI.outfitOverride);
    UI.herActor.cfg = UI.herCfg(UI.state);
  };
  UI.herAnim = function (anim) {
    if (UI.herActor) {
      UI.herActor.anim = anim;
      UI.herActor.t = 0;
    }
  };
  const EXPR_ANIM = { joy: 'cheer', laugh: 'cheer', love: 'love', cry: 'cry', sleep: 'sleep' };
  const EXPR_EMOTE = { angry: 'anger', pout: 'anger', surprised: 'bang', worried: 'drop', sad: 'drop', thinking: 'dots', shy: 'heart', teary: 'drop' };
  UI.herExpr = function (expr) {
    const a = UI.herActor;
    if (!a) return;
    if (EXPR_ANIM[expr]) a.anim = EXPR_ANIM[expr];
    else if (['cheer', 'love', 'cry', 'sleep'].includes(a.anim)) a.anim = 'idle';
    if (EXPR_EMOTE[expr]) UI.stage.emote(a, EXPR_EMOTE[expr], 2.2);
  };
  UI.npcActors = {};
  UI.npc = function (id, where = 'mentor') {
    const n = G.NPC[id];
    if (!n || !n.outfit) return null;
    const [x, y] = UI.stage.spot(where);
    const a = UI.stage.add({ id: 'npc_' + id, kind: 'npc', x, y, anim: 'idle', pal: G.Sprites.palette(n.look, n.outfit), cfg: G.Sprites.npcCfg(id, n, UI.state && UI.state.age), clickable: true, npc: id });
    UI.npcActors[id] = a;
    return a;
  };
  UI.clearNpcs = function () {
    Object.values(UI.npcActors).forEach((a) => UI.stage.remove(a.id));
    UI.npcActors = {};
  };

  // bubble over an actor
  UI.bubble = function (actor, text, ms = 2600) {
    const b = $('#bubble');
    const wrap = $('.stage-wrap');
    const r = wrap.getBoundingClientRect();
    const cr = UI.stageCanvas.getBoundingClientRect();
    // account for object-fit: cover on phones
    const scale = Math.max(cr.width / G.World.W, cr.height / G.World.H);
    const offX = (cr.width - G.World.W * scale) / 2, offY = (cr.height - G.World.H * scale) / 2;
    b.style.left = offX + actor.x * scale + 'px';
    b.style.top = offY + (actor.y - 36) * scale + 'px';
    b.textContent = text;
    b.hidden = false;
    clearTimeout(UI._bt);
    UI._bt = setTimeout(() => (b.hidden = true), ms);
    void r;
  };
  UI.hideBubble = () => ($('#bubble').hidden = true);

  // ================================================================ toasts
  UI.toast = function (t) {
    const box = $('#toasts');
    if (!box) return;
    let text = '', cls = '';
    if (typeof t === 'string') text = t;
    else if (t.kind === 'stat') {
      const st = D.STATS.find((x) => x.id === t.stat);
      text = (t.d > 0 ? '+' : '') + t.d + ' ' + st.name;
    } else if (t.kind === 'bond') text = (t.d > 0 ? '♥ +' : '♥ ') + t.d + ' Bond';
    else if (t.kind === 'stress') text = (t.d > 0 ? '+' : '') + t.d + ' Stress';
    else if (t.kind === 'gold') text = (t.d > 0 ? '+' : '') + t.d + ' coins';
    else if (t.kind === 'learn') {
      text = '✦ You learned: ' + t.text;
      cls = 'learn';
    } else if (t.kind === 'photo') {
      text = '▣ Added to the album: ' + t.text;
      cls = 'learn';
    } else if (t.kind === 'town') {
      text = '☖ Around town: ' + t.text;
      cls = 'town';
    }
    if (!text) return;
    const el = document.createElement('div');
    el.className = 'toast ' + cls;
    el.textContent = text;
    box.appendChild(el);
    setTimeout(() => el.remove(), cls === 'town' ? 8100 : 2900);
    while (box.children.length > 5) box.firstChild.remove();
  };
  UI.photo = function (p) {
    const f = document.createElement('div');
    f.className = 'flash';
    $('.stage-wrap').appendChild(f);
    setTimeout(() => f.remove(), 600);
    G.Audio.sfx('bell');
    UI.toast({ kind: 'photo', text: p.title || p.caption });
  };

  // ================================================================ season card & montage caption
  UI.seasonCard = function (s) {
    const sea = D.SEASONS[s.turn % 4];
    const el = document.createElement('div');
    el.className = 'season-card';
    el.innerHTML = `<div><div class="zh">${D.SEASON_ZH[sea]}</div><h2>${D.SEASON_NAME[sea]} · Year ${Math.floor(s.turn / 4) + 1}</h2><p>${esc(s.name)} is ${s.age}</p></div>`;
    $('.stage-wrap').appendChild(el);
    return new Promise((r) => setTimeout(() => {
      el.remove();
      r();
    }, 2100));
  };

  UI.caption = function (res, when, fast) {
    const box = $('#caption');
    const A = D.ACT[res.act] || { name: 'Rest', icon: 'moon' };
    const title = res.hobby ? 'Her own time' : A.name;
    const gains = Object.entries(res.gains || {}).filter(([, v]) => v).map(([k, v]) => `<span class="gain ${v > 0 ? 'up' : 'down'}">${v > 0 ? '+' : ''}${v} ${D.STATS.find((x) => x.id === k).name}</span>`);
    if (res.stress) gains.push(`<span class="gain ${res.stress < 0 ? 'up' : 'down'}">${res.stress > 0 ? '+' : ''}${res.stress} Stress</span>`);
    if (res.gold) gains.push(`<span class="gain ${res.gold > 0 ? 'up' : 'down'}">${res.gold > 0 ? '+' : ''}${res.gold} coins</span>`);
    const outcome = res.outcome && !res.hobby && A.cat !== 'leisure' ? `<span class="outcome ${res.outcome}">${res.outcome === 'great' ? 'Great!' : res.outcome === 'poor' ? 'Rough' : 'Good'}</span>` : '';
    box.className = 'caption frame';
    box.innerHTML = `<div class="cap-ico">${icon(res.hobby ? 'sparkle' : A.icon)}</div><div><div class="cap-when">${esc(when)}${res.chosen ? ' · her choice' : ''}${res.forced ? ' · she didn\'t want to' : ''}</div><div class="cap-title">${esc(title)}${outcome}</div><p class="cap-text">${esc(res.text || '')}</p><div class="cap-gains">${gains.join('')}</div></div>`;
    box.hidden = false;
    $('.stage-wrap').classList.add('capping');
    return new Promise((r) => {
      let done = false;
      const fin = () => {
        if (done) return;
        done = true;
        box.hidden = true;
        $('.stage-wrap').classList.remove('capping');
        box.onclick = null;
        r();
      };
      box.onclick = fin;
      setTimeout(fin, fast ? 1200 : 3000 + (res.text || '').length * 18);
    });
  };

  // ================================================================ status strip: her whole childhood at a glance
  UI.status = function (s) {
    const el = $('#status');
    if (!el) return;
    const pips = [];
    for (let t = 0; t < s.turns; t++) {
      const cls = t < s.turn ? 'done' : t === s.turn ? 'now' : '';
      pips.push(`<span class="pip ${cls} ${t % 4 === 3 ? 'qixi' : ''}" title="${D.SEASON_NAME[D.SEASONS[t % 4]]}, year ${Math.floor(t / 4) + 1}"></span>`);
    }
    const left = s.turns - s.turn;
    const news = G.Town ? G.Town.news(s) : '';
    el.innerHTML = `<div class="timeline-label">${s.phase === 'finale' ? 'Tonight is her eighteenth Qixi' : left <= 1 ? 'Her eighteenth Qixi is coming' : left + ' seasons until her eighteenth Qixi'}</div><div class="timeline">${pips.join('')}<span class="end">18</span></div><div class="minis">${D.STATS.map((st) => `<span class="mini" style="--c:${st.color}" title="${st.name}: ${s.stats[st.id]}"><span class="gl">${st.glyph}</span><span class="v">${s.stats[st.id]}</span></span>`).join('')}</div>${news ? `<div class="town"><span class="tag">Around town</span>${esc(news)}</div>` : ''}`;
  };

  // ================================================================ HUD
  UI.hud = function (s) {
    UI.status(s);
    const sea = D.SEASONS[s.turn % 4];
    const mood = M.mood(s);
    const intro = s.phase === 'intro' || s.phase === 'finale';
    $('#hud').innerHTML = `
      <div class="when"><span class="zh">${intro ? '夕' : D.SEASON_ZH[sea]}</span>${s.phase === 'finale' ? 'Her eighteenth Qixi' : intro ? 'Qixi night' : D.SEASON_NAME[sea] + ' · Year ' + (Math.floor(s.turn / 4) + 1)}</div>
      <div class="who">${esc(s.name)}, ${s.age} · ${M.MOOD_WORDS[mood.label]}</div>
      <div class="spacer"></div>
      <div class="meter" title="Bond">${icon('heart')}<span class="bar"><i style="width:${s.bond}%;--c:#e46a78"></i></span></div>
      <div class="meter" title="Stress">${icon('cloud')}<span class="bar"><i style="width:${s.stress}%;--c:${s.stress > 70 ? '#e0485e' : '#8f9ad8'}"></i></span></div>
      <div class="meter" title="Coins">${icon('coin')}<span>${s.gold}</span></div>
      <button class="hud-btn" type="button" data-hud="her" aria-label="Her" title="Her">${icon('person')}Her</button>
      <button class="hud-btn" type="button" data-hud="diary" aria-label="Diary" title="Diary">${icon('book')}Diary</button>
      <button class="hud-btn" type="button" data-hud="album" aria-label="Album" title="Album">${icon('album')}Album</button>
      <button class="hud-btn" type="button" data-hud="menu" aria-label="Menu" title="Menu">${icon('gear')}Menu</button>`;
  };

  // ================================================================ overlay sheets
  UI.sheet = function (title, html, onMount) {
    const ov = $('#overlay');
    ov.innerHTML = `<div class="sheet frame" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="btn btn-ghost close" type="button" data-close>Close</button></div>${html}</div>`;
    ov.hidden = false;
    const close = () => {
      ov.hidden = true;
      ov.innerHTML = '';
      UI.sheetOpen = false;
      if (UI.onSheetClose) {
        const f = UI.onSheetClose;
        UI.onSheetClose = null;
        f();
      }
    };
    ov.querySelector('[data-close]').onclick = close;
    ov.onclick = (e) => {
      if (e.target === ov) close();
    };
    UI.sheetOpen = true;
    if (onMount) onMount(ov.querySelector('.sheet'), close);
    return close;
  };
  UI.closeSheet = () => {
    const b = document.querySelector('#overlay [data-close]');
    if (b) b.click();
  };
  UI.drawPortraitInto = function (canvas, opts) {
    canvas.width = 64;
    canvas.height = 64;
    const g = canvas.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(G.Portrait.render(opts), 0, 0);
  };

  // ---------------------------------------------------------------- profile
  UI.profile = function (s) {
    const mood = M.mood(s);
    const style = M.style(s);
    const stats = D.STATS.map((st) => `<div class="stat" style="--c:${st.color}"><span class="gl">${st.glyph}</span><span>${st.name}</span><span class="bar"><i style="width:${s.stats[st.id]}%"></i></span><span class="v">${s.stats[st.id]}</span><span class="rk">${D.rank(s.stats[st.id])} · ${esc(st.desc)}</span></div>`).join('');
    const traits = D.TRAITS.map((t) => {
      const known = s.known.traits[t.id];
      const pos = ((s.traits[t.id] + 100) / 200) * 100;
      return `<div class="slider ${known ? '' : 'unknown'}"><span>${t.lo}</span><span class="track"><span class="dot" style="left:${pos}%"></span></span><span class="r">${t.hi}</span></div>`;
    }).join('');
    const likes = Object.keys(s.known.likes).filter((id) => D.ACT[id]).sort((a, b) => s.aff[b] - s.aff[a]).map((id) => `<li>${esc(D.ACT[id].name)}: <span class="muted">${M.AFF_WORDS[M.affLevel(s.aff[id])]}</span></li>`).join('') || '<li class="muted">Try activities to find out.</li>';
    const favs = Object.keys(s.known.fav).map((k) => `<li>${esc({ food: 'Food', color: 'Color', animal: 'Animal', flower: 'Flower', fear: 'Afraid of', quirk: 'She' }[k])}: ${esc(s.fav[k])}</li>`).join('') || '<li class="muted">Talk with her to learn more.</li>';
    const facts = s.known.facts.map((f) => `<li>${esc(f)}</li>`).join('') || '<li class="muted">Nothing yet.</li>';
    const needs = D.NEEDS.filter((n) => n.id !== 'rest').map((n) => `<div class="need"><span>${n.name}</span><span class="bar"><i style="width:${s.needs[n.id]}%;--c:${s.needs[n.id] < 30 ? '#e0485e' : '#4f9a6a'}"></i></span></div>`).join('');
    const friend = (id, label) => `<div class="need"><span>${label}</span><span class="bar"><i style="width:${s.friends[id]}%;--c:#e6b64d"></i></span></div>`;
    const html = `
      <div class="grid2">
        <div class="box" style="align-items:center;text-align:center"><canvas class="px" id="prof-port" style="width:192px;height:192px;border:3px solid var(--ink);background:#e8d9b0"></canvas>
          <h3>${esc(s.name)}, ${s.age}</h3><p class="muted" style="margin:0">${M.MOOD_WORDS[mood.label]}${s.dream ? ' · dreams of being ' + esc(({ general: 'a general', swordswoman: 'a wandering hero', scholar: 'a scholar', astronomer: 'an astronomer', immortal: 'an immortal', physician: 'a physician', musician: 'a musician', dancer: 'a dancer', poet: 'a poet', princess: 'a princess', priestess: 'an abbess', teacher: 'a teacher', chef: 'a chef', merchant: 'a merchant', teahouse: 'a teahouse owner', farmer: 'a tea master', weaver: 'a weaver' })[s.dream] || s.dream) : ''}</p></div>
        <div class="box"><h3>Growth</h3>${stats}</div>
        <div class="box"><h3>Her heart</h3>
          <div class="need"><span>Bond</span><span class="bar"><i style="width:${s.bond}%;--c:#e46a78"></i></span></div>
          <div class="need"><span>Stress</span><span class="bar"><i style="width:${s.stress}%;--c:#8f9ad8"></i></span></div>
          <div class="need"><span>Confidence</span><span class="bar"><i style="width:${s.esteem}%;--c:#e6b64d"></i></span></div>
          ${needs}
          <p style="margin:4px 0 0">She trusts you <b>${M.trustWord(s)}</b>.</p>
          <p style="margin:0">How she sees you: <b>${style.name}</b><br><span class="muted">${style.desc}</span></p>
        </div>
        <div class="box"><h3>Who she is</h3>${traits}<p class="note">Traits reveal themselves as you get to know her.</p></div>
        <div class="box"><h3>What she likes</h3><ul class="list">${likes}</ul></div>
        <div class="box"><h3>Her favorite things</h3><ul class="list">${favs}</ul></div>
        <div class="box"><h3>Things you've learned</h3><ul class="list">${facts}</ul></div>
        <div class="box"><h3>Friends</h3>${friend('mei', 'Mei')}${friend('tao', 'Tao')}${s.flags.prince_met ? friend('prince', 'Jing') : ''}${s.friends.wanyin ? friend('wanyin', 'Wanyin') : ''}${s.flags.pet ? `<p style="margin:4px 0 0">Pet cat: <b>${esc(s.flags.pet)}</b></p>` : ''}</div>
      </div>`;
    UI.sheet('Her', html, (root) => UI.drawPortraitInto(root.querySelector('#prof-port'), herPortraitOpts(s, M.restingExpr(s))));
  };

  // ---------------------------------------------------------------- album
  UI.renderPhoto = function (canvas, p, s) {
    canvas.width = G.World.W;
    canvas.height = G.World.H;
    const g = canvas.getContext('2d');
    g.imageSmoothingEnabled = false;
    const bg = G.World.paintScene(p.scene, { season: p.season || 'spring', tod: p.tod || 'day', items: {}, magpies: false });
    g.drawImage(bg.canvas, 0, 0);
    const spot = (bg.info.spots && bg.info.spots.her) || [160, 150];
    // she is drawn at the size she was when the photo was taken
    const anims = G.Sprites.build(UI.herCfg({ style: s.style, age: p.age || s.age }));
    const fr = (anims[p.anim] || anims.idle)[0];
    const pal = G.Sprites.palette(s.look, D.OUTFITS[p.outfit] || D.OUTFITS.everyday);
    const top = spot[1] - fr.rows.length;
    G.PX.draw(g, G.Sprites.join(fr.rows), pal, spot[0] - 8, top);
    (fr.props || []).forEach((pr) => {
      const ps = G.Sprites.PROPS[pr.name];
      if (ps) G.PX.draw(g, ps.join('\n'), G.Sprites.PROP_PAL, spot[0] - 8 + pr.x, top + pr.y);
    });
    (p.npcs || []).forEach((id, i) => {
      const n = G.NPC[id];
      if (!n || !n.outfit) return;
      const a = G.Sprites.build(G.Sprites.npcCfg(id, n, p.age || s.age)).idle[0];
      G.PX.draw(g, G.Sprites.join(a.rows), G.Sprites.palette(n.look, n.outfit), spot[0] + 20 + i * 18, spot[1] - a.rows.length, true);
    });
    if (p.tod === 'night') {
      g.fillStyle = 'rgba(18,22,62,0.35)';
      g.fillRect(0, 0, G.World.W, G.World.H);
    }
  };
  UI.album = function (s) {
    const list = s.album.slice().reverse();
    const html = list.length
      ? `<div class="album">${list.map((p, i) => `<figure class="photo" style="--r:${(i % 3) - 1}deg;margin:0"><canvas class="px" data-i="${s.album.length - 1 - i}"></canvas><b>${esc(p.title || '')}</b><small>Age ${p.age} · ${esc(p.caption || '')}</small></figure>`).join('')}</div>`
      : '<p class="muted">No photos yet. Special moments will be kept here.</p>';
    UI.sheet('Album', html, (root) => root.querySelectorAll('canvas[data-i]').forEach((c) => UI.renderPhoto(c, s.album[+c.dataset.i], s)));
  };

  // ---------------------------------------------------------------- diary
  UI.diaryPage = function (s, entry) {
    const open = entry.open;
    if (!open) return `<div class="locked-diary">${icon('lock')}<p>Her diary is locked now. She wears the key around her neck.</p><p class="note">When she trusts you enough, she may choose to share it.</p></div>`;
    const young = entry.age <= 14;
    return `<div class="diary ${young ? 'young' : 'old'}"><div class="d-date">${esc(entry.label)}</div>${entry.lines.map((l) => `<p>${esc(l)}</p>`).join('')}</div>`;
  };
  UI.diaryBook = function (s) {
    // once she trusts you with her diary, the pages she locked before open up too
    const nowOpen = G.Sim.diaryOpen(s).open;
    const book = (s.diaryBook || []).slice().reverse();
    const parts = [];
    let locked = [];
    const flush = () => {
      if (!locked.length) return;
      const range = locked.length > 1 ? locked[locked.length - 1].label + ' to ' + locked[0].label : locked[0].label;
      parts.push(`<div class="locked-row">${icon('lock')}<span>${locked.length === 1 ? 'A page' : locked.length + ' pages'} she keeps to herself</span><small>${esc(range)}</small></div>`);
      locked = [];
    };
    book.forEach((e) => {
      if (e.open || nowOpen) {
        flush();
        parts.push(UI.diaryPage(s, Object.assign({}, e, { open: true })));
      } else locked.push(e);
    });
    flush();
    const anyLocked = !nowOpen && book.some((e) => !e.open);
    const head = anyLocked ? '<p class="note" style="text-align:center">Her diary is locked now. She wears the key around her neck. When she trusts you enough, she may choose to share it.</p>' : '';
    const html = book.length ? head + parts.join('') : '<p class="muted">She hasn\'t written anything yet.</p>';
    UI.sheet(s.name + '\'s diary', `<div style="display:grid;gap:12px">${html}</div>`);
  };
})();

</script>
<script>
/* Silver River — the game flow: title, setup, seasons, courtyard life, endings, saving. */
(function () {
  'use strict';
  const G = window.SilverRiver;
  const U = G.U;
  const D = G.D;
  const M = G.Mind;
  const Sim = G.Sim;
  const UI = G.UI;
  const T = G.Talk;
  const E = G.Endings;
  const $ = (sel, root = document) => root.querySelector(sel);
