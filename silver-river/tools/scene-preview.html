<!doctype html>
<html><head><meta charset="utf-8"><title>Silver River scene preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
<style>body{margin:0;background:#222;font:12px system-ui;color:#fff}.row{display:flex;flex-wrap:wrap;gap:6px;padding:6px}.cell{width:320px}.cell svg{width:320px;height:240px;display:block}</style></head><body>
<!-- Dev tool: ?season=spring&tod=day -->
<div id="out"></div>
<script src="../src/js/core.js"></script>
<script src="../src/js/scenes.js"></script>
<script>
const S = SilverRiver.Scenes, q = new URLSearchParams(location.search);
const season = q.get('season') || 'spring', tod = q.get('tod') || 'day';
document.getElementById('out').innerHTML = '<div class="row">' + S.list.map((n) => `<div class="cell">${S.render(n, { season, tod, items: { books: 5, sword: 1, guqin: 1, flowers: 1, drawing: 1 }, magpies: true })}<div>${n}</div></div>`).join('') + '</div>';
</script></body></html>
